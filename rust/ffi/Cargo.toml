# The C ABI over the Rust library: one `cdylib`/`staticlib` that C, C++ and
# any FFI-capable runtime (Elixir NIFs, Lua, Python ctypes, .NET P/Invoke)
# can load. Not published to crates.io — a C consumer wants a shared object
# and a header, not a crate. A member of `..`'s workspace, so it builds from
# the one `rust/Cargo.lock`; `..`'s package `exclude` keeps it out of the
# library tarball.
#
# The version is not declared here. `aprv_version()` returns the core's own
# `VERSION` through aprv-surface (the core crate's version, which
# release-please bumps with every other), so the ABI cannot report a version
# that drifted from the library it wraps.
[package]
name = "apple-purchase-receipt-verifier-ffi"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.85.0"
description = "C ABI for apple-purchase-receipt-verifier."
license = "MIT"

[lib]
name = "apple_purchase_receipt_verifier_ffi"
path = "src/lib.rs"
# `rlib` too, for rust/fuzz's `ffi` target, which calls the exports as Rust
# functions; C callers link the other two.
crate-type = ["cdylib", "staticlib", "rlib"]

# The library through its binding boundary (docs/rust-core/SURFACE.md §9,
# rule 3): aprv-surface for the calls and aprv-wire for the JSON, the same
# bytes aprv.wasm returns. Nothing beyond the library's own graph enters,
# so cargo-deny's banned-crate list keeps meaning what it means.
[dependencies]
aprv-surface = { path = "../bindings/surface" }
aprv-wire = { path = "../bindings/wire" }
# Writes the error document's strings; the library already reads JSON
# with it, so the graph is unchanged.
serde_json = "1"

[dev-dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
