# aprv-server: the `aprv` binary. It runs the released aprv.wasm component
# through Wasmtime and adds no verification logic of its own: a route or a
# command picks one of the four WIT operations and passes the bytes through
# (docs/rust-core/ARCHITECTURE.md §7.7).
#
# Not published to crates.io and not a member of the core's package, like
# `ffi/` and `fuzz/`: `..`'s `exclude` keeps it out of the library tarball,
# and it carries its own `Cargo.lock`. Its version is 0.0.0 because the
# binary reports the hash of the component it embeds, not a crate version.
#
# Two builds of the same source (see README.md, "The precompile rule"):
#
#   --features compile   the full engine (Cranelift): `aprv precompile`
#                        writes the .ccwasm, and `--component FILE.wasm`
#                        compiles a component at start (development, tests)
#   (no features)        the shipped binary: runtime-only Wasmtime that
#                        deserializes only the .ccwasm embedded at build
#                        time from APRV_CCWASM
[package]
name = "aprv-server"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.85.0"
description = "aprv-server: HTTP server and one-shot CLI hosting aprv.wasm through Wasmtime."
license = "MIT"

# Its own workspace root, like fuzz/ and bindings/abi/tests/: an empty
# table ends cargo's upward search for a workspace here, so the server
# builds on its own lockfile whatever ../Cargo.toml's `members` lists. (A
# member "." there once overrode its `exclude` of `server`, cargo 1.98.1.)
[workspace]

[[bin]]
name = "aprv"
path = "src/main.rs"

[features]
# Cranelift, for `aprv precompile` and for compiling a component at start.
# Off in the shipped binary. Add `wasmtime/all-arch` to precompile for
# another architecture than the build host's.
compile = ["wasmtime/cranelift"]

[dependencies]
# Runtime-only Wasmtime plus the component model: no Cranelift, Winch,
# cache, WAT parser, async, GC, threads, profiling or pooling allocator.
wasmtime = { version = "=49.0.1", default-features = false, features = ["runtime", "std", "component-model"] }
getrandom = "0.4"
sha2 = { version = "0.11", default-features = false }
# Only for the roots configuration: base64 lines and PEM `CERTIFICATE`
# blocks are decoded to take each root's SHA-256 fingerprint for
# `GET /v1/info`. `pem` reads the blocks, on the same base64 crate.
base64 = { version = "0.23", default-features = false, features = ["std"] }
pem = { version = "4", default-features = false, features = ["std"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "macros"] }
# Reads a request body frame by frame, to cap it (src/http.rs, read_capped).
http-body-util = "0.1"

[build-dependencies]
sha2 = { version = "0.11", default-features = false }
serde_json = "1"
# Reads openapi.yaml at build time; the binary serves it as JSON.
serde_yaml_ng = "0.10"

[dev-dependencies]
wat = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

# Tests compile the component with Cranelift at start; an unoptimised
# Cranelift takes minutes over a 3 MB component, an optimised one seconds.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
