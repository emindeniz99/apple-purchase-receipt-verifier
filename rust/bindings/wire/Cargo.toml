# aprv-wire: the 0.7 canonical JSON bytes of aprv-surface's values, and
# the reader of aprv.wasm's `init` configuration (docs/rust-core/SURFACE.md
# §4, ARCHITECTURE.md §4). The C ABI and aprv.wasm both write through it,
# so the two boundaries cannot drift apart; `schema/` describes its shapes
# as JSON Schema 2020-12 (DECISIONS.md R34). Not published.
[package]
name = "aprv-wire"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.85.0"
description = "The 0.7 canonical JSON of apple-purchase-receipt-verifier's results, for the bindings."
license = "MIT"

[dependencies]
aprv-surface = { path = "../surface", default-features = false }
# Bytes are padded standard base64 on the wire; the core's own encoder
# crate and version.
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
# Already in the core's graph (the core reads JSON with it); used here for
# string escaping and for reading the configuration, never with serde_derive.
serde_json = "1"

[features]
default = ["vendored"]
vendored = ["aprv-surface/vendored"]

[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
