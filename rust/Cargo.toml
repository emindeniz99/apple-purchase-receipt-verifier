[package]
name = "apple-purchase-receipt-verifier"
version = "0.6.0"
edition = "2021"
rust-version = "1.85.0"
description = "Offline verification of Apple App Store JWS payloads and legacy PKCS#7 app receipts against pinned Apple roots."
license = "MIT"
repository = "https://github.com/emindeniz99/apple-purchase-receipt-verifier"
readme = "README.md"
keywords = ["apple", "appstore", "receipt", "storekit", "verification"]
categories = ["cryptography", "authentication"]
# The published tarball is src/, certs/, README.md, LICENSE, the manifest
# and Cargo.lock (cargo always packs it; a consumer's build ignores it). The
# tests read ../../fixtures, which a registry consumer does not have, and
# RELEASE.md describes release wiring rather than the crate.
exclude = ["tests/**", "examples/bench.rs", "fuzz/**", "ffi/**", "RELEASE.md", "rustfmt.toml", "deny.toml"]

[lib]
name = "apple_purchase_receipt_verifier"
path = "src/lib.rs"

# Nine crates, all of them primitives. Every byte of attacker-supplied
# ASN.1 — certificates, CMS, receipt payloads, keys, signatures — is parsed
# by this crate's own bounded reader, so no third-party parser decides what a
# key or a signature is, and the JSON it reads (a JWS header and payload, the
# endpoint request body) goes through its own bounded reader as well. What
# is delegated is arithmetic: modular
# exponentiation, two curves, the digests, and the base64 decode of
# `receipt-data` and `x5c` entries (`src/base64.rs`).
#
# `md-5` is here because a receipt signer and a certificate under a pinned
# root may use any digest the crypto crates verify (owner, 2026-09-27, Q14
# and Q15 of docs/design/0.7-hardening-parity.md). It is only ever applied
# to bytes a pinned chain signed.
#
# `deny.toml` bans, as a build-breaking rule, every crate that could bring a
# system trust store or a network client into the tree.
#
# `u64_digit` is on `rsa`'s default list and is restored here after
# `default-features = false` dropped it. Without it `num-bigint-dig` works in
# 32-bit limbs and each RSA-2048 verify, three per receipt, costs about 1.7x
# as much. A unit test in `src/crypto.rs` fails if the feature goes missing.
[dependencies]
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
p384 = { version = "0.13.1", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
sha1 = { version = "0.10.7", default-features = false, features = ["oid"] }
md-5 = { version = "0.10.6", default-features = false, features = ["oid"] }
sha2 = { version = "0.10.9", default-features = false, features = ["oid"] }
digest = "0.10.7"
subtle = "2.6"
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
libtest-mimic = "0.8.2"
hex = "0.4.3"
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The conformance suite reports one line per shared case, so it runs its own
# harness.
[[test]]
name = "conformance"
harness = false

# The cross-port benchmark (BENCHMARKS.md). It reads ../fixtures, like the
# tests, so it is excluded from the package above.
[[example]]
name = "bench"
