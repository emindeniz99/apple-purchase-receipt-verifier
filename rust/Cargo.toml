[package]
name = "apple-purchase-receipt-verifier"
version = "0.11.0"
edition = "2021"
rust-version = "1.85.0"
description = "Offline verification of Apple App Store JWS payloads and legacy PKCS#7 app receipts against pinned Apple roots."
license = "MIT"
repository = "https://github.com/emindeniz99/apple-purchase-receipt-verifier"
readme = "README.md"
keywords = ["apple", "appstore", "receipt", "storekit", "verification"]
categories = ["cryptography", "authentication"]
# The published tarball is src/, certs/, README.md, LICENSE, the manifest
# and Cargo.lock (cargo always packs it; a consumer's build ignores it). The
# tests read ../../fixtures, which a registry consumer does not have, and
# RELEASE.md describes release wiring rather than the crate.
exclude = ["tests/**", "examples/bench.rs", "fuzz/**", "ffi/**", "openssl/**", "bindings/**", "server/**", "vendor/**", "RELEASE.md", "rustfmt.toml", "rust-toolchain.toml", "deny.toml", ".cargo/**"]

[lib]
name = "apple_purchase_receipt_verifier"
path = "src/lib.rs"

# OpenSSL parses every byte of attacker-supplied ASN.1 (certificates, CMS,
# the receipt payload, the keys and signatures inside them) and does the
# signature arithmetic, through `aprv-openssl` (openssl/), the one crate
# under this one that holds `unsafe` code (docs/rust-core/DECISIONS.md
# R21). This crate keeps Apple's policy: the pinned roots, the marker OIDs,
# the chain instant, the caps, the base64 and JSON rules, the reasons and
# the endpoint. The JSON it reads (a JWS header and payload, the endpoint
# request body) goes through `serde_json`, each document as a map of raw
# member values so that nothing it does not read is built (`src/json.rs`,
# docs/rust-core/DECISIONS.md R40); `base64` decodes `receipt-data` and
# `x5c` entries (`src/base64.rs`).
#
# `deny.toml` bans, as a build-breaking rule, every crate that could bring a
# system trust store or a network client into the tree.
#
# The adapter is published beside this crate at the same version, so its
# requirement moves with every release (release-please-config.json).
[dependencies]
aprv-openssl = { version = "0.11.0", path = "openssl", default-features = false } # x-release-please-version
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
# The calendar and the US Pacific offset behind Apple's `_pst` dates
# (src/datetime.rs). `static` embeds America/Los_Angeles, and only it, at
# compile time through `tz::get!`; the build reads no time-zone file and
# the module carries no database (docs/rust-core/DECISIONS.md R38).
jiff = { version = "0.2.37", default-features = false, features = ["static"] }
serde_json = { version = "1", features = ["raw_value"] }

[features]
default = ["vendored"]
# OpenSSL 4.0.2 built from source inside the build (openssl-src, through
# the adapter). A build that links a prebuilt OpenSSL instead, as the
# wasm32-wasip1 build must, sets OPENSSL_NO_VENDOR=1 with OPENSSL_DIR, or
# turns this off.
vendored = ["aprv-openssl/vendored"]
# The adapter's test seams, re-exported under `__internal`: the key-use
# record and the full-decode counter. Internal and unstable. Only this
# crate's own tests turn it on, through the dev-dependency on itself
# below, so aprv.wasm, the C ABI and aprv-server never carry them.
test-seams = ["aprv-openssl/test-seams"]

[dev-dependencies]
# This crate with its test seams, so a plain `cargo test` builds them and
# no test that reads one is ever skipped. Path-only, so `cargo package`
# drops it from the published manifest.
apple-purchase-receipt-verifier = { path = ".", default-features = false, features = ["test-seams"] }
# The tests read the fixtures they take apart and rebuild (BER: Apple's and
# Xcode's receipts use indefinite lengths) and write DER with asn1-rs
# (tests/common/; docs/rust-core/DECISIONS.md R43). Tests only: the library
# parses nothing with it.
asn1-rs = "0.7.2"
libtest-mimic = "0.8.2"
hex = "0.4.3"
# The tests mint their own certificates, keys and signatures, and hash
# fixtures, with the same OpenSSL the adapter links.
openssl = "0.10.81"
serde = { version = "1", features = ["derive"] }

# The conformance suite reports one line per shared case, so it runs its own
# harness.
[[test]]
name = "conformance"
harness = false

# The cross-port benchmark (BENCHMARKS.md). It reads ../fixtures, like the
# tests, so it is excluded from the package above. As an example it gets
# the dev-dependencies, so it carries the test seams: one thread-local
# read per signature check, which the shipped builds do not pay.
[[example]]
name = "bench"

# One workspace and one lockfile (docs/rust-core/ARCHITECTURE.md §2): the
# core, its OpenSSL adapter, the binding-neutral model (aprv-surface), its
# JSON (aprv-wire), the canonical-ABI guest built as aprv.wasm (aprv-abi)
# and the C ABI. `fuzz/` stays outside, because it builds on nightly, with
# its own lockfile and the same patch below. `server/` (aprv-server) runs
# aprv.wasm through Wasmtime and depends on no crate here; it keeps its
# own lockfile, so Wasmtime's graph stays out of this one. `vendor/` is
# the patched openssl-sys. `bindings/abi/tests/` is the ABI test host, a
# package of its own for the same reason as the server. The root package is
# a member by being the root: listing "." among the members as well made it
# an ancestor member that overrode `exclude`, so an excluded crate without a
# `[workspace]` table of its own could not run cargo.
[workspace]
members = [
    "openssl",
    "bindings/surface",
    "bindings/wire",
    "bindings/abi",
    "ffi",
    # "server",
]
exclude = ["fuzz", "vendor", "server", "bindings/abi/tests"]
resolver = "2"

# aprv.wasm (bindings/abi/build.sh builds it with `--profile wasm`): a
# release build with one codegen unit and link-time optimisation, as every
# measured module was, and `panic = "abort"`, since wasm32-wasip1 cannot
# unwind. Its own profile so the native release builds keep unwinding:
# the core and the C ABI contain a panic and report it as a verdict.
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# openssl-sys 0.9.117 takes only openssl-src 300.x (OpenSSL 3.x). This copy
# differs from the crates.io release in one manifest line, which lets its
# `vendored` feature build OpenSSL 4.0.2 from openssl-src 400.0.1+4.0.2;
# vendor/refresh-openssl-sys.sh rebuilds it from the release and checks
# that. A patch applies only inside this workspace: a crates.io user of the
# core gets openssl-src 300.x until openssl-sys widens its requirement.
[patch.crates-io]
openssl-sys = { path = "vendor/openssl-sys" }
