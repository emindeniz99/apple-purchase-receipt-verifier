# cargo-deny policy. This file is the mechanised form of two rules the
# library states in prose and cannot enforce in code alone:
#
#   * anchors come only from the caller or from the three bundled Apple
#     roots — never from an operating-system trust store;
#   * nothing on any code path touches the network.
#
# A dependency bump cannot introduce either by accident, because the crates
# that would carry them are refused here at build time.
#
# OpenSSL itself is a dependency: `aprv-openssl` (openssl/) links libcrypto
# for all parsing and signature arithmetic. That it never loads a trust
# store, a configuration file or a provider module from the environment is
# enforced by the adapter itself (`OPENSSL_init_crypto` with
# NO_LOAD_CONFIG, no X509_STORE default paths), asserted by the source
# scan in tests/trust_pinning.rs and by openssl/tests/isolation.rs, which
# plants SSL_CERT_FILE, SSL_CERT_DIR and a hostile OPENSSL_CONF.

[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# `ffi/` depends on this crate by path with no version requirement, which is
# what an unpublished sibling crate does and what cargo-deny counts as a
# wildcard. The rule above still applies to every registry dependency, which
# is where a wildcard would actually be dangerous: a path dependency resolves
# to the tree in front of you, not to whatever crates.io serves next.
allow-wildcard-paths = true

deny = [
    # System trust stores.
    { name = "rustls-native-certs" },
    { name = "webpki-roots" },
    # Finds the system certificate paths and exports them as SSL_CERT_FILE
    # and SSL_CERT_DIR, the one way an OpenSSL user acquires the OS trust
    # store without asking for it.
    { name = "openssl-probe" },
    { name = "native-tls" },
    { name = "schannel" },
    { name = "security-framework" },
    # Network clients.
    { name = "reqwest" },
    { name = "curl-sys" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "tokio" },
    { name = "async-std" },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Exactly the licences the current graph carries. cargo-deny warns on an
# allowance nothing uses, so this list is kept honest rather than generous.
allow = [
    "MIT",
    "Apache-2.0",
    # unicode-ident's data tables, under proc-macro2, under the build-time
    # proc macros openssl-macros (the openssl crate's) and serde_derive
    # (aprv-wire's), and the test-only clap_derive and asn1-rs's
    # asn1-rs-derive (with its helper synstructure), asn1-rs-impl,
    # displaydoc and thiserror-impl. Nothing of it is linked into the
    # library.
    "Unicode-3.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
