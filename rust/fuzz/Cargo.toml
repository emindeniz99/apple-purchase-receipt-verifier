# Fuzz targets for the three public verifiers, the endpoint, the C ABI and
# the two payload decoders behind a signature. Not published — `..`'s
# `exclude` keeps this directory out of the tarball — and run with
# `./run.sh <target> [seconds]`, which pairs each target with the fixture
# directories that seed it. See README.md.
[package]
name = "apple-purchase-receipt-verifier-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# receipt-payload parses what `to_json` writes.
serde_json = "1"

# `test-seams` for the payload targets' hooks. Cargo turns a feature on for
# every target in this package, so the others build with it too; it adds
# only the `__internal` items they do not call and the adapter's key-use
# and full-decode records, which store nothing unless a test is counting.
# No verdict depends on it.
[dependencies.apple-purchase-receipt-verifier]
path = ".."
features = ["test-seams"]

# The `ffi` target: the C ABI's exports as Rust functions (its rlib), and
# the surface and wire crates it is checked against.
[dependencies.apple-purchase-receipt-verifier-ffi]
path = "../ffi"

[dependencies.aprv-surface]
path = "../bindings/surface"

[dependencies.aprv-wire]
path = "../bindings/wire"

[[bin]]
name = "verify-receipt"
path = "fuzz_targets/verify-receipt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify-receipt-base64"
path = "fuzz_targets/verify-receipt-base64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify-transaction"
path = "fuzz_targets/verify-transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "endpoint-json"
path = "fuzz_targets/endpoint-json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi"
path = "fuzz_targets/ffi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receipt-payload"
path = "fuzz_targets/receipt-payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jws-payload"
path = "fuzz_targets/jws-payload.rs"
test = false
doc = false
bench = false

# Its own workspace root, for the reason ../ffi/Cargo.toml gives, and the
# same openssl-sys patch as ../Cargo.toml.
[workspace]

[patch.crates-io]
openssl-sys = { path = "../vendor/openssl-sys" }
