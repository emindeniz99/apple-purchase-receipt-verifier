# Fuzz targets for the three public verifiers, the endpoint and the C ABI. Not published — `..`'s `exclude` keeps this directory out of
# the tarball — and run with `./run.sh <target> [seconds]`, which pairs each
# target with the fixture directories that seed it. See README.md.
[package]
name = "apple-purchase-receipt-verifier-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.apple-purchase-receipt-verifier]
path = ".."

# The `ffi` target: the C ABI's exports as Rust functions (its rlib), and
# the surface and wire crates it is checked against.
[dependencies.apple-purchase-receipt-verifier-ffi]
path = "../ffi"

[dependencies.aprv-surface]
path = "../bindings/surface"

[dependencies.aprv-wire]
path = "../bindings/wire"

[[bin]]
name = "verify-receipt"
path = "fuzz_targets/verify-receipt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify-receipt-base64"
path = "fuzz_targets/verify-receipt-base64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify-transaction"
path = "fuzz_targets/verify-transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "endpoint-json"
path = "fuzz_targets/endpoint-json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi"
path = "fuzz_targets/ffi.rs"
test = false
doc = false
bench = false

# Its own workspace root, for the reason ../ffi/Cargo.toml gives, and the
# same openssl-sys patch as ../Cargo.toml.
[workspace]

[patch.crates-io]
openssl-sys = { path = "../vendor/openssl-sys" }
