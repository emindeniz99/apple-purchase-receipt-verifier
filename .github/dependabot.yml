# Keeps the SHA-pinned actions (and the digest-pinned swift container)
# current — pins without updates just rot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
