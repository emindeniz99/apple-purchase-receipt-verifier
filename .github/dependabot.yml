# Keeps the SHA-pinned actions (and the digest-pinned swift container)
# current — pins without updates just rot. Every ecosystem waits seven days
# after a release before proposing it, so a version pulled or patched in its
# first week (the common shape of a hijacked package) never reaches a PR.
version: 2
updates:
  # `/` covers .github/workflows only; .github/actions/* holds the
  # composite actions the workflows call (place-module), with pins of their
  # own. group-by keeps one pull request per action, so a pin moves in the
  # workflows and in the composite actions together.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        group-by: dependency-name
  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # @types/node deliberately tracks the ENGINES FLOOR (node >=20), not
      # the newest Node: typing against a newer API surface would let code
      # use APIs Node 20 lacks without tsc noticing. Bump it only when the
      # engines floor itself is raised (a semver-major decision).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # uv, not pip: python/uv.lock is what CI installs from, and only the uv
  # ecosystem reads and rewrites that file. The one runtime dependency is
  # wasmtime, with no upper pin by design (R27): a new major changes the
  # runtime under the module, and tests/test_cache.py is what notices a
  # change in Wasmtime's cache configuration format.
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # JUnit 6 raised its baseline above Java 8/11 while this suite must
      # execute on a real JDK 8 JVM (the java-runtime-8 CI leg) — the
      # engines-floor principle again: test deps track the OLDEST runtime
      # we claim. PR #2's rebased CI failed every Java leg on 6.1.3.
      # Revisit only if the artifact's Java 8 floor is ever raised.
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        update-types: ["version-update:semver-major"]
  # jvm-interop is a second Maven module (the Kotlin/Scala/Groovy consumer
  # checks) with its own pom; dependabot watches only the directories it is
  # told about, and this one drifted unnoticed.
  - package-ecosystem: maven
    directory: /jvm-interop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # java-bench (the JMH benchmarks) is a third standalone pom, pinning JMH and
  # its Maven plugins, and dependabot watches only the directories it is told
  # about.
  - package-ecosystem: maven
    directory: /java-bench
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The Spring Boot smoke is a standalone pom too. Its spring-boot.version
  # is the oldest supported Boot line and ci.yml's matrix names every line,
  # so only patch releases of the BOM are proposed here; a new Boot line is
  # a matrix change (SUPPORT-MATRIX.md rule 4).
  - package-ecosystem: maven
    directory: /java/samples/spring-boot-smoke
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-dependencies"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The library under test: CI sets its version from java/pom.xml.
      - dependency-name: "io.github.emindeniz99:*"
  # java-wasm (the -wasm artifact: Endive and the aprv-server engine) is a
  # fourth standalone pom. The JUnit floor above applies here too: its
  # java-wasm-runtime-8 job runs the suite on a real Java 8 JVM.
  - package-ecosystem: maven
    directory: /java-wasm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The Elixir consumer of the C ABI. It has no Hex dependencies today
  # (mix.exs says why), so this entry proposes nothing yet; it is here so a
  # dependency added later is watched from the start rather than drifting
  # the way jvm-interop's did. The C ABI crate itself (rust/ffi) is a member
  # of the rust/ workspace with no lockfile of its own; /rust covers it.
  - package-ecosystem: mix
    directory: /rust/ffi/examples/elixir
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The fuzz harnesses are packages of their own (a separate SwiftPM
  # package, a separate crate) and dependabot only watches the directories
  # it is told about. Same cooldown: a fuzz job runs the dependency's code
  # on every push, so a hijacked release reaches it exactly as it would the
  # library.
  - package-ecosystem: cargo
    directory: /rust/fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The same OpenSSL pins as /rust, whose entry says why.
      - dependency-name: openssl-sys
      - dependency-name: openssl-src
        update-types: ["version-update:semver-major"]
  - package-ecosystem: swift
    directory: /swift/fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # swift/bench is the benchmark's own SwiftPM package, shaped like
  # swift/fuzz: the library by path plus a committed Package.resolved that
  # nothing else here updates. ci.yml's swift-fuzz job builds it with
  # --force-resolved-versions, so those pins are what it compiles against.
  - package-ecosystem: swift
    directory: /swift/bench
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The library module has no requirements and only follows the toolchain
  # directive; /go/tools tracks staticcheck and govulncheck. Separate entries
  # are what stops a linter bump from touching the published module graph.
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The go.mod floor (Go 1.25, set by wazero 1.12) is a tested claim.
      # wazero's one requirement, golang.org/x/sys, raised its own go
      # directive to 1.26 in v0.48.0, so taking it would move the floor
      # again. Raise the floor first, deliberately, then drop this rule
      # (go/CI-NOTES.md). A wazero release that needs a newer Go fails the
      # go job's 1.25 leg rather than slipping through.
      - dependency-name: golang.org/x/sys
        versions: [">=0.48.0"]
  - package-ecosystem: gomod
    directory: /go/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # ruby/Gemfile, not ruby/gemfiles/tools.gemfile: dependabot's bundler
  # ecosystem only discovers a manifest named Gemfile or gems.rb, so the lint
  # and type toolchain (rubocop, steep, rbs) and the fuzzer (ruzzy) are bumped
  # by hand until those files are renamed, even though both now have committed
  # locks. The library's one runtime dependency is wasmtime, which tracks
  # Wasmtime majors: a bump that raises its floor changes the runtime under
  # the module, like the Python and .NET runtime bumps.
  - package-ecosystem: bundler
    directory: /ruby
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The MSRV floor is a claim this repository tests (the rust job's 1.85.0
  # leg), so a bump that raises it is a deliberate decision and not a
  # dependabot merge. When one of these needs a newer Rust, raise
  # rust-version in rust/Cargo.toml in the same pull request, or ignore the
  # bump with a comment saying which floor it would have forced.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # rust/vendor/openssl-sys is a patched copy of openssl-sys 0.9.117; a
      # newer openssl-sys leaves the patch unused and brings back
      # openssl-src 300.x (OpenSSL 3), which aprv-openssl refuses. Both move
      # by hand with rust/vendor/refresh-openssl-sys.sh (rust/openssl/CI-NOTES.md).
      - dependency-name: openssl-sys
      - dependency-name: openssl-src
        update-types: ["version-update:semver-major"]
      # wit-bindgen's generated glue is part of the released module's bytes,
      # so its exact pin moves only together with the wit-bindgen CLI in
      # tools/wasm-toolchain.sh (rust/bindings/CI-NOTES.md).
      - dependency-name: wit-bindgen
  # The server, the ABI tests and the abi-call fuzz target pin the same
  # Wasmtime exactly: the ABI is tested on the runtime the server ships, so
  # the group moves all three in one pull request. rust/server is outside
  # the rust/ workspace, with its own lockfile, and so are
  # rust/bindings/abi/tests and rust/fuzz/abi.
  - package-ecosystem: cargo
    directories:
      - /rust/server
      - /rust/bindings/abi/tests
      - /rust/fuzz/abi
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"
  # The server image's two bases (rust slim for the build, distroless
  # static for the runtime) are pinned by digest.
  - package-ecosystem: docker
    directory: /rust/server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # No ignore rule: the multi-line PHPUnit constraint already lets each
  # runtime resolve its own line, so the @types/node and JUnit pattern has no
  # analogue here.
  - package-ecosystem: composer
    directory: /php
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The root composer.json is the manifest Packagist reads (BOOTSTRAP.md,
  # layout A). It has no lockfile and two runtime requirements, psr/clock
  # and symfony/process; this entry keeps those constraints watched like
  # php/'s.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # dotnet/fuzz is outside ApplePurchaseReceiptVerifier.sln, and the entry
  # above discovers projects through that solution, so SharpFuzz (pinned
  # inline in the fuzz csproj, not in Directory.Packages.props) had no watcher.
  # dotnet/bench gets no entry: it has no PackageReference of its own, only
  # the library by project reference, so there is nothing for one to bump.
  - package-ecosystem: nuget
    directory: /dotnet/fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # tools/ has its own lockfile for the CI tools (ajv, for the wire-schema
  # check); a bump there changes what CI validates answers with.
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The clean room tools/reproduce-wasm.sh --container builds: its Debian
  # base is pinned by digest, and a pin without updates rots.
  - package-ecosystem: docker
    directory: /tools/reproduce
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
