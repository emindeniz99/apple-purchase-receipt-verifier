# Keeps the SHA-pinned actions (and the digest-pinned swift container)
# current — pins without updates just rot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
    ignore:
      # @types/node deliberately tracks the ENGINES FLOOR (node >=20), not
      # the newest Node: typing against a newer API surface would let code
      # use APIs Node 20 lacks without tsc noticing. Bump it only when the
      # engines floor itself is raised (a semver-major decision).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
