name: place-module
description: >-
  Puts the module this run's rust-wasm job built where one host package
  reads it. Downloads the aprv-wasm artifact (aprv.wasm,
  aprv.component.wasm, aprv.wit, SHA256SUMS) to $RUNNER_TEMP/aprv, then
  runs .github/scripts/place-module.sh, which checks every file against
  SHA256SUMS, copies the module into the host package (Node takes the
  component) and rewrites that host's tracked pin in the checkout. Jobs
  call it as `uses: ./.github/actions/place-module`, after their checkout:
  the script runs from the checkout, because it writes into that tree. The
  path form, not GitHub's `$/` self-repository form: `$/` loads the action
  from the repository archive, and .gitattributes export-ignores
  everything outside the PHP package, .github/ included (.github/zizmor.yml).
  It caches nothing, and the run step always uses bash, also on Windows
  and in container jobs.

inputs:
  host:
    description: >-
      The host package to place the module in, as place-module.sh names
      it: go, swift, python, ruby, dotnet, java or node.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: aprv-wasm
        path: ${{ runner.temp }}/aprv
    - shell: bash
      env:
        HOST: ${{ inputs.host }}
      run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" "$HOST"
