# CI for apple-purchase-receipt-verifier: the same shared fixture suite in
# all nine languages, on every runtime each artifact claims to support.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseding a branch's run saves a runner; superseding main's destroys
# evidence. Every commit on main is a release candidate -- release.yml's
# ci-passed gate polls for a completed run on the exact tagged SHA -- so a
# main commit whose run was cancelled has no record that its tree ever
# passed. That is not hypothetical: run 132 was cancelled by a docs commit
# pushed 43 seconds after it, and runs 123 and 125 went the same way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # Every Temurin line still in support, LTS or not: 26 is the
        # current feature release and was missing until an audit against
        # api.adoptium.net found it. The build itself needs javac 9+ for
        # --release 8; the artifact is Java 8 bytecode (major version 52),
        # and the java-runtime-8 job below runs the suite on a real
        # Temurin 8 JVM.
        jdk: ["11", "17", "21", "25", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - run: mvn -B test
        working-directory: java

  # The floor check: build with a modern javac, run the tests on a real
  # Temurin 8 JVM via surefire's jvm override — the `java 8` claim in the
  # pom is verified, not asserted (the toolchain itself can't build on 8).
  java-runtime-8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two JDKs: 8 for the test JVM (exposed as JAVA_HOME_8_X64), then 25
      # last so it wins JAVA_HOME and drives Maven itself.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test -Pjdk8-runtime "-Djdk8.jvm=${JAVA_HOME_8_X64}/bin/java"
        working-directory: java

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Every supported LTS line plus current (endoflife.date/nodejs);
        # the engines floor (20) stays tested even after its EOL because
        # the package still claims it.
        node: ["20", "22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # npm ci, not npm install: the committed lockfile is the contract and
      # this is the job that verifies it.
      - run: npm ci && npm test
        working-directory: node

  # The npm package's runtime claims (README "JavaScript runtimes"): the
  # built dist runs the same checks on Bun, Deno and Cloudflare workerd,
  # workerd at all three compatibility configurations it supports. The
  # runtimes come from npm at pinned versions so no extra action is
  # needed; bump the pins in node/package.json's runtime:* scripts.
  #
  # One leg per runtime rather than one job running all six. As a single
  # job it downloaded Bun, Deno and workerd in sequence and hit the
  # 15-minute timeout; split, each leg downloads one runtime and they run
  # at the same time. fail-fast is off because "Bun passed and Deno did
  # not" is the useful answer, not the first failure.
  node-runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - node
          - bun
          - deno
          - workerd-floor
          - workerd-compat-v2
          - workerd-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci && npm run runtime:${{ matrix.runtime }}
        working-directory: node

  # roots-data.ts is generated from certs/; a certs change that forgets to
  # regenerate it would ship stale trust anchors. Its own job now that the
  # runtime smoke is a matrix, so it runs once rather than six times.
  node-roots-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node scripts/gen-roots.mjs && git diff --exit-code src/roots-data.ts
        working-directory: node

  # The /web entry point's runtime claims (README "JavaScript runtimes"):
  # the built dist/web runs the same smoke on Node's WebCrypto, on the
  # Vercel Edge runtime (@edge-runtime/vm, a devDependency) and on
  # Cloudflare workerd configured with NO compatibility flags, which is
  # the configuration where node:crypto does not exist. workerd comes
  # from npm at a pinned version; bump the pin in node/package.json's
  # test:runtimes:web.
  node-runtimes-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci && npm run test:runtimes:web
        working-directory: node

  # Fastly Compute is the fourth WebCrypto-only runtime, and the one that
  # forced the /web build to import keys as JWK: Fastly's crypto.subtle has
  # no 'spki' import format at all, so every chain failed there until the
  # conversion landed. js-compute-runtime builds the smoke to wasm and
  # viceroy, Fastly's own local runtime, serves it. viceroy is a Rust
  # binary, not an npm package, which is why this is its own job and why it
  # is slower than its siblings.
  node-runtimes-fastly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      # --locked so the published lockfile decides the build, and a pinned
      # version so a viceroy release cannot change what this job proves.
      - run: cargo install viceroy --locked --version 0.20.1
      - run: npm ci && npm run test:runtimes:fastly
        working-directory: node

  # Proves jvm-interop/README.md's claim: the published jar is usable from
  # other JVM languages, not just Java. Builds java/ first with install,
  # not package, so jvm-interop resolves it as a real Maven coordinate the
  # way a consumer would from Central, then runs the Kotlin and Scala 3
  # interop tests. Never part of the release: jvm-interop has no
  # release-please entry and no <module> anywhere.
  jvm-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B install -DskipTests
        working-directory: java
      - run: mvn -B test
        working-directory: jvm-interop

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Every supported line (endoflife.date/python) plus 3.9: EOL, but
        # it is the requires-python floor and stays tested while claimed.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-uv provisions the interpreter too (uv python install), so this
      # is one action where it used to be setup-python plus pip. uv builds
      # every leg's Python from python-build-standalone, including the 3.9
      # floor, so the matrix keeps proving exactly what it proved before.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      # --no-project on purpose: this job tests the SOURCE TREE against the
      # two runtime dependencies, not an installed wheel. `python -m` puts
      # the working directory on sys.path, so the package still resolves
      # from python/ exactly as it did under pip. Deliberately no lockfile
      # and no pinned versions -- resolving cryptography fresh on every run
      # is what makes this matrix able to catch an upstream release that
      # breaks the >= 42 compatibility shim in _chain.py.
      - run: uv run --no-project --with cryptography --with asn1crypto python -m unittest discover -s tests
        working-directory: python

  # Every Swift the manifest admits (tools 6.1 is the floor swift-crypto
  # 4.5.1 needs), on Linux, plus the Xcode toolchain on macOS. A test helper
  # once compiled on 6.3 locally and failed on the 6.1 container; one
  # compiler is not a matrix.
  swift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Digest-pinned (mutable tags are the container flavor of action
        # retagging); dependabot bumps the digests, the comments name the tags.
        include:
          - swift: "6.1"
            image: swift:6.1@sha256:98ee3a8469ce2a9c2f543ef2577939ab44e2dfc9b5ed710732a59e5dd64f9c4a
          - swift: "6.2"
            image: swift:6.2@sha256:29b983751c605c2d3102d2ab93438c6e0cadf110d9d2aa6e929b6dec9dcb7cbc
          - swift: "6.3"
            image: swift:6.3@sha256:56ef1be2c1ca36f4c52440357dc1fcdfdb5e113587134fcadeef57c225c71b54
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Manifest lives at the repo root (SwiftPM requirement); no
      # working-directory needed.
      - run: swift test
  swift-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version && swift test

  # Every Go line the module claims, down to the go.mod floor: a floor
  # nothing executes is a claim, not a fact — the analogue of the
  # java-runtime-8 job above.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.23", "1.24", "1.25", "1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      # GOTOOLCHAIN=local is the whole point of the matrix. Without it Go
      # downloads a newer toolchain whenever go.mod asks for one, and the
      # "go 1.22" floor would be compiled by 1.27 on every leg.
      - run: go version && go test ./...
        working-directory: go
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly

  # Windows earns its place: the conformance adapter walks the filesystem to
  # find fixtures/, the .b64 fixtures pick up CRLF on checkout, and the
  # whitespace-stripping base64 decode is what makes that survive. macOS earns
  # its place because x509.Certificate.Verify falls back to the OS trust
  # evaluation there, and this library must still never reach it. One Go
  # version each, not a cross product.
  go-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - run: go test ./...
        working-directory: go
        env:
          GOFLAGS: -mod=readonly

  # -count=2 so a second run in the same process catches state left behind by
  # the first, which is what a cached buffer or a memoised location would be.
  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - run: go test -race -count=2 ./...
        working-directory: go

  # The seed corpora already run on every `go test`; this is the exploratory
  # pass. A crasher it finds is written under testdata/fuzz/ — commit that
  # file, it becomes a permanent regression case.
  go-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: fuzz the DER reader
        run: go test ./internal/der -run '^FuzzParseDER$' -fuzz '^FuzzParseDER$' -fuzztime=60s
        working-directory: go
      - name: fuzz the verifiers
        run: |
          set -euo pipefail
          for target in FuzzVerifyReceipt FuzzVerifyReceiptBase64 FuzzVerifyTransaction; do
            go test . -run "^${target}\$" -fuzz "^${target}\$" -fuzztime=60s
          done
        working-directory: go

  # gofmt, vet, staticcheck and govulncheck. The linters are pinned in
  # go/tools/go.mod, a module of its own so their Go floor (1.26, staticcheck
  # v0.8.1's requirement) never becomes the library's. staticcheck cannot lint
  # another module in place, so the binaries are built in go/tools and run
  # from go/.
  go-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: go
      - run: go vet ./...
        working-directory: go
      - name: build the pinned linters
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
          go build -o "$RUNNER_TEMP/govulncheck" golang.org/x/vuln/cmd/govulncheck
        working-directory: go/tools
      - run: "$RUNNER_TEMP/staticcheck ./..."
        working-directory: go
      # govulncheck reports only reachable vulnerabilities, and the library has
      # no dependencies, so anything it reports is a standard-library advisory
      # reached through x509.ParseCertificate on attacker-supplied bytes.
      - run: "$RUNNER_TEMP/govulncheck ./..."
        working-directory: go
      # Structural gates: the library must never reach the OS trust store or
      # the network. The authoritative versions are Go tests that parse the
      # source (apisurface_test.go); this is a second, cruder opinion that
      # fails even if someone deletes them.
      - name: no system trust store, no network
        run: |
          set -euo pipefail
          if grep -rn --include='*.go' \
              -e 'x509\.SystemCertPool' -e 'x509\.NewCertPool' \
              -e 'x509\.VerifyOptions' -e '"net/http"' -e '"net"' \
              --exclude='*_test.go' --exclude-dir=tools --exclude-dir=gencerts .; then
            echo "::error::forbidden API in the published module"
            exit 1
          fi
        working-directory: go

  # go/roots/certs is a copy of the repository's certs/, because an embed
  # pattern may not reach outside its module directory. A copy that drifts
  # ships stale trust anchors — the Go twin of node's roots-data.ts guard.
  go-generate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - run: go generate ./... && git diff --exit-code
        working-directory: go

  ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every supported line (endoflife.date/ruby: 4.0, 3.4, 3.3) plus 3.2
        # and 3.1. Both are EOL upstream, but 3.1 is the gemspec's
        # required_ruby_version floor and Debian 12's system Ruby, so it stays
        # tested while it is claimed — the java-runtime-8 / python-3.9 rule.
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # Nothing to install: the library has no runtime dependencies and the
          # suite uses only gems that ship with Ruby. Running without Bundler is
          # also the strongest form of the zero-dependency claim — if anything
          # crept in, this leg is where it fails.
          bundler-cache: false
          working-directory: ruby
      # The OpenSSL a runner links decides whether the genuine SHA-1 legacy
      # receipt chain verifies at all. Print it so a red leg on a distro with
      # SHA-1 disabled is diagnosable from the log rather than from a bisect.
      - run: ruby -v && ruby -ropenssl -e 'puts OpenSSL::OPENSSL_LIBRARY_VERSION'
      - run: rake test
        working-directory: ruby
      # roots_data.rb inlines the anchors; ruby/certs is a copy of the
      # repository roots. Either one drifting ships stale trust anchors.
      - run: ruby script/gen_roots.rb && git diff --exit-code lib/apple_purchase_receipt_verifier/roots_data.rb
        working-directory: ruby

  # Test the artifact the consumer receives, not the working tree: the Ruby
  # shape of the two broken npm releases is spec.files losing certs/, which
  # ships a gem that loads cleanly and raises the first time anyone asks for a
  # trust anchor. APRV_PACKAGING=1 builds the gem, installs it into a GEM_HOME
  # outside the checkout and verifies a genuine receipt from a fresh process.
  ruby-gem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "4.0"]      # the floor and the newest line
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
          working-directory: ruby
      - run: APRV_PACKAGING=1 rake test TEST=test/packaging_test.rb
        working-directory: ruby

  # macOS links a different libcrypto than the Linux legs, and the SHA-1
  # legacy chain plus OpenSSL::PKCS7's behaviour are exactly the kind of thing
  # that differs between them. One current-Ruby leg is enough.
  ruby-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: false
          working-directory: ruby
      - run: ruby -ropenssl -e 'puts OpenSSL::OPENSSL_LIBRARY_VERSION'
      - run: rake test
        working-directory: ruby

  # Lint and types on one modern Ruby, deliberately outside the matrix:
  # RuboCop and Steep raise their own Ruby floors faster than this library
  # does, and a tool that cannot run on 3.1 must not be able to fail the 3.1
  # leg. Their gemfile is the only one in the port with dependencies.
  ruby-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: gemfiles/tools.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          # No cache and an explicit install: gemfiles/tools.gemfile.lock is
          # not committed, so there is no lockfile to key a cache on. Commit
          # one and this becomes bundler-cache: true.
          bundler-cache: false
          working-directory: ruby
      - run: bundle install --jobs 4
        working-directory: ruby
      - run: bundle exec rubocop
        working-directory: ruby
      - run: bundle exec rake rbs
        working-directory: ruby
      # `steep check` is deliberately not run. sig/ describes the public API,
      # which is what a consumer type-checks against and what `rbs validate`
      # proves is well-formed. Steep additionally demands a signature for
      # every internal method and constant, and against these sources it
      # reports 411 diagnostics, nearly all of them "not declared in RBS"
      # for private implementation details. Turning that green means writing
      # internal signatures for the whole library; until someone does, a job
      # that cannot pass is worse than an honest gap. See ROADMAP.md.

  # The toolchains come from the rustup already on the runner, so this port
  # pins no action beyond the checkout and caches nothing: a clean debug build
  # of the library and every test target is cheaper than restoring a cache.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Rust has no LTS lines. 1.74.0 is the floor the manifest claims, so
        # it is the one that needs proving; stable is what users have; beta
        # is the early warning.
        toolchain: ["1.74.0", "stable", "beta"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      # The floor is proven, not declared. MSRV-aware resolution runs on a
      # modern cargo: the env var is stable since 1.84 and, unlike
      # `resolver = "3"` in the manifest, is invisible to consumers — cargo
      # 1.82 refuses to parse a manifest carrying that key.
      - name: pin dependencies to the floor
        if: matrix.toolchain == '1.74.0'
        working-directory: rust
        run: |
          rustup toolchain install stable --profile minimal
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
      - name: test on the floor
        if: matrix.toolchain == '1.74.0'
        working-directory: rust
        run: cargo +1.74.0 test --locked --all-features
      - name: test on ${{ matrix.toolchain }}
        if: matrix.toolchain != '1.74.0'
        working-directory: rust
        run: |
          cargo +${{ matrix.toolchain }} test --all-features
          cargo +${{ matrix.toolchain }} test --no-default-features

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: rust
      - run: cargo fmt --check
        working-directory: rust/fuzz
      # rust/certs/ is a copy of the repository's certs/, because cargo package
      # cannot reach outside the package directory. A copy that drifts ships
      # stale trust anchors.

  # The exploratory pass over the hand-written ASN.1, CMS, X.509 and JWS
  # readers and the three verifiers; rust/fuzz/README.md lists the targets
  # and their invariants. Seeds come from fixtures/, so a crasher is a
  # mutation of a genuine receipt or JWS, not of noise. It needs a nightly
  # for the sanitizer flags, which is why it is not part of the `rust` matrix.
  rust-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - run: ./run.sh all 60
        working-directory: rust/fuzz

  # The exploratory pass over the hand-written DER and CMS readers and the
  # three public verifiers; node/fuzz/README.md lists the targets and their
  # invariants. Seeds come from fixtures/, so a crasher is a mutation of a
  # genuine receipt or JWS, not of noise. The fuzzer is a native addon and
  # lives in node/fuzz's own package.json, which is why this job installs
  # twice and is not part of the `node` matrix.
  node-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      # The targets import ../dist, so the library has to be built first.
      - run: npm ci && npm run build
        working-directory: node
      - run: npm ci
        working-directory: node/fuzz
      - run: ./run.sh all 60
        working-directory: node/fuzz

  # SharpFuzz under libFuzzer, over the two parsers this package hand-writes
  # (the bounded JSON reader and the CMS pre-scan) and the four public entry
  # points. The invariants are the go-fuzz and rust-fuzz jobs': nothing but a
  # VerificationException escapes, an accepted receipt or JWS fails against an
  # unrelated anchor set, and the verifyReceipt endpoint always answers JSON
  # with a numeric status.
  #
  # The fuzz project sits outside ApplePurchaseReceiptVerifier.sln on purpose,
  # so neither the `dotnet` job (dotnet test) nor `dotnet-format` sees it and
  # the shipped package gains no dependency on a fuzzing engine. run.sh builds
  # the libFuzzer driver with clang, which the ubuntu runner image already
  # carries, and instruments only the library assembly.
  dotnet-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: ./run.sh all 60
        working-directory: dotnet/fuzz

  # The exploratory pass over the hand-written DER, CMS and X.509 readers and
  # the three public verifiers; php/fuzz/README.md lists the six targets and
  # their invariants. Seeds come from fixtures/, so a crasher is a mutation of
  # a genuine Apple-signed receipt or JWS rather than of noise, and the
  # anchor-set invariants are exercised on nearly every iteration because
  # several seeds genuinely verify.
  #
  # It is its own job, not a step in `php`, for the same reason `rust-fuzz` is
  # separate from `rust`: the tool is not the one the test matrix installs.
  # nikic/php-fuzzer is downloaded as a pinned phar by php/fuzz/run.sh and is
  # deliberately absent from composer.json — this package ships no lockfile and
  # resolves require-dev twice, so a fuzzer in the graph could move the
  # php-parser version the `php-lowest` leg pins for PHPUnit and PHP-CS-Fixer.
  #
  # pcntl is requested explicitly: php-fuzzer uses it for the per-execution
  # timeout that turns an input the parsers loop forever on into a recorded
  # crash instead of a job that hangs until the runner's own limit.
  php-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: openssl, json, pcntl
          coverage: none
      # The targets load the library through Composer's autoloader; no dev
      # dependency is needed for them, but `composer update` is what writes it.
      - run: composer update --no-progress --no-interaction
        working-directory: php
      # 60 s per target, six targets. A crasher leaves
      # php/fuzz/crashes/<target>/crash-<hash>.txt and fails the job; reduce it
      # and pin it as a test under php/tests/, where it then runs on all five
      # PHP matrix legs rather than only here.
      - run: ./run.sh all 60
        working-directory: php/fuzz

  # The exploratory pass over the hand-written ASN.1 and CMS readers and the
  # verifiers a consumer calls; ruby/fuzz/README.md lists the six targets and
  # the invariant each asserts. Seeds come from fixtures/, so a crasher is a
  # mutation of a genuine receipt or JWS, not of noise.
  #
  # It is not part of the `ruby` matrix because it cannot be: ruzzy is a
  # native extension that needs clang and libFuzzer's sanitizer runtimes, and
  # the whole point of that matrix is that the library installs nothing. Its
  # dependency lives in ruby/gemfiles/fuzz.gemfile for the same reason the
  # linters live in tools.gemfile — a tool that needs clang must not be able
  # to fail the Ruby 3.1 leg.
  #
  # clang is pinned to 18 with its matching libclang-rt: ruzzy links
  # libclang_rt.fuzzer_no_main.a and libclang_rt.asan.a out of the compiler's
  # own resource directory, so an unversioned `clang` that outruns the
  # installed runtime package fails the build with "Could not find asan".
  ruby-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ruby/gemfiles/fuzz.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # One line, not the library's matrix: this job proves the parsers
          # hold, not that they hold on five rubies. 3.3 is where the harness
          # was developed and where ruzzy's branch-coverage hook is verified.
          ruby-version: "3.3"
          bundler-cache: false
      - name: install clang and the libFuzzer sanitizer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: install ruzzy
        env:
          MAKE: make --environment-overrides V=1
          CC: /usr/bin/clang-18
          CXX: /usr/bin/clang++-18
          LDSHARED: /usr/bin/clang-18 -shared
          LDSHAREDXX: /usr/bin/clang++-18 -shared
        run: bundle install --jobs 4
      # A crasher is written under ruby/fuzz/artifacts/<target>/, which is
      # gitignored on purpose, and the run fails with the offending unit
      # printed as hex and base64 in the log — the same handling go-fuzz and
      # rust-fuzz get. Reduce it from the log and pin it as a test under
      # ruby/test/, where it runs on every Ruby in the matrix rather than only
      # where a libFuzzer-capable clang is around.
      - name: fuzz every target
        run: ./run.sh all 60
        working-directory: ruby/fuzz

  # Five coverage-guided atheris targets over the verifiers and the receipt
  # attribute reader, 60 s each -- the same budget and the same shape as
  # go-fuzz and rust-fuzz. Pinned to CPython 3.13 because atheris ships wheels
  # only (3.1.0: 3.12/3.13/3.14, no sdist), so the fuzzer's Python is not the
  # library's: the `python` matrix above is what proves 3.9 through 3.14, and
  # every crasher these targets found is pinned as a test under python/tests/
  # so it runs on all of them. atheris stays out of the package's dependency
  # sets -- run.sh installs it into an ephemeral uv environment and fuzzes the
  # source tree off PYTHONPATH, exactly as the `python` job tests it.
  python-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: ./run.sh all 60
        working-directory: python/fuzz

  # Coverage-guided fuzzing over the Swift port: SwiftPM's own libFuzzer
  # support (`-Xswiftc -sanitize=fuzzer`), so nothing is installed here --
  # the fuzzer ships with the toolchain, which is why this job has no setup
  # step at all. It runs in the same digest-pinned image as the `swift` and
  # `swift-format` jobs, at the newest line the matrix carries: the targets
  # are a development tool, not part of the version claim, so fuzzing them on
  # every supported Swift line would buy nothing the `swift` matrix does not
  # already prove.
  #
  # The targets live in swift/fuzz, a package of its own that depends on the
  # library by path, so the published root manifest carries no executable
  # targets a consumer would never run (swift/fuzz/README.md).
  #
  # 60 s per target, five targets, a fixed budget rather than a run count:
  # a fuzzer's job on a push is to keep proving the seeds and their neighbours
  # stay clean, not to search exhaustively. A crasher aborts the process and
  # fails the job; reduce it and pin it as a test under
  # swift/Tests/ApplePurchaseReceiptVerifierTests, where it then runs on every
  # Swift line rather than only here.
  swift-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3@sha256:56ef1be2c1ca36f4c52440357dc1fcdfdb5e113587134fcadeef57c225c71b54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./run.sh all 60
        working-directory: swift/fuzz

  # Advisories, license policy, and the banned-crate list that is the
  # mechanised form of "pinned anchors only, no network ever": a dependency
  # bump cannot introduce a system trust store or an HTTP client, because
  # cargo-deny refuses the crates that carry them. It runs on the default
  # resolution, never on the MSRV lockfile, so a stale floor pin cannot hide
  # an advisory.
  rust-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
        working-directory: rust

  # Every line the composer.json floor admits. 8.1 is the floor and is past
  # its own security-support end; it stays here for exactly as long as the
  # manifest claims it, the same rule as node 20 and python 3.9. That leg is
  # not decoration: PHP gained zend.max_allowed_stack_size in 8.3, so on 8.1
  # an unbounded recursive parser segfaults rather than raising, and this is
  # the only leg where the DER reader's depth bound is what stands between
  # hostile input and a crashed worker.
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json
          coverage: none
          ini-values: memory_limit=256M
      # composer update, not install: no lockfile is committed, because a
      # library spanning PHP 8.1-8.5 cannot express its dev toolchain in one
      # lock. The php-lowest job below is the substitute for the
      # reproducibility a lock would give.
      - run: composer update --no-progress --no-interaction --prefer-dist
        working-directory: php
      - run: vendor/bin/phpunit
        working-directory: php

  # The floor is a claim about the constraints, not only about the runtime:
  # this leg installs the oldest version of everything the manifest allows, so
  # a change that quietly needs a newer psr/clock or PHPUnit fails here rather
  # than on a consumer's machine.
  php-lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.1"
          extensions: openssl, json
          coverage: none
      - run: composer update --no-progress --no-interaction --prefer-lowest --prefer-stable
        working-directory: php
      - run: vendor/bin/phpunit
        working-directory: php

  php-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: openssl, json
          coverage: none
      - run: composer update --no-progress --no-interaction
        working-directory: php
      - run: composer validate --strict
        working-directory: php
      - run: vendor/bin/phpstan analyse --no-progress
        working-directory: php
      # php/certs/ is a copy of the repository-root certs/, and
      # src/Internal/RootsData.php is generated from that copy. A roots change
      # that forgets either step would ship stale trust anchors.
      - run: php php/tools/gen-roots.php && git diff --exit-code php/src/Internal/RootsData.php

  # The mutation pass: ~1,500 mutated receipts and ~1,000 mutated JWS
  # payloads, each verified through every public entry point. Its own job
  # because it is the slow one and because a failure here means something
  # different from a conformance failure.
  php-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: openssl, json
          coverage: none
      - run: composer update --no-progress --no-interaction
        working-directory: php
      - run: vendor/bin/phpunit --group mutation
        working-directory: php

  # The matrix that matters here is OS, not SDK: X.509 parsing, CNG versus
  # OpenSSL versus SecureTransport, and the time-zone database all differ per
  # platform, and this port touches all three. The netstandard2.0 floor gets
  # its own jobs below.
  dotnet:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      # The three SDKs above are not decoration: the test projects
      # multi-target net8.0, net9.0 and net10.0, so this runs the suite on
      # each runtime. It used to install all three and execute only .NET 9,
      # which goes end of life in November 2026 while net8.0 and net10.0
      # are the LTS runtimes consumers deploy on.
      - run: dotnet test -c Release
        working-directory: dotnet

  # The netstandard2.0 asset is what a .NET Framework, Mono or Unity consumer
  # loads. The dotnet job above runs the floor project on CoreCLR against that
  # asset; this one loads it under Mono, the closest a hosted runner gets to
  # Unity's scripting backend.
  dotnet-mono:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Load the netstandard2.0 asset under Mono
        working-directory: dotnet
        run: |
          set -euo pipefail
          dotnet build -c Release src/ApplePurchaseReceiptVerifier
          # Mono comes from a digest-pinned image rather than apt. Installing
          # mono-complete pulled 163 packages and 80 MB from the Ubuntu
          # mirror on every run; when that mirror was slow the job spent 24
          # minutes fetching and was cancelled at its timeout, with nothing
          # wrong in the code. Same reasoning as the swift jobs, which have
          # been digest-pinned containers all along.
          #
          # A Mono host that cannot even load the assembly is the failure
          # this job exists to catch; the full suite stays on CoreCLR, and
          # monop reflects rather than executes, so this proves loadability
          # and not behaviour.
          docker run --rm -v "$PWD:/work" -w /work \
            mono:6.12@sha256:34d816779b1248b5cfd095770b64ecbaf1798e2aca693a91c11a018dce9c7ad5 \
            monop -r:src/ApplePurchaseReceiptVerifier/bin/Release/netstandard2.0/ApplePurchaseReceiptVerifier.dll \
              ApplePurchaseReceiptVerifier.Receipt.ReceiptVerifier

  # certs/ is the reviewable source of truth for the pinned Apple roots;
  # Internal/AppleRootData.cs is generated from it and compiled in. A certs
  # change that forgets to regenerate would ship stale trust anchors — the
  # same rule node's roots-data.ts already follows.
  dotnet-roots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - run: dotnet run --project dotnet/tools/GenerateRootData -- "$GITHUB_WORKSPACE"
      - run: git diff --exit-code dotnet/src/ApplePurchaseReceiptVerifier/Internal/AppleRootData.cs

  # Trimming is the closest CI-runnable proxy for Unity IL2CPP's stripping: a
  # reflection-based serializer, an embedded resource or a dynamic code path
  # would surface here as an IL2xxx warning or as a runtime failure. The
  # sample verifies a receipt and asserts a foreign chain is still rejected,
  # so a trimmer that silently removed a check fails the job.
  dotnet-trim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Publish fully trimmed and verify a receipt with it
        working-directory: dotnet
        run: |
          set -euo pipefail
          dotnet publish samples/TrimAotSmoke -c Release -r linux-x64 -o "$RUNNER_TEMP/trim" \
            -warnaserror
          "$RUNNER_TEMP/trim/TrimAotSmoke" "$GITHUB_WORKSPACE/fixtures"

  # fixtures/cases.json is the normative cross-language contract: every
  # suite reads it, so a malformed vector file or an unregistered fixture
  # breaks every language at once. The linter is dependency-free, so this job
  # installs nothing.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node tools/lint-cases.mjs
      # Every port that ships the pinned Apple roots must ship the same
      # bytes. Only three ports used to diff their copy against certs/,
      # and the per-port regenerate-and-diff steps cannot see this: they
      # compare a generated file to its own port's copy, so a port left
      # behind by a root refresh stays internally consistent and green.
      - run: node tools/check-cert-copies.mjs

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uvx runs zizmor from an ephemeral environment and brings its own
      # interpreter with it, so this job needs no setup-python and no
      # install step. Version deliberately unpinned, as it was under pip:
      # a new zizmor audit that fires on these workflows is a finding we
      # want to see, not one to defer behind a pin.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx zizmor .github/workflows/

  # Lint and formatting for the Node port. Separate from the `node` job
  # because it is version-independent: oxlint and prettier read their own
  # config, so running them once says everything running them four times
  # would. `npm test` deliberately does not call them (prettier --check
  # costs ~1.5s), which is why this job has to exist.
  node-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci && npm run lint && npm run format:check
        working-directory: node

  # ruff and mypy for the Python port. One job, not a matrix: ruff pins the
  # language level with target-version = "py39" in pyproject, so the
  # interpreter this runs on does not change the verdict. mypy cannot be
  # told python_version = "3.9" at all (mypy 2.x requires >= 3.10), so the
  # 3.9 floor is held by ruff's UP rules and proven by the `python` job's
  # 3.9 leg above, not by this one.
  #
  # Installs the package rather than just the tools: mypy needs cryptography
  # and asn1crypto importable to resolve their types.
  python-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          # ruff and mypy are invoked as bare commands below, so the venv uv
          # creates has to be on PATH for the steps that follow. That is what
          # activate-environment does; without it these would need `uv run`.
          activate-environment: true
      - run: uv pip install -e ".[dev]"
        working-directory: python
      - run: ruff check .
        working-directory: python
      - run: ruff format --check .
        working-directory: python
      - run: mypy
        working-directory: python
      # ty, Astral's type checker, is ADVISORY and must stay that way for
      # now: it is 0.0.x preview software, and mypy above remains the gate.
      #
      # Scoped to the package rather than the whole port, because that is
      # where it is honestly clean (0 diagnostics). Over tests/ it reports
      # one false positive: test_endpoint_environment_is_the_typed_enum
      # passes deliberately wrong types to assert the constructor rejects
      # them, and ty honours only `# ty: ignore`, never the
      # `# type: ignore[arg-type]` already on that line. Silencing a preview
      # tool by adding a second suppression dialect to the source is worse
      # than not running it there, so we don't.
      #
      # It resolves cryptography's types through VIRTUAL_ENV, which
      # activate-environment exports; --python makes that explicit, because
      # under continue-on-error a mis-resolved environment would look like
      # findings rather than like the misconfiguration it is.
      - run: uvx ty check --python "$VIRTUAL_ENV" apple_purchase_receipt_verifier
        working-directory: python
        continue-on-error: true

  # swift-format ships inside the toolchain from Swift 6.0 on, so there is
  # no SwiftPM dependency to resolve. Pinned to the 6.3 image and not the
  # 6.1 floor on purpose: the sources were formatted by swift-format 6.3.3,
  # and swift-format's output is not stable across minor versions -- the
  # `swift` job's own comment records a helper that compiled on 6.3 and
  # failed on 6.1. Formatting is a house style, not a compatibility claim,
  # so one version owns it; the compatibility claim stays with the `swift`
  # matrix. This was verified locally under 6.3.3 and could not be tried
  # against the 6.1 container (no local daemon), which is the other reason
  # not to assert it here.
  swift-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.3@sha256:56ef1be2c1ca36f4c52440357dc1fcdfdb5e113587134fcadeef57c225c71b54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift format lint --strict --recursive swift/Sources swift/Tests

  # A drift gate on dotnet/.editorconfig, not a restyle. The Style,
  # Performance and Usage analyzer categories are silenced there because
  # `dotnet format` with them on rewrote 28 files -- switch expressions,
  # collection expressions, a primary constructor, GeneratedRegex source
  # generators -- and in one file two fixers collided and wrote a literal
  # <<<<<<< / ======= / >>>>>>> conflict marker into the source. A
  # formatter that can corrupt a file is not one to run in apply mode over
  # this port; this job only ever verifies.
  dotnet-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet format --verify-no-changes --severity info
        working-directory: dotnet

  # Spotless with palantir-java-format. Deliberately not bound to a Maven
  # lifecycle phase (see java/pom.xml), so `mvn test` and the
  # java-runtime-8 job never invoke it; this job runs it explicitly.
  # palantir's own classes are class-file major 55, so running the check
  # needs Maven itself on JDK 11+ -- which is why it is not in the build.
  # palantir over google-java-format because google forces 2-space indent
  # on a 4-space codebase: 8690 changed lines against palantir's 1967.
  java-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B spotless:check
        working-directory: java

  # PHP-CS-Fixer, separate from the php/php-lowest/php-static/php-mutation
  # jobs so a formatting drift fails on its own instead of inside a
  # functional job's log. This is also the first CI run of the fixer at
  # all: the committed .php-cs-fixer.dist.php declared the risky
  # declare_strict_types rule while setting setRiskyAllowed(false), a
  # combination the resolver rejects outright, so the config could never
  # have run wherever it was invoked from.
  php-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: openssl, json
          coverage: none
      - run: composer update --no-progress --no-interaction
        working-directory: php
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes
        working-directory: php
