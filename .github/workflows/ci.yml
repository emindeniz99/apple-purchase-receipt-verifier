# CI for apple-purchase-receipt-verifier: the same shared fixture suite in
# all four languages, on every runtime each artifact claims to support.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Build needs javac 9+ for --release 8; the artifact is Java 8
        # bytecode (major version 52). Running the suite on a real JDK 8
        # runtime needs a surefire jvm override — tracked in ROADMAP.
        jdk: ["11", "17", "21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - run: mvn -B test
        working-directory: java

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # npm ci, not npm install: the committed lockfile is the contract and
      # this is the job that verifies it.
      - run: npm ci && npm test
        working-directory: node

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install cryptography asn1crypto && python -m unittest discover -s tests
        working-directory: python

  swift:
    runs-on: ubuntu-latest
    # Digest-pinned (mutable tags are the container flavor of action
    # retagging); dependabot bumps the digest, the comment names the tag.
    container: swift:6.0@sha256:af41101d281e41b824529901e88afe848bf3edb67d180aea3e1d963e53fbe56b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
        working-directory: swift

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install zizmor && zizmor .github/workflows/
