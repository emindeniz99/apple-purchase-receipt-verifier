# CI for apple-purchase-receipt-verifier: the same shared fixture suite in
# all nine languages, on every runtime each artifact claims to support.
name: ci

on:
  push:
    # rust-core is the 0.8.0 integration branch (docs/rust-core/MIGRATION.md):
    # every lane merges into it, so every merge runs the full suite there.
    branches: [main, rust-core]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseding a branch's run saves a runner; superseding main's destroys
# evidence. Every commit on main is a release candidate -- release.yml's
# ci-passed gate polls for a completed run on the exact tagged SHA -- so a
# main commit whose run was cancelled has no record that its tree ever
# passed. That is not hypothetical: run 132 was cancelled by a docs commit
# pushed 43 seconds after it, and runs 123 and 125 went the same way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Pull requests run only the ports they touch; main runs everything.
  # The filter is a per-job `if:` and not `on.paths`: a workflow that
  # `on.paths` skips leaves its required checks pending forever, while a job
  # an `if:` skips reports Success. .github/scripts/changed-areas.sh is an
  # allowlist, so a path it does not know -- fixtures/, certs/, tools/, this
  # file -- runs every port: a forgotten path may cost minutes, never
  # coverage. Pushes to main are not filtered because release.yml's
  # ci-passed gate needs a full run on the exact tagged SHA, and neither are
  # pushes to rust-core, the integration branch. conformance, zizmor and
  # one-implementation are not filtered either: they guard shared files and
  # take seconds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      java: ${{ steps.areas.outputs.java }}
      node: ${{ steps.areas.outputs.node }}
      python: ${{ steps.areas.outputs.python }}
      ruby: ${{ steps.areas.outputs.ruby }}
      php: ${{ steps.areas.outputs.php }}
      go: ${{ steps.areas.outputs.go }}
      rust: ${{ steps.areas.outputs.rust }}
      swift: ${{ steps.areas.outputs.swift }}
      dotnet: ${{ steps.areas.outputs.dotnet }}
      server: ${{ steps.areas.outputs.server }}
      # Every host runs aprv.wasm, so any selected area needs rust-wasm's
      # build of it (OD-01 in docs/rust-core/STATUS.md): no host job
      # downloads a module from an earlier run.
      module: ${{ steps.areas.outputs.module }}
      # The Linux x86_64 static aprv binary: the server's own jobs, PHP
      # (its only transport) and the Java -wasm artifact's server engine.
      server-bin: ${{ steps.areas.outputs.server-bin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On pull_request the checkout is the PR's merge commit, so
      # base..HEAD is exactly the change the PR would make.
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            .github/scripts/changed-areas.sh "$BASE_SHA" HEAD > "$RUNNER_TEMP/areas"
          else
            .github/scripts/changed-areas.sh all > "$RUNNER_TEMP/areas"
          fi
          {
            cat "$RUNNER_TEMP/areas"
            if grep -q '=true$' "$RUNNER_TEMP/areas"; then echo "module=true"; else echo "module=false"; fi
            if grep -qE '^(server|php|java)=true$' "$RUNNER_TEMP/areas"; then echo "server-bin=true"; else echo "server-bin=false"; fi
          } >> "$GITHUB_OUTPUT"

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # Every Temurin line still in support, LTS or not: 27 is the
        # current feature release (GA 2026-09-15) and replaced 26, which
        # reached end of life on 2026-09-18. The build itself needs javac 9+
        # for --release 8; the artifact is Java 8 bytecode (major version
        # 52), and the java-runtime-8 job below runs the suite on a real
        # Temurin 8 JVM.
        jdk: ["11", "17", "21", "25", "27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - run: mvn -B test
        working-directory: java

  # The floor check: build with a modern javac, run the tests on a real
  # Temurin 8 JVM via surefire's jvm override — the `java 8` claim in the
  # pom is verified, not asserted (the toolchain itself can't build on 8).
  java-runtime-8:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two JDKs: 8 for the test JVM (exposed as JAVA_HOME_8_X64), then 25
      # last so it wins JAVA_HOME and drives Maven itself.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test -Pjdk8-runtime "-Djdk8.jvm=${JAVA_HOME_8_X64}/bin/java"
        working-directory: java

  # The genuine legacy receipt chain is SHA-1 end to end. The JDK's own PKIX
  # code obeys jdk.certpath.disabledAlgorithms, so a hardened java.security
  # that disables SHA-1 outright (RHEL crypto policies, many enterprise
  # images) makes the JDK refuse that chain. The Java port builds and
  # validates chains with its own pinned BouncyCastle instance, which does not
  # read that property (java/README.md, "One platform caveat"). This job pins
  # that: under that policy the full conformance suite passes. Surefire names
  # dynamic tests by index, so the discriminating case
  # receipt/verify-genuine-legacy-sha1-chain is not grepped by name here;
  # ConformanceCasesTest's last test fails if any case in cases.json did not
  # run, so 0 failures means it ran and passed (java-distroless asserts it by
  # name). HostPolicyProbe then shows the premise on the same JDK: under the
  # same policy the JDK's own PKIX refuses the chain the suite accepted.
  java-hardened-policy:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the conformance suite with SHA-1 disabled for certpath
        working-directory: java
        run: |
          set -euo pipefail
          printf 'jdk.certpath.disabledAlgorithms=MD2, MD5, SHA1, RSA keySize < 1024\n' > "$RUNNER_TEMP/hardened.properties"
          mvn -B test -Dtest=ConformanceCasesTest "-DargLine=-Djava.security.properties=$RUNNER_TEMP/hardened.properties" | tee "$RUNNER_TEMP/hardened.log"
          grep -E '^\[INFO\] Tests run: [0-9]+, Failures: 0, Errors: 0, Skipped: 0$' "$RUNNER_TEMP/hardened.log"
          grep -F '"id": "receipt/verify-genuine-legacy-sha1-chain"' ../fixtures/cases.json
          mvn -B -q dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/cp.txt"
          java "-Djava.security.properties=$RUNNER_TEMP/hardened.properties" \
            -cp "target/test-classes:target/classes:$(cat "$RUNNER_TEMP/cp.txt")" \
            io.github.emindeniz99.applepurchasereceiptverifier.HostPolicyProbe | tee "$RUNNER_TEMP/probe.log"
          grep -F "premise: the JDK's own PKIX refuses the legacy chain" "$RUNNER_TEMP/probe.log"
          grep -F 'legacy receipt verifies' "$RUNNER_TEMP/probe.log"

  # The deployment surface rather than the build surface: the suite on the
  # images the library is actually deployed on, with the image's own JVM and
  # its own java.security. The Java port builds and validates the genuine
  # legacy receipt chain -- sha1WithRSAEncryption at both the leaf and the
  # WWDR intermediate -- with its own pinned BouncyCastle, so neither the
  # image's java.security nor an operator's override should move a verdict
  # (java/README.md, "One platform caveat worth knowing"). This job checks
  # both on every image: the stock policy, then a SHA-1-free one layered on
  # top, the same line java-hardened-policy uses.
  #
  # Measured 2026-09-21 by unpacking the published layers rather than trusting
  # the docs: every tag below ships the upstream OpenJDK value
  #
  #   jdk.certpath.disabledAlgorithms=MD2, MD5, SHA1 jdkCA & usage TLSServer, \
  #       RSA keySize < 1024, DSA keySize < 1024, EC keySize < 224, \
  #       SHA1 usage SignedJAR & denyAfter 2019-01-01
  #
  # whose SHA-1 entry is constrained to certificates chaining to a cacerts
  # anchor AND used for TLS server auth, neither of which a pinned Apple root
  # in a receipt is, so on the stock images even the JDK's own PKIX code
  # accepts the chain. Nothing in the distroless build touches crypto policy: it
  # unpacks Adoptium's temurin-<v>-jre deb (debian13) or Debian's openjdk deb
  # (debian12) and replaces only the cacerts trust store.
  #
  # Mechanics, because distroless has no shell, no Maven and no package
  # manager: Maven runs on the runner and only the JVM runs in the container.
  # test-compile plus copy-dependencies lay down target/classes,
  # target/test-classes and target/dep; the JUnit Platform console launcher
  # (sha256-pinned, the discipline java/fuzz/run.sh already applies to Jazzer)
  # drives them.
  #
  # `java -cp <console.jar>:... ConsoleLauncher`, NEVER `java -jar
  # console.jar --class-path ...`: with -jar the launcher hangs the supplied
  # classpath off a child loader and java.class.path holds only the console
  # jar, so TrustStoreIsolationTest's forked child JVM -- which passes
  # java.class.path straight to `java -cp` -- dies with a
  # ClassNotFoundException on PlantedTrustStoreChild. Measured, not guessed.
  java-distroless:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Digest-pinned, same reasoning as the swift images (a mutable tag is
        # the container flavor of action retagging); the comment names the tag.
        # :nonroot, because that is what gets deployed: uid 65532 reads the
        # read-only checkout and writes only into the image's /tmp (mode 1777),
        # which is where the two @TempDir tests land. The :nonroot and default
        # variants carry byte-identical JRE layers, so the policy under test is
        # the same in both.
        #
        # debian12 is what many deployments still run and is frozen -- gcr.io has
        # not rebuilt it since 2026-02-20 and carries a
        # `deprecated-public-image-*` tag beside it -- and it is Debian's
        # OpenJDK, not Temurin. debian13 is what GoogleContainerTools/distroless
        # builds now (java/BUILD: ADOPTIUM_DEB_PER_DISTRO = 17, 21, 25 on
        # debian13 only). Both lines are here so the migration is already
        # covered. There is no java11 tag to add: java11-debian11 was last
        # built in 2024 and is deprecated, and the console launcher needs 17+.
        include:
          - jre: "17 (Debian OpenJDK 17.0.18, deprecated tag)"
            image: gcr.io/distroless/java17-debian12@sha256:06484c2a9dcc9070aeafbc0fe752cb9f73bc0cea5c311f6a516e9010061998ad # java17-debian12:nonroot
          - jre: "17 (Temurin 17.0.20.1)"
            image: gcr.io/distroless/java17-debian13@sha256:6457ce026c1733d9693b65a4dbb45459d71ec1f5e48676f9d3877c99c63c35cc # java17-debian13:nonroot
          - jre: "21 (Temurin 21.0.12.1)"
            image: gcr.io/distroless/java21-debian13@sha256:0a1f5a75661918de9c0813f287f651c3bf2d6dd752eada5f084eb0c1f14ced9e # java21-debian13:nonroot
          - jre: "25 (Temurin 25.0.4.1)"
            image: gcr.io/distroless/java25-debian13@sha256:ca60da1345c0f17b6d019049e6749e15f10fd3c0da86dec938d2b4ec565d0629 # java25-debian13:nonroot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner-side JDK only compiles; the pom's --release 8 applies to the
      # test sources too, so target/test-classes is major version 52 and loads
      # on every JRE in the matrix.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build the test tree and fetch the console launcher
        working-directory: java
        run: |
          set -euo pipefail
          mvn -B -DskipTests test-compile
          # runtime scope, not test: the console launcher jar already carries
          # the platform and the Jupiter engine, and a second copy of them on
          # the classpath is a version conflict waiting to happen.
          mvn -B dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dep
          # jackson-databind is test scope since 0.7 (main uses jackson-core
          # alone), and the suite reads its JSON vectors through it.
          mvn -B dependency:copy-dependencies -DincludeScope=test -DincludeGroupIds=com.fasterxml.jackson.core -DoutputDirectory=target/dep
          curl -fsSL --retry 3 -o target/junit-console.jar \
            "https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/${JUNIT_PLATFORM}/junit-platform-console-standalone-${JUNIT_PLATFORM}.jar"
          echo "${JUNIT_CONSOLE_SHA256}  target/junit-console.jar" | sha256sum -c -
        env:
          # The junit-platform version that ships inside the junit-jupiter in
          # pom.xml (jupiter 5.14.4 -> platform 1.14.4). Bump both together.
          JUNIT_PLATFORM: "1.14.4"
          JUNIT_CONSOLE_SHA256: "7c6968cbcaf4301c729f202b23b7d736c5d88be625fc7d27ad5d746146a8bc28"
      # Read-only mount: nothing the suite runs writes into the checkout, and a
      # run that suddenly needs to should fail rather than leave a file behind.
      # The working directory is /w/java because every fixture path in the
      # tests is relative to the Maven module ("../fixtures").
      - name: Run the suite on the image's own JVM
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/w:ro" -w /w/java \
            --entrypoint /usr/bin/java \
            "$IMAGE" \
            -cp 'target/junit-console.jar:target/classes:target/test-classes:target/dep/*' \
            org.junit.platform.console.ConsoleLauncher execute \
            --scan-class-path=target/test-classes \
            --fail-if-no-tests --details=testfeed \
            --disable-ansi-colors --disable-banner | tee "$RUNNER_TEMP/stock.log"
          # The point of the job, asserted by name: a green exit code would
          # also be green if the discriminating case had quietly stopped being
          # discovered.
          grep -F 'receipt/verify-genuine-legacy-sha1-chain :: SUCCESSFUL' "$RUNNER_TEMP/stock.log"
          grep -E '^\[[[:space:]]+0 tests failed[[:space:]]+\]' "$RUNNER_TEMP/stock.log"
        env:
          IMAGE: ${{ matrix.image }}
      # The other half of the claim: an operator's java.security that
      # disables SHA-1 outright moves no verdict on the image's own JVM. The
      # suite must pass in full with the discriminating case named, and
      # HostPolicyProbe must show the premise: under the same policy the
      # image's JDK refuses the chain the suite accepted.
      - name: Assert a hardened java.security moves no verdict
        run: |
          set -euo pipefail
          # A single `=` layers this over the image's own java.security instead
          # of replacing it (`==` would replace), so exactly one property moves.
          printf 'jdk.certpath.disabledAlgorithms=MD2, MD5, SHA1, RSA keySize < 1024\n' \
            > java/target/hardened.properties
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/w:ro" -w /w/java \
            --entrypoint /usr/bin/java \
            "$IMAGE" \
            -Djava.security.properties=/w/java/target/hardened.properties \
            -cp 'target/junit-console.jar:target/classes:target/test-classes:target/dep/*' \
            org.junit.platform.console.ConsoleLauncher execute \
            --select-class=io.github.emindeniz99.applepurchasereceiptverifier.ConformanceCasesTest \
            --fail-if-no-tests --details=testfeed \
            --disable-ansi-colors --disable-banner | tee "$RUNNER_TEMP/hardened.log"
          grep -F 'receipt/verify-genuine-legacy-sha1-chain :: SUCCESSFUL' "$RUNNER_TEMP/hardened.log"
          grep -E '^\[[[:space:]]+0 tests failed[[:space:]]+\]' "$RUNNER_TEMP/hardened.log"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/w:ro" -w /w/java \
            --entrypoint /usr/bin/java \
            "$IMAGE" \
            -Djava.security.properties=/w/java/target/hardened.properties \
            -cp 'target/classes:target/test-classes:target/dep/*' \
            io.github.emindeniz99.applepurchasereceiptverifier.HostPolicyProbe | tee "$RUNNER_TEMP/probe.log"
          grep -F "premise: the JDK's own PKIX refuses the legacy chain" "$RUNNER_TEMP/probe.log"
          grep -F 'legacy receipt verifies' "$RUNNER_TEMP/probe.log"
        env:
          IMAGE: ${{ matrix.image }}

  # Every job that builds node/ first puts rust-wasm's component at
  # node/wasm/aprv.component.wasm (jco transpiles it at build; nothing
  # generated is committed) with .github/scripts/place-module.sh.
  node:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Every supported LTS line plus current (endoflife.date/nodejs);
        # the engines floor (20) stays tested even after its EOL because
        # the package still claims it.
        node: ["20", "22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # npm ci, not npm install: the committed lockfile is the contract and
      # this is the job that verifies it. --ignore-scripts everywhere: no
      # dependency here needs its install script (jco and its dependencies
      # are plain JavaScript), and an install script is the way a hijacked
      # release runs code in CI.
      - run: npm ci --ignore-scripts && npm test
        working-directory: node

  # The npm package's runtime claims (README "JavaScript runtimes"): the
  # built dist runs the same smoke, on both entry points (`.` and `/web`
  # load the same module), on Node, Bun, Deno, Cloudflare workerd and the
  # Vercel Edge runtime. The package needs no workerd compatibility flag,
  # so one workerd leg covers every configuration. The runtimes come from
  # npm at pinned versions so no extra action is needed; bump the pins in
  # node/package.json's runtime:* scripts.
  #
  # One leg per runtime rather than one job running all of them: each leg
  # downloads one runtime and they run at the same time. fail-fast is off
  # because "Bun passed and Deno did not" is the useful answer, not the
  # first failure.
  node-runtimes:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno, workerd, edge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts && npm run build && npm run "runtime:$RUNTIME"
        working-directory: node
        env:
          RUNTIME: ${{ matrix.runtime }}

  # The browsers the README claims, through Playwright at a pinned version
  # (installed for this job only, never a dependency of the package).
  node-browsers:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      # Playwright is pinned by exact version and installed with
      # --ignore-scripts; its browsers come from its own pinned build list.
      - name: Chromium, Firefox and WebKit # zizmor: ignore[adhoc-packages]
        working-directory: node
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm i --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install --with-deps chromium firefox webkit
          npm run build
          npm run runtime:browser -- chromium firefox webkit

  # roots-data.ts is generated from certs/; a certs change that forgets to
  # regenerate it would ship stale trust anchors. Its own job now that the
  # runtime smoke is a matrix, so it runs once rather than six times.
  node-roots-generated:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node scripts/gen-roots.mjs && git diff --exit-code src/roots-data.ts
        working-directory: node

  # Proves jvm-interop/README.md's claim: the published jar is usable from
  # other JVM languages, not just Java. Builds java/ first with install,
  # not package, so jvm-interop resolves it as a real Maven coordinate the
  # way a consumer would from Central, then runs the Kotlin and Scala 3
  # interop tests. Never part of the release: jvm-interop has no
  # release-please entry and no <module> anywhere.
  jvm-interop:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B install -DskipTests
        working-directory: java
      - run: mvn -B test
        working-directory: jvm-interop
      # java-bench/ is another consumer of that installed coordinate, and
      # otherwise only benchmark.yml builds it, by hand. compile runs JMH's
      # annotation processor over it, so an API change that breaks a
      # benchmark fails here; compile stops short of packaging the JMH jar,
      # and nothing is measured. version.txt as in benchmark.yml.
      - run: mvn -B -f java-bench/pom.xml -Dlibrary.version="$(cat version.txt)" compile

  # A consumer on Spring Boot 4 imports the Boot BOM, which overrides the
  # library's Jackson 2 pin with its own and adds Jackson 3 (tools.jackson)
  # beside it. The sample wires the verifiers as beans and pushes one
  # genuine input through every entry point on exactly that classpath. One
  # leg per supported Boot line (endoflife.date/spring-boot: 4.0 until
  # 2026-12-31, 4.1 until 2027-07-31) on every Java LTS Boot 4 accepts;
  # the Boot line is a Maven property, so a new line is one entry here.
  # Deliberately a separate Maven project, not a module of java/pom.xml,
  # so the BOM governs versions the way it does in a real application.
  java-spring-boot:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        boot: ["4.0.8", "4.1.1"]
        jdk: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - run: mvn -B install -DskipTests
        working-directory: java
      - run: |
          version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          mvn -B -f samples/spring-boot-smoke/pom.xml test \
            -Dverifier.version="$version" -Dspring-boot.version="$BOOT"
        working-directory: java
        env:
          BOOT: ${{ matrix.boot }}

  # Every Python line on every platform wasmtime-py ships a wheel for
  # (python/CI-NOTES.md): glibc x86_64 and aarch64, macOS arm64 and x86_64,
  # Windows amd64 and arm64 here, musl in python-musl below. The package's
  # one runtime dependency is wasmtime, so the platform list is its wheel
  # list, and a floor nothing runs is a claim.
  python:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every supported line (endoflife.date/python); 3.10 is the
        # requires-python floor and stays tested while claimed.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" python
        shell: bash
      # setup-uv provisions the interpreter too (uv python install), from
      # python-build-standalone, including the 3.10 floor.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # python/uv.lock is committed and every leg installs from it, so no
      # push resolves a version range. uv forks the resolution on the
      # interpreter and records a version per marker, so one file covers 3.10
      # through 3.14 without pinning the whole matrix to what the floor can
      # take. `uv sync` installs the project editable, which keeps this a
      # test of the SOURCE TREE rather than of a built wheel.
      - run: uv sync --locked --extra dev
        working-directory: python
      # APRV_WASM_CACHE_DIR stays unset: test_cache.py sets it where it
      # needs it, and the default cache directory under HOME is part of
      # what it tests.
      - run: uv run --locked --extra dev python -m unittest discover -s tests
        working-directory: python
      # Again with the compile cache warm: the second run is the one a
      # deployment sees after its first start, and test_cache.py prints the
      # cold and warm start times for the README's numbers.
      - name: the suite again, with the compile cache warm
        run: uv run --locked --extra dev python -m unittest discover -s tests
        working-directory: python

  # The musl legs: the uv image for each Python line, digest-pinned (the
  # comments name the tags), run with docker on the runner rather than as a
  # job container, because JavaScript actions cannot run inside Alpine.
  # Root inside the container, so test_cache.py takes its simulated
  # read-only branch.
  python-musl:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { python: "3.10", image: "ghcr.io/astral-sh/uv:python3.10-alpine@sha256:e2d2f86302f7afee240296e03124cf2337cfba1e517addecdd1e5667c29862d9" } # python3.10-alpine
          - { python: "3.11", image: "ghcr.io/astral-sh/uv:python3.11-alpine@sha256:97c6d480e7b214e5d7e8bf6db85a101078554de11cd6e677451a6174486a52a9" } # python3.11-alpine
          - { python: "3.12", image: "ghcr.io/astral-sh/uv:python3.12-alpine@sha256:262abc719041a446c354092e6b7730c9066de499089e16ef4edcb1a2e5d7b8b9" } # python3.12-alpine
          - { python: "3.13", image: "ghcr.io/astral-sh/uv:python3.13-alpine@sha256:8265a34ae4034f7f6d3f4146f97cf7ec8de6de803b0698f560df63b9a8dadd38" } # python3.13-alpine
          - { python: "3.14", image: "ghcr.io/astral-sh/uv:python3.14-alpine@sha256:ea7c8f721b5042fb12f6eb051b63469edfeb61c7c00551dbe67d71f182810c66" } # python3.14-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" python
      # The image's own interpreter, never a downloaded glibc one: that is
      # what makes the leg a musl leg.
      - name: the suite on musl, twice (cold, then warm cache)
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/python \
            -e HOME=/tmp/home -e UV_PYTHON_PREFERENCE=only-system -e UV_PYTHON_DOWNLOADS=never \
            "$IMAGE" sh -euc '
              # wasmtime-py'"'"'s musllinux wheel links libgcc_s, which Alpine
              # leaves out of its base image; a musl deployment installs it too.
              apk add --no-cache libgcc
              uv sync --locked --extra dev
              uv run --locked --extra dev python -c "import platform, sys; print(sys.version, platform.libc_ver())"
              uv run --locked --extra dev python -m unittest discover -s tests
              uv run --locked --extra dev python -m unittest discover -s tests
            '

  # Every Swift the manifest admits (tools 6.3 is the floor since the
  # WasmKit host), on Linux, plus the Xcode toolchain on macOS and an iOS
  # compile. The tests run optimised with testing enabled: WasmKit
  # interprets, and a debug build of the interpreter is 50 to 150 times
  # slower, so the cases with a 2,000 ms budget fail on time alone in debug
  # (swift/CI-NOTES.md). A debug build of the tests stays as a compile check,
  # since #if DEBUG code is compiled nowhere else. Every job copies
  # rust-wasm's module into the package's resource directory first:
  # SwiftPM will not build without the declared resource.
  swift:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Digest-pinned (mutable tags are the container flavor of action
        # retagging); dependabot bumps the digests, the comments name the tags.
        include:
          - swift: "6.3"
            image: swift:6.3@sha256:56ef1be2c1ca36f4c52440357dc1fcdfdb5e113587134fcadeef57c225c71b54
          - swift: "6.4"
            image: swift:6.4@sha256:bb6e5d5f2a97bc07cf8022c1a3e062f8164b8fd078698327ce2ab097e02a91dc
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" swift
        shell: bash
      # Manifest lives at the repo root (SwiftPM requirement); no
      # working-directory needed. --force-resolved-versions builds the exact
      # revisions in Package.resolved and fails instead of re-resolving, so a
      # newer tag matching the manifest's `from:` floors cannot arrive
      # unreviewed.
      - run: swift build --build-tests --force-resolved-versions
      # Consumers ship release builds, and the optimizer is where a compiler
      # bug shows up: Swift 6.3.3 on x86_64 miscompiled a throwing function
      # so that release builds crashed on a genuine receipt while every debug
      # test passed.
      - run: swift test -c release -Xswiftc -enable-testing --force-resolved-versions
  # macos-26: the package needs Swift tools 6.3, and macos-15's Xcode
  # carries Swift 6.1 (swift/CI-NOTES.md asks for 15+ with Swift 6.3+).
  swift-macos:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" swift
      - run: swift --version && swift test -c release -Xswiftc -enable-testing --force-resolved-versions

  # The iOS 18 compile the manifest claims, which Linux cannot do: the
  # package and WasmKit build for a generic iOS device with the software
  # bounds checking the package selects there. Nothing runs on a device.
  swift-ios:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" swift
      - run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list
          xcodebuild build -scheme ApplePurchaseReceiptVerifier \
            -destination 'generic/platform=iOS' -skipPackagePluginValidation

  # Every Go line the module claims, down to the go.mod floor: a floor
  # nothing executes is a claim, not a fact — the analogue of the
  # java-runtime-8 job above. The floor is wazero's as much as the
  # module's (wazero v1.9.0 builds on Go 1.22; later wazero lines raise it).
  # Every Go job copies rust-wasm's module into go/internal/wasm first:
  # //go:embed needs the file, and it is not committed until integration
  # (DECISIONS.md R14).
  go:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.23", "1.24", "1.25", "1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go/go.sum
      # GOTOOLCHAIN=local is the whole point of the matrix. Without it Go
      # downloads a newer toolchain whenever go.mod asks for one, and the
      # "go 1.22" floor would be compiled by 1.27 on every leg.
      - run: go version && go test ./...
        working-directory: go
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly

  # Windows earns its place: the conformance adapter walks the filesystem to
  # find fixtures/, and the .b64 fixtures pick up CRLF on checkout. macOS
  # earns its place because wazero compiles to a different ISA there. One Go
  # version each, not a cross product; CGO off, as a consumer's static
  # build has it.
  go-platforms:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" go
        shell: bash
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go/go.sum
      - run: go test ./...
        working-directory: go
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly

  # The platforms a consumer cross-compiles to, without running them: the
  # package (wazero included) must build and vet for each with CGO off. No
  # 32-bit target: the package does not claim one (OD-13).
  go-cross:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [darwin/amd64, darwin/arm64, windows/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go/go.sum
      - working-directory: go
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          go build ./...
          go vet ./...

  # The FROM-scratch claim without a container daemon: a static build of
  # the package's own corpus runner, run by chroot in a directory that holds
  # nothing else (no libc, no certificates, no /proc, an empty
  # environment), must answer exactly what an ordinary run answers.
  go-scratch:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go/go.sum
      - name: the same rows in an empty chroot
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/scratch"
          mkdir -p "$D"
          (cd go && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$D/corpusrun" ./internal/corpusrun)
          if ldd "$D/corpusrun" 2>&1 | grep -qv 'not a dynamic executable'; then
            ldd "$D/corpusrun" || true
            echo "::error::corpusrun is not a static executable"; exit 1
          fi
          # Two calls: the genuine g5 receipt, and the same receipt with one
          # signature bit flipped (a verdict each way).
          python3 - "$D/calls.jsonl" <<'PY'
          import base64, json, sys
          text = open("fixtures/public-receipts/receipt-sandbox-g5.b64", encoding="ascii").read().strip()
          der = bytearray(base64.b64decode(text))
          der[-128] ^= 1
          rows = [("g5", text.encode()), ("g5-flipped", base64.b64encode(bytes(der)))]
          with open(sys.argv[1], "w") as out:
              for name, data in rows:
                  out.write(json.dumps({"id": name, "fn": "verify-receipt", "env": 0, "config": "",
                                        "now": 1790640000000, "b64": base64.b64encode(data).decode()}) + "\n")
          PY
          "$D/corpusrun" "$D/calls.jsonl" > "$RUNNER_TEMP/rows-host.jsonl"
          sudo env -i chroot "$D" /corpusrun /calls.jsonl | tee "$RUNNER_TEMP/rows-scratch.jsonl"
          diff "$RUNNER_TEMP/rows-host.jsonl" "$RUNNER_TEMP/rows-scratch.jsonl"
          grep -q '"verified":true' "$RUNNER_TEMP/rows-scratch.jsonl"
          grep -q 'INVALID_SIGNATURE' "$RUNNER_TEMP/rows-scratch.jsonl"

  # -count=2 so a second run in the same process catches state left behind by
  # the first, which is what a cached buffer or a memoised location would be.
  # Slow: every call goes through wazero under the race detector.
  go-race:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go/go.sum
      - run: go test -race -count=2 ./...
        working-directory: go

  # The seed corpora already run on every `go test`; this is the exploratory
  # pass over the two public entry points (the package parses nothing of
  # its own any more; the module's parser has its own fuzz jobs). A crasher
  # it finds is written under testdata/fuzz/ — commit that file, it becomes
  # a permanent regression case.
  go-fuzz:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go/go.sum
      - name: fuzz the verifiers
        run: |
          set -euo pipefail
          for target in FuzzVerifyReceipt FuzzVerifySignedData; do
            go test . -run "^${target}\$" -fuzz "^${target}\$" -fuzztime=60s
          done
        working-directory: go

  # gofmt, vet, staticcheck and govulncheck. The linters are pinned in
  # go/tools/go.mod, a module of its own so their Go floor (1.26, staticcheck
  # v0.8.1's requirement) never becomes the library's. staticcheck cannot lint
  # another module in place, so the binaries are built in go/tools and run
  # from go/.
  go-lint:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            go/go.sum
            go/tools/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: go
      - run: go vet ./...
        working-directory: go
      - name: build the pinned linters
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
          go build -o "$RUNNER_TEMP/govulncheck" golang.org/x/vuln/cmd/govulncheck
        working-directory: go/tools
      - run: '"$RUNNER_TEMP/staticcheck" ./...'
        working-directory: go
      # govulncheck reports only reachable vulnerabilities: in the standard
      # library, and in wazero, the package's one dependency.
      - run: '"$RUNNER_TEMP/govulncheck" ./...'
        working-directory: go
      # Structural gates: the library must never reach the OS trust store or
      # the network. The authoritative versions are Go tests that parse the
      # source (apisurface_test.go); this is a second, cruder opinion that
      # fails even if someone deletes them.
      - name: no system trust store, no network
        run: |
          set -euo pipefail
          if grep -rn --include='*.go' \
              -e 'x509\.SystemCertPool' -e 'x509\.NewCertPool' \
              -e 'x509\.VerifyOptions' -e '"net/http"' -e '"net"' \
              --exclude='*_test.go' --exclude-dir=tools --exclude-dir=gencerts .; then
            echo "::error::forbidden API in the published module"
            exit 1
          fi
        working-directory: go

  # go/roots/certs is a copy of the repository's certs/, because an embed
  # pattern may not reach outside its module directory. A copy that drifts
  # ships stale trust anchors — the Go twin of node's roots-data.ts guard.
  go-generate-check:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - run: go generate ./... && git diff --exit-code
        working-directory: go

  # The gem has one runtime dependency, wasmtime, installed from the
  # committed Gemfile.lock (its prebuilt platform gems included, so no Rust
  # toolchain). Every job that loads the library or builds the gem copies
  # rust-wasm's module into lib/ first: the gem checks it against
  # aprv.wasm.sha256 before compiling it, and the gemspec refuses to build
  # without it.
  ruby:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_FROZEN: "true"
    strategy:
      fail-fast: false
      matrix:
        # Every supported line (endoflife.date/ruby: 4.0, 3.4, 3.3). 3.3 is
        # also the gemspec's required_ruby_version floor since 0.7 (for
        # Data), so it stays tested while it is claimed, even past its EOL:
        # the java-runtime-8 / python-3.10 rule.
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" ruby
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      # The Wasmtime the platform gem carries is what runs the module; print
      # it so a red leg is diagnosable from the log.
      - run: ruby -v && bundle exec ruby -e 'require "wasmtime"; puts Wasmtime::VERSION'
        working-directory: ruby
      - run: bundle exec rake test
        working-directory: ruby
      # Four threads must reach twice one thread's verifications per second
      # (the gem releases the GVL around each call); checked on one leg,
      # where the runner's four CPUs are usable.
      - name: thread scaling
        if: matrix.ruby == '3.3'
        run: bundle exec ruby -Ilib bench/threads.rb --assert
        working-directory: ruby
      # roots_data.rb inlines the anchors; ruby/certs is a copy of the
      # repository roots. Either one drifting ships stale trust anchors.
      - run: ruby script/gen_roots.rb && git diff --exit-code lib/apple_purchase_receipt_verifier/roots_data.rb
        working-directory: ruby

  # Test the artifact the consumer receives, not the working tree: the Ruby
  # shape of the two broken npm releases is spec.files losing a file, which
  # ships a gem that loads cleanly and fails the first time anyone uses it.
  # APRV_PACKAGING=1 builds the gem, installs it into a GEM_HOME outside the
  # checkout (fetching the wasmtime platform gem from rubygems.org) and
  # verifies a genuine receipt from a fresh process.
  ruby-gem:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_FROZEN: "true"
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0"]      # the floor and the newest line
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" ruby
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      - run: APRV_PACKAGING=1 bundle exec rake test TEST=test/packaging_test.rb
        working-directory: ruby

  # The arm64-darwin platform gem of wasmtime, which the Linux legs never
  # load. One current-Ruby leg is enough.
  ruby-macos:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.ruby == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" ruby
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec ruby -e 'require "wasmtime"; puts Wasmtime::VERSION'
        working-directory: ruby
      - run: bundle exec rake test
        working-directory: ruby
      # For the log only: a shared macOS runner's thread numbers are not a
      # gate.
      - run: bundle exec ruby -Ilib bench/threads.rb
        working-directory: ruby

  # Lint and types on one modern Ruby, deliberately outside the matrix:
  # RuboCop and Steep raise their own Ruby floors faster than this library
  # does, and a tool that cannot run on 3.1 must not be able to fail the 3.1
  # leg. Their gemfile is the only one in the port with dependencies.
  ruby-tools:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: gemfiles/tools.gemfile
      # Frozen: install exactly gemfiles/tools.gemfile.lock or fail. Without
      # it bundler resolves rubocop, rbs and steep afresh on every push and
      # the seven-day dependabot cooldown protects nothing here.
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" ruby
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: "3.4"
          # The lockfile exists now, so the action can install and cache the
          # bundle itself; it keys the cache on that file and honours
          # BUNDLE_GEMFILE.
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rubocop
        working-directory: ruby
      - run: bundle exec rake rbs
        working-directory: ruby
      # `rbs validate` proves sig/ is well-formed; this proves lib/ matches
      # it. Steep needs a signature for every private method and internal
      # constant too, which is what sig/internals.rbs is for — that file is
      # not API and exists for this step.
      - run: bundle exec steep check
        working-directory: ruby
      # bench/bench.rb otherwise runs only in benchmark.yml, by hand. Loading
      # it requires the library and defines the benchmark module, but main
      # runs only when the file is the program itself, so nothing is timed.
      # A moved require or a renamed module-level constant fails here; calls
      # inside its methods are only checked by running it. Under the tools
      # bundle, which lists wasmtime, since the library now needs it.
      - run: bundle exec ruby -Ilib -e 'load "bench/bench.rb"'
        working-directory: ruby

  # The toolchains come from the rustup already on the runner. The whole
  # workspace: the core, the aprv-openssl adapter, aprv-surface, aprv-wire,
  # the C ABI and a native build of aprv-abi. The default build compiles
  # OpenSSL 4.0.2 from source (openssl-src), so target/ is cached: this is a
  # test job, and publish jobs never restore it.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Rust has no LTS lines. 1.85.0 is the floor the manifest claims, so
        # it is the one that needs proving; stable is what users have; beta
        # is the early warning.
        toolchain: ["1.85.0", "stable", "beta"]
    env:
      # openssl/tests/isolation.rs traces the adapter's system calls; a
      # missing or blocked tracer fails the job instead of skipping that half.
      APRV_REQUIRE_STRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y strace
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target
          key: rust-target-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-target-${{ runner.os }}-${{ matrix.toolchain }}-
      # rust/Cargo.lock is committed and every leg installs from it, so no
      # push resolves a version range. The file was generated with
      # CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback on a modern cargo,
      # which is what makes it resolvable on the 1.85.0 floor; regenerate it
      # the same way (rust/README.md). --locked turns "cargo quietly rewrote
      # the lockfile" into a failed job rather than an unnoticed bump.
      # aprv-abi is left out of the floor: wit-bindgen's generator crates
      # need Rust 1.88, and the module is built with the pinned toolchain
      # only (rust/rust-toolchain.toml).
      - name: test on the floor
        if: matrix.toolchain == '1.85.0'
        working-directory: rust
        run: cargo +1.85.0 test --locked --workspace --exclude aprv-abi --all-features
      - name: test on ${{ matrix.toolchain }}
        if: matrix.toolchain != '1.85.0'
        working-directory: rust
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo "+$TOOLCHAIN" test --locked --workspace --all-features
      # The prebuilt-OpenSSL leg: the same tests linked against an OpenSSL
      # 4.0.2 built outside cargo from the one pinned tarball, as a
      # distribution or a source build with OPENSSL_DIR links it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.toolchain != '1.85.0'
        with:
          path: ~/.cache/aprv-openssl-native
          key: aprv-openssl-native-${{ runner.os }}-${{ hashFiles('tools/openssl-native.sh', 'tools/wasm-toolchain.sh') }}
      - name: test on ${{ matrix.toolchain }} against a prebuilt OpenSSL 4
        if: matrix.toolchain != '1.85.0'
        working-directory: rust
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          ../tools/openssl-native.sh "$HOME/.cache/aprv-openssl-native" > "$RUNNER_TEMP/openssl.env"
          . "$RUNNER_TEMP/openssl.env"
          OPENSSL_NO_VENDOR=1 OPENSSL_STATIC=1 OPENSSL_DIR="$OPENSSL_DIR" \
            cargo "+$TOOLCHAIN" test --locked --workspace --no-default-features

  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        working-directory: rust
      - run: cargo fmt --check
        working-directory: rust/fuzz
      # The layering rules of docs/rust-core/SURFACE.md section 9 (which
      # crate may name OpenSSL, which may hold unsafe code), read from
      # cargo metadata and the sources.
      - run: node tools/check-layering.mjs

  # The C ABI (rust/ffi) and its three consumers. Three operating systems
  # because this is the only artifact in the repository whose contract is a
  # linker's: a symbol that resolves on Linux may not on Windows, and the
  # cdylib/import-library dance is different on each. The Rust legs above
  # prove the algorithm; this one proves that a C toolchain can reach it.
  rust-ffi:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      # rust/ffi is a member of the rust/ workspace: rust/Cargo.lock is its
      # lockfile and the library lands in rust/target/<profile>. --locked
      # turns "cargo quietly rewrote the lockfile" into a failed job rather
      # than an unnoticed bump.
      - run: cargo build --locked
        working-directory: rust/ffi
      # The floor this crate's manifest claims, proven rather than asserted —
      # once, because a Rust version floor is not platform-specific. A `check`
      # rather than a `test`: the tests need no older toolchain to be honest,
      # the compilable surface does.
      - name: the 1.85.0 floor compiles
        if: runner.os == 'Linux'
        working-directory: rust/ffi
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --locked --all-targets
      - run: cargo fmt --check
        working-directory: rust/ffi
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: rust/ffi
      # Layer 1: null pointers, non-UTF-8 input, rejected configurations, and
      # the panic guard every exported symbol runs its body inside.
      - run: cargo test --locked
        working-directory: rust/ffi

      # Layer 2, the primary one: fixtures/cases.json driven through the
      # ABI from C++17. A passing run is the evidence that the compiled-toolchain
      # path works: header compiles as C++, symbols link, answers match the
      # vectors every other port answers.
      - name: flatten the shared vectors for a compiler
        run: node tools/gen-cases-manifest.mjs rust/ffi/target/manifest
      - name: build the C++ consumers
        shell: bash
        run: |
          cmake -S rust/ffi/examples/cpp -B rust/ffi/target/cppbuild
          cmake --build rust/ffi/target/cppbuild --config Debug
      - name: C++ conformance over the C ABI
        shell: bash
        run: rust/ffi/target/cppbuild/bin/aprv_conformance rust/ffi/target/manifest
      - name: the README example
        shell: bash
        run: |
          rust/ffi/target/cppbuild/bin/aprv_example \
            fixtures/generated/jws-root.der \
            fixtures/generated/transaction.jws \
            fixtures/generated/receipt-b64/01-genuine.txt

      # Layer 3: the same vectors again from a language with no compiler in
      # the loop, checking the nested field paths the C++ harness cannot
      # reach. This is what "any FFI-capable language" means, tested.
      - name: ctypes conformance over the C ABI
        shell: bash
        working-directory: rust/ffi
        run: |
          interpreter=python3
          command -v python3 >/dev/null 2>&1 || interpreter=python
          "$interpreter" tests/conformance.py ../target/debug
      - name: the README example, from Python
        shell: bash
        working-directory: rust/ffi
        run: |
          interpreter=python3
          command -v python3 >/dev/null 2>&1 || interpreter=python
          "$interpreter" examples/python/example.py ../target/debug

      # include/apple_purchase_receipt_verifier.h is generated from
      # src/lib.rs; a change that forgets to regenerate it ships a header
      # describing an ABI the library no longer has. The same regenerate-and-
      # diff guard the generated roots files elsewhere in this workflow get.
      # Linux only: the header is platform-independent, and cbindgen is a
      # from-source install that costs a minute per runner.
      - name: the committed header is the generated one
        if: runner.os == 'Linux'
        shell: bash
        working-directory: rust/ffi
        run: |
          cargo install cbindgen --locked --version 0.29.0
          cbindgen --config cbindgen.toml \
                   --crate apple-purchase-receipt-verifier-ffi \
                   --output include/apple_purchase_receipt_verifier.h
          git diff --exit-code include/apple_purchase_receipt_verifier.h

  # The C ABI reached from a runtime that has no FFI of its own. The BEAM
  # cannot call C directly: every native call goes through a NIF, so an
  # Elixir consumer needs exactly one piece of C, and
  # rust/ffi/examples/elixir is that piece plus the shared vectors run
  # through it.
  #
  # This is an example, not a tenth port. Nothing is published, there is no
  # SUPPORT-MATRIX.md row, and one operating system is enough: rust-ffi
  # above already proves the linker contract on three, and what this job
  # adds is the NIF boundary, which is the same on all of them.
  elixir-ffi:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor mix.exs claims, and the OTP line behind it. Elixir
          # 1.18 is where the standard library got `JSON`, which is what
          # lets the example decode the ABI's documents with no Hex
          # dependency at all.
          - otp: "27"
            elixir: "1.18"
          # What a current install gets.
          - otp: "28"
            elixir: "1.20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: loose
      - run: rustup toolchain install stable --profile minimal
      # The NIF links against the cdylib and finds it again at load time
      # through an rpath, so this has to exist before mix compile runs.
      - run: cargo build --locked --release
        working-directory: rust/ffi
      - name: flatten the shared vectors
        run: node tools/gen-cases-manifest.mjs rust/ffi/target/manifest
      # Compiles c_src/aprv_nif.c through the Makefile as well: the mix
      # project has no Hex dependencies, so there is nothing to fetch.
      - name: build the NIF shim
        working-directory: rust/ffi/examples/elixir
        run: mix compile
      - name: conformance over the C ABI from Elixir
        working-directory: rust/ffi/examples/elixir
        run: mix test
      - name: the README example
        working-directory: rust/ffi/examples/elixir
        run: mix run example.exs
      - run: mix format --check-formatted
        working-directory: rust/ffi/examples/elixir

  # The exploratory pass over the core's four entry points (the receipt,
  # its base64 form, the transaction JWS and the endpoint JSON), with the
  # bounded JSON reader the core still writes by hand and OpenSSL's parsers
  # beneath them; rust/fuzz/README.md lists the targets and their
  # invariants. Seeds come from fixtures/, so a crasher is a mutation of a
  # genuine receipt or JWS, not of noise. It needs a nightly for the
  # sanitizer flags, which is why it is not part of the `rust` matrix. The
  # vendored OpenSSL here is not instrumented; nightly.yml's
  # rust-fuzz-openssl links an ASan and fuzzer-no-link build of it.
  rust-fuzz:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      # rust/fuzz/Cargo.lock is committed and cargo builds from it. cargo-fuzz
      # takes no --locked of its own, so this is a pin rather than a gate: a
      # manifest change makes cargo rewrite the lockfile here instead of
      # failing. The gate that matters is on the library, above.
      - run: ./run.sh all 60
        working-directory: rust/fuzz

  # SharpFuzz under libFuzzer, over the four public entry points and the
  # wrapper's own JSON handling around aprv.wasm. SharpFuzz instruments .NET
  # IL only, so the module is a black box here; its parser has its own fuzz
  # jobs (rust-fuzz, nightly.yml). The invariants are the go-fuzz and
  # rust-fuzz jobs': nothing but a VerificationException escapes, an
  # accepted receipt or JWS fails against an unrelated anchor set, and the
  # verifyReceipt endpoint always answers JSON with a numeric status.
  #
  # The fuzz project sits outside ApplePurchaseReceiptVerifier.sln on purpose,
  # so neither the `dotnet` job (dotnet test) nor `dotnet-format` sees it and
  # the shipped package gains no dependency on a fuzzing engine. run.sh builds
  # the libFuzzer driver with clang, which the ubuntu runner image already
  # carries, and instruments only the library assembly.
  dotnet-fuzz:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" dotnet
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # dotnet/bench sits outside the .sln for the same reason fuzz does, so
      # nothing else on push builds it; benchmark.yml runs it only by hand.
      # A build, as benchmark.yml does it, and no run.
      - run: dotnet build -c Release dotnet/bench
      - run: ./run.sh all 60
        working-directory: dotnet/fuzz

  # The exploratory pass over the façade's four entry points, through the
  # aprv binary (the CLI transport); php/fuzz/README.md lists the four
  # targets and their invariants. Seeds come from fixtures/, so a crasher is
  # a mutation of a genuine Apple-signed receipt or JWS rather than of
  # noise, and the anchor-set invariants are exercised on nearly every
  # iteration because several seeds genuinely verify.
  #
  # It is its own job, not a step in `php`, for the same reason `rust-fuzz` is
  # separate from `rust`: the tool is not the one the test matrix installs.
  # nikic/php-fuzzer is downloaded as a pinned phar by php/fuzz/run.sh and is
  # deliberately absent from composer.json: it would put its own php-parser
  # constraint into the resolved graph, and the `php-lowest` leg resolves that
  # graph again from scratch.
  #
  # pcntl is requested explicitly: php-fuzzer uses it for the per-execution
  # timeout that turns an input the parsers loop forever on into a recorded
  # crash instead of a job that hangs until the runner's own limit.
  php-fuzz:
    needs: [changes, aprv-server-linux]
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-server-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/aprv-bin
      - name: the aprv binary this tree builds
        run: |
          chmod +x "$RUNNER_TEMP/aprv-bin/aprv-x86_64-unknown-linux-musl"
          echo "APRV_BIN=$RUNNER_TEMP/aprv-bin/aprv-x86_64-unknown-linux-musl" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: json, curl, posix, pcntl
          coverage: none
      # The targets load the library through Composer's autoloader; no dev
      # dependency is needed for them, but the install is what writes it.
      - run: composer install --no-scripts --no-progress --no-interaction
        working-directory: php
      # 60 s per target, four targets. A crasher leaves
      # php/fuzz/crashes/<target>/crash-<hash>.txt and fails the job; reduce it
      # and pin it as a test under php/tests/, where it then runs on all five
      # PHP matrix legs rather than only here.
      - run: ./run.sh all 60
        working-directory: php/fuzz

  # The exploratory pass over the verifiers a consumer calls, through the
  # wrapper into aprv.wasm; ruby/fuzz/README.md lists the four targets and
  # the invariant each asserts. Seeds come from fixtures/, so a crasher is a
  # mutation of a genuine receipt or JWS, not of noise.
  #
  # It is not part of the `ruby` matrix because it cannot be: ruzzy is a
  # native extension that needs clang and libFuzzer's sanitizer runtimes, and
  # the whole point of that matrix is that the library installs nothing. Its
  # dependency lives in ruby/gemfiles/fuzz.gemfile for the same reason the
  # linters live in tools.gemfile — a tool that needs clang must not be able
  # to fail the Ruby 3.1 leg.
  #
  # clang is pinned to 18 with its matching libclang-rt: ruzzy links
  # libclang_rt.fuzzer_no_main.a and libclang_rt.asan.a out of the compiler's
  # own resource directory, so an unversioned `clang` that outruns the
  # installed runtime package fails the build with "Could not find asan".
  ruby-fuzz:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ruby/gemfiles/fuzz.gemfile
      # gemfiles/fuzz.gemfile.lock is committed; frozen makes the install use
      # it rather than resolve ruzzy again. bundler-cache stays false below
      # because the install needs the clang environment set on that step.
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" ruby
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          # One line, not the library's matrix: this job proves the parsers
          # hold, not that they hold on five rubies. 3.3 is where the harness
          # was developed and where ruzzy's branch-coverage hook is verified.
          ruby-version: "3.3"
          bundler-cache: false
      - name: install clang and the libFuzzer sanitizer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: install ruzzy
        env:
          MAKE: make --environment-overrides V=1
          CC: /usr/bin/clang-18
          CXX: /usr/bin/clang++-18
          LDSHARED: /usr/bin/clang-18 -shared
          LDSHAREDXX: /usr/bin/clang++-18 -shared
        run: bundle install --jobs 4
      # A crasher is written under ruby/fuzz/artifacts/<target>/, which is
      # gitignored on purpose, and the run fails with the offending unit
      # printed as hex and base64 in the log — the same handling go-fuzz and
      # rust-fuzz get. Reduce it from the log and pin it as a test under
      # ruby/test/, where it runs on every Ruby in the matrix rather than only
      # where a libFuzzer-capable clang is around.
      - name: fuzz every target
        run: ./run.sh all 60
        working-directory: ruby/fuzz

  # Three coverage-guided atheris targets over the verifiers (the receipt's
  # base64 form, the JWS, the endpoint JSON), 60 s each -- the same budget and the same shape as
  # go-fuzz and rust-fuzz. Pinned to CPython 3.13 because atheris ships wheels
  # only (3.1.0: 3.12/3.13/3.14, no sdist), so the fuzzer's Python is not the
  # library's: the `python` matrix above is what proves 3.10 through 3.14, and
  # every crasher these targets found is pinned as a test under python/tests/
  # so it runs on all of them. atheris stays out of the package's dependency
  # sets -- run.sh installs it into an ephemeral uv environment and fuzzes the
  # source tree off PYTHONPATH, exactly as the `python` job tests it.
  python-fuzz:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" python
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: ./run.sh all 60
        working-directory: python/fuzz

  # Coverage-guided fuzzing over the Swift port: SwiftPM's own libFuzzer
  # support (`-Xswiftc -sanitize=fuzzer`), so nothing is installed here --
  # the fuzzer ships with the toolchain, which is why this job has no setup
  # step at all. It runs in the same digest-pinned image as the `swift` and
  # `swift-format` jobs, at the newest line the matrix carries: the targets
  # are a development tool, not part of the version claim, so fuzzing them on
  # every supported Swift line would buy nothing the `swift` matrix does not
  # already prove.
  #
  # The targets live in swift/fuzz, a package of its own that depends on the
  # library by path, so the published root manifest carries no executable
  # targets a consumer would never run (swift/fuzz/README.md).
  #
  # 60 s per target, four targets, a fixed budget rather than a run count:
  # a fuzzer's job on a push is to keep proving the seeds and their neighbours
  # stay clean, not to search exhaustively. A crasher aborts the process and
  # fails the job; reduce it and pin it as a test under
  # swift/Tests/ApplePurchaseReceiptVerifierTests, where it then runs on every
  # Swift line rather than only here.
  swift-fuzz:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: swift:6.3@sha256:56ef1be2c1ca36f4c52440357dc1fcdfdb5e113587134fcadeef57c225c71b54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" swift
        shell: bash
      # swift/bench is a package of its own on the same path dependency, so
      # neither the `swift` matrix nor this job's fuzz build compiles it;
      # benchmark.yml builds it only by hand. A debug build: the point is that
      # it still compiles against the library, not how fast it runs.
      - run: swift build --package-path swift/bench --force-resolved-versions
      - run: ./run.sh all 60
        working-directory: swift/fuzz

  # Jazzer (Code Intelligence) under libFuzzer, over the readers this port
  # writes by hand -- the receipt attribute walk, the base64 dialect decoder
  # and the JWS/Jackson glue -- and the five public entry points on top of
  # them. Since the ASN.1 and CMS work is BouncyCastle's, these targets fuzz
  # this port's glue and BouncyCastle beneath it; both are instrumented, the
  # harness itself deliberately is not.
  #
  # The invariants are the go-fuzz, rust-fuzz and dotnet-fuzz jobs': nothing
  # but a VerificationException escapes a public entry point, an accepted
  # receipt or JWS fails against an unrelated anchor set, and the verifyReceipt
  # endpoint always answers JSON with a numeric status.
  #
  # java/fuzz is not a Maven module and is not in the pom's source roots, so
  # neither the `java` matrix (mvn test) nor the published artifact gains a
  # dependency on a fuzzing engine; run.sh compiles the harness against the
  # built jar with a modern javac, off the --release 8 floor the library keeps.
  # The one thing that does reach it is `java-format`: the pom's spotless
  # includes name fuzz/src explicitly, so the harness is held to the same
  # palantir format as the library.
  #
  # Jazzer arrives as two sha256-pinned jars from Maven Central rather than
  # from the GitHub release zip: the same artifacts, from the mirror the Maven
  # build already reaches, with the publisher's own checksum file to check the
  # pin against.
  java-fuzz:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./run.sh all 60
        working-directory: java/fuzz

  # Advisories, license policy, and the banned-crate list that is the
  # mechanised form of "pinned anchors only, no network ever": a dependency
  # bump cannot introduce a system trust store or an HTTP client, because
  # cargo-deny refuses the crates that carry them. It reads the committed
  # rust/Cargo.lock, so it audits the exact versions every other rust leg
  # builds; an advisory against a version we do not use is not our problem,
  # and one against a version we do use cannot hide behind a fresh resolve.
  rust-supply-chain:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-deny --locked
      # The whole workspace, the C ABI (ffi/) and the bindings included. The
      # two packages outside it with lockfiles of their own, rust/server and
      # rust/bindings/abi/tests, are not audited here: both link Wasmtime,
      # whose Apache-2.0 WITH LLVM-exception licence deny.toml does not list.
      - run: cargo deny check
        working-directory: rust

  # aprv.wasm, built the way release.yml's build-wasm builds it, then held to
  # its contract (ARCHITECTURE.md §9, MIGRATION.md steps 1.4, 1.5, 1.14):
  # exactly one import, random-get; the export list; the WIT read back from
  # the component equal to rust/bindings/abi/wit/aprv.wit; the ABI tests on a
  # hand-rolled host; every case of fixtures/cases.json through a host whose
  # import object traps on anything but random-get; every answer valid
  # against the wire schemas; and a second build, in a fresh clone, that
  # reproduces the hash.
  #
  # It runs whenever any area is selected, because every host job downloads
  # its `aprv-wasm` artifact before its first build step (OD-01): a host is
  # always tested against the module this tree builds, never one from an
  # earlier run.
  #
  # The reference rows here are the cases' own expectations. The spike
  # corpora (1,179 rows and 5,000 mutants) are scratch data of the evidence
  # rounds and not in the repository; tools/wasm-trap-host.mjs `calls` runs
  # them wherever they are (docs/evidence/2026-09-29-canonical-abi-final),
  # and nightly.yml runs them when APRV_CORPUS_URL names an archive.
  #
  # It caches the toolchain directory, keyed by the hash of the script that
  # makes it: this is a test job, and the cached tree is re-verified by
  # nothing but its key, which is why release.yml's build-wasm never
  # restores it.
  rust-wasm:
    needs: changes
    if: needs.changes.outputs.module == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      wasm-sha256: ${{ steps.build.outputs.wasm-sha256 }}
      component-sha256: ${{ steps.build.outputs.component-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/aprv-wasm-toolchain
          key: aprv-wasm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/wasm-toolchain.sh') }}
      - name: install the pinned wasm toolchain
        run: |
          set -euo pipefail
          dir="$HOME/.cache/aprv-wasm-toolchain"
          tools/wasm-toolchain.sh "$dir" > /dev/null
          { echo "WASI_SDK_DIR=$dir/wasi-sdk"; echo "OPENSSL_WASM_DIR=$dir/openssl-wasm"; } >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"
      # The rustc rust/rust-toolchain.toml names, with the wasm32-wasip1
      # target, made the one every later step uses: build.sh runs from the
      # repository root, where rustup does not read that file.
      - name: install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target wasm32-wasip1
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: build aprv.wasm and the component
        id: build
        run: |
          set -euo pipefail
          rust/bindings/abi/build.sh "$RUNNER_TEMP/aprv"
          wasm=$(sha256sum "$RUNNER_TEMP/aprv/aprv.wasm" | cut -c1-64)
          component=$(sha256sum "$RUNNER_TEMP/aprv/aprv.component.wasm" | cut -c1-64)
          echo "wasm-sha256=$wasm" >> "$GITHUB_OUTPUT"
          echo "component-sha256=$component" >> "$GITHUB_OUTPUT"
          {
            echo "| file | bytes | SHA-256 |"
            echo "|---|---:|---|"
            for f in aprv.wasm aprv.component.wasm aprv.wit; do
              echo "| $f | $(wc -c < "$RUNNER_TEMP/aprv/$f") | \`$(sha256sum "$RUNNER_TEMP/aprv/$f" | cut -c1-64)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aprv-wasm
          path: |
            ${{ runner.temp }}/aprv/aprv.wasm
            ${{ runner.temp }}/aprv/aprv.component.wasm
            ${{ runner.temp }}/aprv/aprv.wit
            ${{ runner.temp }}/aprv/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # The module's contract, checked on the build rust-wasm uploaded, in a
  # job of its own so the host jobs start as soon as the module exists and
  # a broken contract is its own red job rather than a wall of skipped ones.
  rust-wasm-checks:
    needs: [changes, rust-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: the CI tools' own tests
        run: |
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          npm --prefix tools test
          shellcheck tools/*.sh tools/reproduce/entrypoint.sh .github/scripts/*.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - name: imports, exports, WIT read-back and SHA256SUMS
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wasm-tools"
          pin() { sed -n "s/^$1=\(.*\)$/\1/p" tools/wasm-toolchain.sh; }
          curl -fsSL --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/wasm-tools.tar.gz" "$(pin WASM_TOOLS_URL)"
          echo "$(pin WASM_TOOLS_SHA256)  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum -c -
          mkdir -p "$dir"
          tar -C "$dir" --strip-components=1 -xzf "$RUNNER_TEMP/wasm-tools.tar.gz"
          echo "$dir" >> "$GITHUB_PATH"
          PATH="$dir:$PATH" tools/check-wasm.sh "$RUNNER_TEMP/aprv" rust/bindings/abi/wit/aprv.wit
      - name: the ABI tests on a hand-rolled host
        run: node tools/wasm-trap-host.mjs abi-tests "$RUNNER_TEMP/aprv/aprv.wasm" fixtures/cases.json
      - name: every case through the trap-on-anything host
        run: node tools/wasm-trap-host.mjs cases "$RUNNER_TEMP/aprv/aprv.wasm" fixtures/cases.json --answers "$RUNNER_TEMP/answers"
      # Every answer the cases produced, against its JSON Schema 2020-12 file
      # (step 1.14), then one planted wrong type, which must fail: a schema
      # that accepts everything would pass the first half alone.
      - name: every answer validates against the wire schemas
        run: |
          set -euo pipefail
          S=rust/bindings/wire/schema
          A="$RUNNER_TEMP/answers"
          node tools/validate-wire.mjs "$S/init-config.schema.json" "$A/init-config.jsonl"
          node tools/validate-wire.mjs "$S/init-result.schema.json" "$A/init.jsonl"
          node tools/validate-wire.mjs "$S/verify-receipt-result.schema.json" "$A/verify-receipt.jsonl"
          node tools/validate-wire.mjs "$S/verify-signed-data-result.schema.json" "$A/verify-signed-data.jsonl"
          head -1 "$A/verify-receipt.jsonl" | sed -E 's/"verified":(true|false)/"verified":"planted"/' > "$RUNNER_TEMP/planted.jsonl"
          if node tools/validate-wire.mjs "$S/verify-receipt-result.schema.json" "$RUNNER_TEMP/planted.jsonl"; then
            echo "::error::a planted wrong type validated; verify-receipt-result.schema.json does not constrain \"verified\""
            exit 1
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/aprv-wasm-toolchain
          key: aprv-wasm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/wasm-toolchain.sh') }}
      - name: install the pinned wasm and Rust toolchains
        run: |
          set -euo pipefail
          dir="$HOME/.cache/aprv-wasm-toolchain"
          tools/wasm-toolchain.sh "$dir" > /dev/null
          { echo "WASI_SDK_DIR=$dir/wasi-sdk"; echo "OPENSSL_WASM_DIR=$dir/openssl-wasm"; } >> "$GITHUB_ENV"
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component clippy --target wasm32-wasip1
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      # aprv-abi's cfg(target_arch = "wasm32") code, which the native
      # workspace lint in rust-lint never compiles, with the C compiler and
      # OpenSSL build.sh uses.
      - name: clippy on the wasm32-wasip1 build
        working-directory: rust
        run: |
          set -euo pipefail
          sysroot="$WASI_SDK_DIR/share/wasi-sysroot"
          CC_wasm32_wasip1="$WASI_SDK_DIR/bin/clang" \
          AR_wasm32_wasip1="$WASI_SDK_DIR/bin/llvm-ar" \
          CFLAGS_wasm32_wasip1="--target=wasm32-wasip1 --sysroot=$sysroot -D_WASI_EMULATED_SIGNAL -D_WASI_EMULATED_PROCESS_CLOCKS -D_WASI_EMULATED_MMAN -D_WASI_EMULATED_GETPID" \
          OPENSSL_NO_VENDOR=1 OPENSSL_STATIC=1 OPENSSL_DIR="$OPENSSL_WASM_DIR" \
          OPENSSL_LIB_DIR="$OPENSSL_WASM_DIR/lib" OPENSSL_INCLUDE_DIR="$OPENSSL_WASM_DIR/include" \
            cargo clippy --locked -p aprv-abi --target wasm32-wasip1 -- -D warnings
      # A second build of the same commit in a fresh clone and a directory it
      # never ran in: a path leaking into the module, or anything else that
      # is not a function of the source and the pins, shows as a mismatch.
      - name: the build reproduces in a fresh clone
        env:
          EXPECTED: ${{ needs.rust-wasm.outputs.wasm-sha256 }}
        run: |
          APRV_REPO_URL="file://$GITHUB_WORKSPACE" APRV_TOOLCHAIN_DIR="$HOME/.cache/aprv-wasm-toolchain" \
            tools/reproduce-wasm.sh "$GITHUB_SHA" "$EXPECTED"

  # The ABI tests under Wasmtime: rust/bindings/abi/tests, a package outside
  # the workspace with its own lockfile, drives the built module and
  # component through the runtime aprv-server ships. Its target directory is
  # cached (a test job; Wasmtime with Cranelift is a four-minute build).
  rust-wasm-abi:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - name: install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/bindings/abi/tests/target
          key: rust-wasm-abi-${{ runner.os }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/bindings/abi/tests/Cargo.lock') }}
      - run: cargo test --locked --manifest-path rust/bindings/abi/tests/Cargo.toml
        env:
          APRV_WASM: ${{ runner.temp }}/aprv/aprv.wasm
          APRV_COMPONENT: ${{ runner.temp }}/aprv/aprv.component.wasm

  # Every committed copy of aprv.wasm (the Go module's and the Swift
  # package's, R14) and every tracked pin of it (each host's
  # aprv.wasm.sha256, Node's aprv.component.wasm.sha256) against the module
  # rust-wasm just built from the same tree. On a release-please branch a
  # difference fails: that tree becomes the tag, and a Go tag is forever.
  # Anywhere else the copies and pins may lag the core until
  # release-please.yml refreshes them on the release branch, so a
  # difference is a warning that says which file and which hash (the host
  # jobs test the build, whatever the pin says: place-module.sh).
  wasm-copies:
    needs: rust-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compare every committed copy and pin with the build
        env:
          BUILT: ${{ needs.rust-wasm.outputs.wasm-sha256 }}
          COMPONENT: ${{ needs.rust-wasm.outputs.component-sha256 }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          strict=false
          case "$HEAD_REF" in release-please--*) strict=true ;; esac
          bad=0
          report() { # file got want
            if [ "$2" = "$3" ]; then
              echo "$1 matches the build ($3)"
            elif [ "$strict" = true ]; then
              echo "::error file=$1::$1 is $2; this tree builds $3, and a release must carry the module it builds"
              bad=1
            else
              echo "::warning file=$1::$1 is $2; this tree builds $3 (release-please.yml refreshes it on the release branch)"
            fi
          }
          for f in $(git ls-files -- '*aprv.wasm'); do
            report "$f" "$(sha256sum "$f" | cut -c1-64)" "$BUILT"
          done
          for f in $(git ls-files -- '*aprv.wasm.sha256'); do
            report "$f" "$(cut -c1-64 "$f")" "$BUILT"
          done
          for f in $(git ls-files -- '*aprv.component.wasm.sha256'); do
            report "$f" "$(cut -c1-64 "$f")" "$COMPONENT"
          done
          # A committed copy and its pin must also agree with each other:
          # the package checks the pair when it loads, so a copy swapped
          # without its pin fails every consumer.
          for f in $(git ls-files -- '*aprv.wasm'); do
            (cd "$(dirname "$f")" && sha256sum -c aprv.wasm.sha256) || bad=1
          done
          exit "$bad"

  # The grep gate of ARCHITECTURE.md §9: no non-Java wrapper reaches a
  # crypto, X.509, ASN.1 or CMS API outside its tests, since aprv.wasm makes
  # every such decision. Every wrapper is enforced; the few 0.7 API types
  # that carry DER in and out (Go's *x509.Certificate roots, .NET's
  # X509Certificate2) are allowlisted per file with a reason in the tool
  # (OD-04), and `--enforce all` is MIGRATION.md Phase 7 step 5.
  one-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node tools/check-one-implementation.mjs --enforce node,python,go,swift,ruby,dotnet,php,java-wasm

  # The Linux x86_64 static aprv binary, built as the release builds it
  # (rust/server/scripts/build-static.sh, the component rust-wasm built from
  # this tree embedded) and uploaded as `aprv-server-x86_64-unknown-linux-musl`
  # for the jobs that run it: the server's contract and image jobs, every PHP
  # job (the binary is PHP's only transport, APRV_BIN) and the Java -wasm
  # artifact's server engine. The binary is a test input and never a
  # release asset (release.yml builds its own), so the target directory is
  # cached. The checks here are the ones that need nothing but the binary:
  # no interpreter and no dynamic dependency (build-static.sh), an empty
  # chroot, the cases over HTTP and the CLI, the managed mode, and the
  # hostile component through a full build.
  aprv-server-linux:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.server-bin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - name: install the pinned Rust toolchain and the musl target
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/server/target
          key: aprv-server-linux-${{ runner.os }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/server/Cargo.lock') }}
      - name: the two-stage static build
        env:
          COMPONENT_SHA256: ${{ needs.rust-wasm.outputs.component-sha256 }}
        run: rust/server/scripts/build-static.sh "$RUNNER_TEMP/aprv/aprv.component.wasm" x86_64-unknown-linux-musl "$RUNNER_TEMP/server"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aprv-server-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/server/aprv-x86_64-unknown-linux-musl
          if-no-files-found: error
          retention-days: 14
      - name: a static binary runs with nothing around it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty"
          cp "$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl" "$RUNNER_TEMP/empty/aprv"
          sudo env -i chroot "$RUNNER_TEMP/empty" /aprv info
      - name: every case over HTTP and through the CLI
        run: python3 rust/server/scripts/cases.py --aprv "$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl" --mode both --list
      - name: the managed mode
        run: python3 rust/server/scripts/managed-smoke.py --aprv "$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl"
      # wasm-tools from its pinned release archive (tools/wasm-toolchain.sh
      # holds the one pin), to assemble the hostile component the full
      # build step 1 left serves.
      - name: the hostile component through a real server
        run: |
          set -euo pipefail
          pin() { sed -n "s/^$1=\(.*\)$/\1/p" tools/wasm-toolchain.sh; }
          curl -fsSL --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/wasm-tools.tar.gz" "$(pin WASM_TOOLS_URL)"
          echo "$(pin WASM_TOOLS_SHA256)  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasm-tools"
          tar -C "$RUNNER_TEMP/wasm-tools" --strip-components=1 -xzf "$RUNNER_TEMP/wasm-tools.tar.gz"
          PATH="$RUNNER_TEMP/wasm-tools:$PATH" rust/server/scripts/hostile-smoke.sh rust/server/target/x86_64-unknown-linux-gnu/release/aprv

  # aprv-server (MIGRATION.md Phase 2): lint and tests with the component
  # rust-wasm built from this same tree, on Linux x86_64 and aarch64, macOS
  # and Windows; the aarch64 leg also builds that target's static binary
  # natively and runs it as the x86_64 one runs in aprv-server-linux. The
  # macOS and Windows legs run the tests only: their release binaries are
  # built by release.yml (MIGRATION.md step 2.4). The target directory is
  # cached (a test job).
  aprv-server:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - name: install the pinned Rust toolchain and the target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/server/target
          key: aprv-server-${{ matrix.target }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/server/Cargo.lock') }}
      - run: cargo fmt --check
        working-directory: rust/server
      - run: cargo clippy --locked --all-targets --features compile -- -D warnings
        working-directory: rust/server
      # The runtime-only feature set, which is what ships.
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: rust/server
      # --include-ignored: the WIT and wire-schema comparisons with
      # rust/bindings run too.
      - name: the tests, with this tree's component
        shell: bash
        working-directory: rust/server
        run: APRV_TEST_COMPONENT="$RUNNER_TEMP/aprv/aprv.component.wasm" cargo test --locked --features compile -- --include-ignored
      - name: the aarch64 static binary
        if: matrix.target == 'aarch64-unknown-linux-musl'
        env:
          COMPONENT_SHA256: ${{ needs.rust-wasm.outputs.component-sha256 }}
        run: |
          set -euo pipefail
          rust/server/scripts/build-static.sh "$RUNNER_TEMP/aprv/aprv.component.wasm" aarch64-unknown-linux-musl "$RUNNER_TEMP/server"
          bin="$RUNNER_TEMP/server/aprv-aarch64-unknown-linux-musl"
          mkdir -p "$RUNNER_TEMP/empty"
          cp "$bin" "$RUNNER_TEMP/empty/aprv"
          sudo env -i chroot "$RUNNER_TEMP/empty" /aprv info
          python3 rust/server/scripts/cases.py --aprv "$bin" --mode both --list

  # The server's HTTP contract (R34): Spectral lints rust/server/openapi.yaml
  # with the committed ruleset (0 findings at hint severity); Schemathesis
  # runs the served document against the static binary, without and with a
  # token. Both tools are pinned by version and run from ephemeral
  # installs, Schemathesis from a scratch directory (it writes .schemathesis
  # and .hypothesis where it runs).
  aprv-server-contract:
    needs: [changes, aprv-server-linux]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Spectral over the OpenAPI document
        working-directory: rust/server
        run: npx --yes @stoplight/spectral-cli@6.16.3 lint --fail-severity=hint --ruleset .spectral.yaml openapi.yaml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-server-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/server
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Schemathesis against a started server, without and with a token
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl"
          chmod +x "$bin"
          work="$RUNNER_TEMP/schemathesis"
          mkdir -p "$work"
          cd "$work"
          up() { for _ in $(seq 1 50); do curl -fsS "http://127.0.0.1:$1/healthz" >/dev/null 2>&1 && return 0; sleep 0.2; done; return 1; }
          "$bin" serve --listen 127.0.0.1:18080 > serve1.log 2>&1 &
          p1=$!
          token=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          APRV_TOKEN="$token" "$bin" serve --listen 127.0.0.1:18081 > serve2.log 2>&1 &
          p2=$!
          trap 'kill "$p1" "$p2" 2>/dev/null || true; cat serve1.log serve2.log' EXIT
          up 18080
          up 18081
          uvx --from schemathesis==4.28.0 schemathesis run http://127.0.0.1:18080/openapi.json \
            --checks all --max-examples 50 --workers 1
          uvx --from schemathesis==4.28.0 schemathesis run http://127.0.0.1:18081/openapi.json \
            --checks all --max-examples 30 --workers 1 -H "X-Aprv-Token: $token"

  # The Docker image both ways it is built: from source (the Dockerfile's
  # two-stage build, the component as a named context) natively on each
  # architecture, and, on x86_64, the release's way (`--target prebuilt`
  # around the static binary aprv-server-linux built). Each image then runs
  # rust/server/scripts/docker-smoke.sh: the OCI labels, uid 65532, nothing
  # answering without APRV_LISTEN, the token, and g5.
  aprv-server-image:
    needs: [changes, rust-wasm, aprv-server-linux]
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64, arch: amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - name: the image from source
        env:
          PLATFORM: ${{ matrix.platform }}
          COMPONENT_SHA256: ${{ needs.rust-wasm.outputs.component-sha256 }}
        run: |
          set -euo pipefail
          docker buildx build --platform "$PLATFORM" -f rust/server/Dockerfile \
            --build-context component="$RUNNER_TEMP/aprv" \
            --build-arg COMPONENT_SHA256="$COMPONENT_SHA256" \
            --build-arg VERSION="$(cat version.txt)-ci" --build-arg REVISION="$GITHUB_SHA" \
            --load -t aprv-server:ci .
          sh rust/server/scripts/docker-smoke.sh aprv-server:ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.arch == 'amd64'
        with:
          name: aprv-server-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/server
      - name: the image the release's way, around the prebuilt binary
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/ctx"
          mkdir -p "$ctx"
          install -m 0755 "$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl" "$ctx/aprv-amd64"
          docker buildx build --platform linux/amd64 --target prebuilt -f rust/server/Dockerfile \
            --build-arg VERSION="$(cat version.txt)-ci" --build-arg REVISION="$GITHUB_SHA" \
            --load -t aprv-server:prebuilt "$ctx"
          sh rust/server/scripts/docker-smoke.sh aprv-server:prebuilt

  # The -wasm Java artifact (java-wasm/, MIGRATION.md Phase 3) with the
  # Endive engine: the cases on every Temurin line from 11 (Endive's
  # floor), compiled with JDK 21 and tested on the JVM under test through
  # surefire's `jvm` (a JRE cannot compile). Endive compiles the aprv.wasm
  # rust-wasm built from this tree; the server-engine tests run the static
  # binary aprv-server-linux built, pinned for the run in a SHA256SUMS of
  # its own. Waits for java-wasm/pom.xml (the Java lane).
  java-wasm-endive:
    needs: [changes, rust-wasm, aprv-server-linux]
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: ["11", "17", "21", "25", "27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: is the -wasm artifact here yet?
        id: gate
        run: |
          if [ -f java-wasm/pom.xml ]; then echo "present=true"; else echo "::notice::java-wasm/pom.xml does not exist yet (MIGRATION.md Phase 3)" >&2; echo "present=false"; fi >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          name: aprv-server-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/server
      - name: the module and the server binary this tree builds
        if: steps.gate.outputs.present == 'true'
        run: |
          set -euo pipefail
          .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" java
          chmod +x "$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl"
          (cd "$RUNNER_TEMP/server" && sha256sum aprv-x86_64-unknown-linux-musl > SHA256SUMS)
      # The JVM under test first (its home is exported as JAVA_HOME_<v>_X64),
      # then JDK 21 last, which wins JAVA_HOME and runs Maven.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: the cases with the Endive engine and the server engine
        if: steps.gate.outputs.present == 'true'
        env:
          JDK: ${{ matrix.jdk }}
        run: |
          set -euo pipefail
          var="JAVA_HOME_${JDK}_X64"
          mvn -B -f java-wasm verify \
            "-Dtest.jvm=${!var}/bin/java" \
            "-Daprv.server.linux-x86_64=$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl" \
            "-Daprv.server.sha256sums=$RUNNER_TEMP/server/SHA256SUMS"

  # The -wasm artifact on a real Java 8 JVM, where Verifier.create picks the
  # server engine (the Endive tests are left out by the java8-tests
  # profile), with the static binary aprv-server-linux built.
  java-wasm-runtime-8:
    needs: [changes, rust-wasm, aprv-server-linux]
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: is the -wasm artifact here yet?
        id: gate
        run: |
          if [ -f java-wasm/pom.xml ]; then echo "present=true"; else echo "::notice::java-wasm/pom.xml does not exist yet (MIGRATION.md Phase 3)" >&2; echo "present=false"; fi >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          name: aprv-server-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/server
      - name: the module and the server binary this tree builds
        if: steps.gate.outputs.present == 'true'
        run: |
          set -euo pipefail
          .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" java
          chmod +x "$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl"
          (cd "$RUNNER_TEMP/server" && sha256sum aprv-x86_64-unknown-linux-musl > SHA256SUMS)
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: the server engine on Java 8
        if: steps.gate.outputs.present == 'true'
        run: |
          mvn -B -f java-wasm verify -Pjava8-tests "-Dtest.jvm=${JAVA_HOME_8_X64}/bin/java" \
            "-Daprv.server.linux-x86_64=$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl" \
            "-Daprv.server.sha256sums=$RUNNER_TEMP/server/SHA256SUMS"
      # ServerNoexecTest mounts a noexec tmpfs, which needs root; without it
      # the test reports itself skipped with the reason.
      - name: the noexec advice, as root
        if: steps.gate.outputs.present == 'true'
        run: |
          sudo -E env "PATH=$PATH" mvn -B -f java-wasm test -Dtest=ServerNoexecTest -Dsurefire.failIfNoSpecifiedTests=false \
            "-Daprv.server.linux-x86_64=$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl" \
            "-Daprv.server.sha256sums=$RUNNER_TEMP/server/SHA256SUMS"

  # The JVM consumers again, on the -wasm artifact (Endive, since both need
  # Java 17 or later): jvm-interop's Kotlin and Scala tests and the Spring
  # Boot smoke on both Boot lines take the artifact as
  # -Dverifier.artifactId. Waits for java-wasm/pom.xml.
  java-wasm-consumers:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        consumer: [jvm-interop, boot-4.0.8, boot-4.1.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: is the -wasm artifact here yet?
        id: gate
        run: |
          if [ -f java-wasm/pom.xml ]; then echo "present=true"; else echo "::notice::java-wasm/pom.xml does not exist yet (MIGRATION.md step 3.9)" >&2; echo "present=false"; fi >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - if: steps.gate.outputs.present == 'true'
        run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" java
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: the consumer on the -wasm artifact
        if: steps.gate.outputs.present == 'true'
        env:
          CONSUMER: ${{ matrix.consumer }}
        run: |
          set -euo pipefail
          mvn -B -f java install -DskipTests
          mvn -B -f java-wasm install -DskipTests
          if [ "$CONSUMER" = jvm-interop ]; then
            mvn -B -f jvm-interop test -Dverifier.artifactId=apple-purchase-receipt-verifier-wasm
          else
            version=$(mvn -q -f java help:evaluate -Dexpression=project.version -DforceStdout)
            mvn -B -f java/samples/spring-boot-smoke/pom.xml test -Dverifier.version="$version" \
              -Dspring-boot.version="${CONSUMER#boot-}" -Dverifier.artifactId=apple-purchase-receipt-verifier-wasm
          fi

  # Both Java artifacts on one classpath must fail fast, and a Gradle build
  # that asks for both must fail at resolution (the capability conflict):
  # java-wasm/scripts/classpath-guard.sh. Waits for java-wasm/pom.xml.
  java-classpath-guard:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: is the -wasm artifact here yet?
        id: gate
        run: |
          if [ -f java-wasm/pom.xml ]; then echo "present=true"
          else echo "::notice::java-wasm/pom.xml does not exist yet (MIGRATION.md step 3.5)" >&2; echo "present=false"; fi >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - if: steps.gate.outputs.present == 'true'
        run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" java
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.gate.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The Gradle the capability check was written against, on PATH.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.gate.outputs.present == 'true'
        with:
          gradle-version: "8.14.3"
          cache-disabled: true
      - name: both jars on one classpath fail; Gradle refuses both
        if: steps.gate.outputs.present == 'true'
        run: java-wasm/scripts/classpath-guard.sh

  # The PHP package is a façade over the aprv binary (Phase 6): every PHP
  # job that runs the library gets aprv-server-linux's static binary, the
  # one built around this tree's component, as APRV_BIN (the suite fails
  # loudly without it). The package needs json and curl; posix is for the
  # CLI tests' fake aprv, which raises a signal. openssl is needed by
  # neither, and no leg installs it.
  #
  # Every line the composer.json floor admits. 8.2 is the floor since 0.7 (for
  # readonly class); it stays here for exactly as long as the manifest claims
  # it, even past its own security-support end, the same rule as node 20 and
  # python 3.10.
  php:
    needs: [changes, aprv-server-linux]
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-server-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/aprv-bin
      - name: the aprv binary this tree builds
        run: |
          chmod +x "$RUNNER_TEMP/aprv-bin/aprv-x86_64-unknown-linux-musl"
          echo "APRV_BIN=$RUNNER_TEMP/aprv-bin/aprv-x86_64-unknown-linux-musl" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl, posix
          coverage: none
          ini-values: memory_limit=256M
      # composer install, not update: php/composer.lock is committed and is
      # what every leg here installs, so no push resolves a version range.
      # The lock is resolved for the floor (config.platform.php = 8.2.0 in
      # composer.json), which is what lets one file install on all four legs:
      # it pins PHPUnit 11.5, whose php constraint spans 8.2 to 8.5.
      # --no-scripts for the same reason every npm ci carries
      # --ignore-scripts.
      - run: composer install --no-scripts --no-progress --no-interaction --prefer-dist
        working-directory: php
      # The façade, the transports, the installer and the gates: no network.
      - run: vendor/bin/phpunit --exclude-testsuite conformance
        working-directory: php
      # Every case of fixtures/cases.json through the CLI transport.
      - run: vendor/bin/phpunit tests/ConformanceCasesTest.php
        working-directory: php
      # And once over HTTP, against a locally started `aprv serve` per root
      # set.
      - name: every case over HTTP
        if: matrix.php == '8.4'
        run: vendor/bin/phpunit tests/ConformanceHttpTest.php
        working-directory: php

  # The floor is a claim about the constraints, not only about the runtime:
  # this leg installs the oldest version of everything the manifest allows, so
  # a change that quietly needs a newer psr/clock or PHPUnit fails here rather
  # than on a consumer's machine. It is the one PHP leg that still resolves
  # from ranges, and deliberately: resolving is what it tests. The lockfile
  # would make it a copy of the `php` job's 8.2 leg.
  php-lowest:
    needs: [changes, aprv-server-linux]
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-server-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/aprv-bin
      - name: the aprv binary this tree builds
        run: |
          chmod +x "$RUNNER_TEMP/aprv-bin/aprv-x86_64-unknown-linux-musl"
          echo "APRV_BIN=$RUNNER_TEMP/aprv-bin/aprv-x86_64-unknown-linux-musl" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          extensions: json, curl, posix
          coverage: none
      - run: composer update --no-progress --no-interaction --prefer-lowest --prefer-stable
        working-directory: php
      - run: vendor/bin/phpunit
        working-directory: php

  php-static:
    needs: [changes, aprv-server-linux]
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-server-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/aprv-bin
      - name: the aprv binary this tree builds
        run: |
          chmod +x "$RUNNER_TEMP/aprv-bin/aprv-x86_64-unknown-linux-musl"
          echo "APRV_BIN=$RUNNER_TEMP/aprv-bin/aprv-x86_64-unknown-linux-musl" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: json, curl, posix
          coverage: none
      # The consumer smoke and the drift guard are Node, like the rest of
      # tools/. They live in this job rather than in `conformance` because
      # what they check is the PHP package, and because the smoke needs the
      # PHP that setup-php just installed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: composer install --no-scripts --no-progress --no-interaction
        working-directory: php
      # --strict also reports a composer.lock that no longer matches
      # composer.json, which is the drift this port's lockfile can suffer.
      - run: composer validate --strict
        working-directory: php
      # The root manifest is what Packagist reads and what Composer installs;
      # php/composer.json is only the development one. Both get validated.
      - run: composer validate --strict --no-check-lock composer.json
      # src, tests, bin/ and tools/update-binaries.php (phpstan.neon).
      - run: vendor/bin/phpstan analyse --no-progress
        working-directory: php
      # bench/bench.php otherwise runs only in benchmark.yml, by hand. This is
      # a syntax check and nothing more.
      - run: php -l bench/bench.php
        working-directory: php
      # php/certs/ is a copy of the repository-root certs/, and
      # src/Internal/RootsData.php is generated from that copy. A roots change
      # that forgets either step would ship stale trust anchors.
      - run: php php/tools/gen-roots.php && git diff --exit-code php/src/Internal/RootsData.php
      # Two manifests for one package drift, and the .gitattributes allowlist
      # silently decides what a PHP consumer unpacks. This reads the real
      # `git archive` rather than the rules that produce it: the manifests
      # agree on bin and suggest, and the archive carries bin/aprv-install
      # and binaries.json.
      - run: node tools/check-php-package.mjs
      # Then install that archive into a throwaway project and verify a
      # receipt through vendor/autoload.php and the default CLI transport
      # (APRV_BIN): the only check here that runs against what a stranger
      # downloads rather than against a checkout.
      - run: node tools/php-consumer-smoke.mjs

  # The matrix that matters here is OS, not SDK: the Wasmtime package ships
  # a native library per platform (linux-x64, osx-arm64, win-x64 here), and
  # each is what runs the module there. The netstandard2.0 floor gets its
  # own jobs below. Every .NET job that builds the library copies
  # rust-wasm's module to src/ApplePurchaseReceiptVerifier/wasm/ first: the
  # project embeds it and refuses to build without it.
  dotnet:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" dotnet
        shell: bash
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      # The three SDKs above are not decoration: the test projects
      # multi-target net8.0, net9.0 and net10.0, so this runs the suite on
      # each runtime. It used to install all three and execute only .NET 9,
      # which goes end of life in November 2026 while net8.0 and net10.0
      # are the LTS runtimes consumers deploy on.
      - run: dotnet test -c Release
        working-directory: dotnet

  # The netstandard2.0 asset is what a .NET Framework, Mono or Unity consumer
  # loads. The dotnet job above runs the floor project on CoreCLR against that
  # asset; this one loads it under Mono, the closest a hosted runner gets to
  # Unity's scripting backend.
  dotnet-mono:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" dotnet
      # 10.0.x, the newest line this workflow installs, is the SDK that wrote
      # packages.lock.json. Each SDK band bundles its own implicit
      # Microsoft.NET.ILLink.Tasks version for a given target, and they do
      # not always agree (2026-09-18: 9.0.318 asked 8.0.30 for net8.0 while
      # 10.0.401 asked 8.0.31), so a job restoring under an older SDK trips
      # locked mode with NU1004 on a lock file that is correct.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Load the netstandard2.0 asset under Mono
        working-directory: dotnet
        run: |
          set -euo pipefail
          dotnet build -c Release src/ApplePurchaseReceiptVerifier
          # Mono comes from a digest-pinned image rather than apt. Installing
          # mono-complete pulled 163 packages and 80 MB from the Ubuntu
          # mirror on every run; when that mirror was slow the job spent 24
          # minutes fetching and was cancelled at its timeout, with nothing
          # wrong in the code. Same reasoning as the swift jobs, which have
          # been digest-pinned containers all along.
          #
          # A Mono host that cannot even load the assembly is the failure
          # this job exists to catch; the full suite stays on CoreCLR, and
          # monop reflects rather than executes, so this proves loadability
          # and not behaviour.
          docker run --rm -v "$PWD:/work" -w /work \
            mono:6.12@sha256:34d816779b1248b5cfd095770b64ecbaf1798e2aca693a91c11a018dce9c7ad5 \
            monop -r:src/ApplePurchaseReceiptVerifier/bin/Release/netstandard2.0/ApplePurchaseReceiptVerifier.dll \
              ApplePurchaseReceiptVerifier.Verifier

  # certs/ is the reviewable source of truth for the pinned Apple roots;
  # Internal/AppleRootData.cs is generated from it and compiled in. A certs
  # change that forgets to regenerate would ship stale trust anchors — the
  # same rule node's roots-data.ts already follows.
  dotnet-roots:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - run: dotnet run --project dotnet/tools/GenerateRootData -- "$GITHUB_WORKSPACE"
      - run: git diff --exit-code dotnet/src/ApplePurchaseReceiptVerifier/Internal/AppleRootData.cs

  # Trimming is the closest CI-runnable proxy for Unity IL2CPP's stripping: a
  # reflection-based serializer, an embedded resource or a dynamic code path
  # would surface here as an IL2xxx warning or as a runtime failure. The
  # sample verifies a receipt and asserts a foreign chain is still rejected,
  # so a trimmer that silently removed a check fails the job.
  dotnet-trim:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" dotnet
      # The SDK that wrote packages.lock.json; see dotnet-mono. The sample
      # still targets net9.0, which this SDK builds and publishes.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Publish fully trimmed and verify a receipt with it
        working-directory: dotnet
        run: |
          set -euo pipefail
          # No -r here: the sample's csproj pins RuntimeIdentifier itself.
          # On the command line it becomes a global property and reaches the
          # referenced library project too, whose packages.lock.json has no
          # RID graph, so locked-mode restore fails with NU1004.
          dotnet publish samples/TrimAotSmoke -c Release -o "$RUNNER_TEMP/trim" \
            -warnaserror
          "$RUNNER_TEMP/trim/TrimAotSmoke" "$GITHUB_WORKSPACE/fixtures"

  # fixtures/cases.json is the normative cross-language contract: every
  # suite reads it, so a malformed vector file or an unregistered fixture
  # breaks every language at once. The linter is dependency-free, so this job
  # installs nothing.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node tools/lint-cases.mjs
      # Every port that ships the pinned Apple roots must ship the same
      # bytes. Only three ports used to diff their copy against certs/,
      # and the per-port regenerate-and-diff steps cannot see this: they
      # compare a generated file to its own port's copy, so a port left
      # behind by a root refresh stays internally consistent and green.
      - run: node tools/check-cert-copies.mjs
      # The same for the licence texts of the code compiled into aprv.wasm:
      # licenses/wasm/ is the one source, and every package that ships the
      # module ships a byte-identical copy.
      - run: node tools/check-licence-copies.mjs

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uvx runs zizmor from an ephemeral environment and brings its own
      # interpreter with it, so this job needs no setup-python and no
      # install step. Version deliberately unpinned, as it was under pip:
      # a new zizmor audit that fires on these workflows is a finding we
      # want to see, not one to defer behind a pin.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx zizmor .github/workflows/

  # Lint and formatting for the Node port. Separate from the `node` job
  # because it is version-independent: oxlint and prettier read their own
  # config, so running them once says everything running them four times
  # would. `npm test` deliberately does not call them (prettier --check
  # costs ~1.5s), which is why this job has to exist.
  node-lint:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts && npm run lint && npm run format:check
        working-directory: node
      # bench/bench.mjs otherwise runs only in benchmark.yml, by hand. oxlint
      # above already parses it; this links it against the built dist, so an
      # export it imports that was renamed or removed fails here. Linking
      # resolves every import without evaluating the benchmark itself, so
      # nothing is timed.
      - run: npm run build
        working-directory: node
      - name: link bench/bench.mjs against dist without running it
        working-directory: node
        run: |
          node --no-warnings --experimental-vm-modules --input-type=module -e '
            import vm from "node:vm";
            import { readFileSync } from "node:fs";
            import { pathToFileURL } from "node:url";
            const url = pathToFileURL("bench/bench.mjs");
            const bench = new vm.SourceTextModule(readFileSync(url, "utf8"), { identifier: url.href });
            await bench.link(async (specifier) => {
              const ns = await import(new URL(specifier, url).href);
              const names = Object.keys(ns);
              return new vm.SyntheticModule(names, function () {
                for (const name of names) this.setExport(name, ns[name]);
              });
            });
          '

  # ruff and mypy for the Python port. One job, not a matrix: ruff pins the
  # language level with target-version = "py310" and mypy is told
  # python_version = "3.10" in pyproject, so the interpreter this runs on
  # does not change either verdict. The floor's runtime behaviour is
  # proven by the `python` job's 3.10 leg above, not by this one.
  #
  # Installs the package rather than just the tools: mypy needs wasmtime
  # importable to resolve its types.
  python-tools:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      # From the committed lock, dev extra included, so ruff and mypy are the
      # reviewed versions rather than whatever resolved this morning. The
      # tools run through `uv run`, which puts python/.venv on PATH; that
      # replaced setup-uv's activate-environment, whose separate venv is not
      # the one `uv sync` fills.
      - run: uv sync --locked --extra dev
        working-directory: python
      # --extra dev on every run as well: without it `uv run` re-syncs to
      # the base environment, which has no ruff or mypy, and falls back to
      # tools that cannot see wasmtime.
      - run: uv run --locked --extra dev ruff check .
        working-directory: python
      - run: uv run --locked --extra dev ruff format --check .
        working-directory: python
      - run: uv run --locked --extra dev mypy
        working-directory: python
      # bench/bench.py otherwise runs only in benchmark.yml, by hand. Run as a
      # module that is not __main__, it resolves every import (the package's
      # private helpers included) without calling main(), so nothing is
      # timed. mypy stays off it: pyproject limits mypy to the package and
      # the tests, and under strict it reports three errors in the bench.
      - run: uv run --locked --extra dev python -c "import runpy; runpy.run_path('bench/bench.py')"
        working-directory: python
      # ty, Astral's type checker, is ADVISORY and must stay that way for
      # now: it is 0.0.x preview software, and mypy above remains the gate.
      #
      # Scoped to the package rather than the whole port, because that is
      # where it is honestly clean (0 diagnostics). Over tests/ it reports
      # one false positive: test_endpoint_environment_is_the_typed_enum
      # passes deliberately wrong types to assert the constructor rejects
      # them, and ty honours only `# ty: ignore`, never the
      # `# type: ignore[arg-type]` already on that line. Silencing a preview
      # tool by adding a second suppression dialect to the source is worse
      # than not running it there, so we don't.
      #
      # It resolves wasmtime's types through the environment `uv sync`
      # built; --python names it explicitly, because under continue-on-error
      # a mis-resolved environment would look like findings rather than like
      # the misconfiguration it is.
      - run: uvx ty check --python .venv apple_purchase_receipt_verifier
        working-directory: python
        continue-on-error: true

  # swift-format ships inside the toolchain from Swift 6.0 on, so there is
  # no SwiftPM dependency to resolve. Pinned to the 6.3 image and not the
  # 6.1 floor on purpose: the sources were formatted by swift-format 6.3.3,
  # and swift-format's output is not stable across minor versions -- the
  # `swift` job's own comment records a helper that compiled on 6.3 and
  # failed on 6.1. Formatting is a house style, not a compatibility claim,
  # so one version owns it; the compatibility claim stays with the `swift`
  # matrix. This was verified locally under 6.3.3 and could not be tried
  # against the 6.1 container (no local daemon), which is the other reason
  # not to assert it here.
  swift-format:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.3@sha256:56ef1be2c1ca36f4c52440357dc1fcdfdb5e113587134fcadeef57c225c71b54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift format lint --strict --recursive swift/Sources swift/Tests

  # A drift gate on dotnet/.editorconfig, not a restyle. The Style,
  # Performance and Usage analyzer categories are silenced there because
  # `dotnet format` with them on rewrote 28 files -- switch expressions,
  # collection expressions, a primary constructor, GeneratedRegex source
  # generators -- and in one file two fixers collided and wrote a literal
  # <<<<<<< / ======= / >>>>>>> conflict marker into the source. A
  # formatter that can corrupt a file is not one to run in apply mode over
  # this port; this job only ever verifies.
  dotnet-format:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet format --verify-no-changes --severity info
        working-directory: dotnet

  # Spotless with palantir-java-format. Deliberately not bound to a Maven
  # lifecycle phase (see java/pom.xml), so `mvn test` and the
  # java-runtime-8 job never invoke it; this job runs it explicitly.
  # palantir's own classes are class-file major 55, so running the check
  # needs Maven itself on JDK 11+ -- which is why it is not in the build.
  # palantir over google-java-format because google forces 2-space indent
  # on a 4-space codebase: 8690 changed lines against palantir's 1967.
  java-format:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B spotless:check
        working-directory: java

  # PHP-CS-Fixer, separate from the php/php-lowest/php-static/php-fuzz
  # jobs so a formatting drift fails on its own instead of inside a
  # functional job's log. This is also the first CI run of the fixer at
  # all: the committed .php-cs-fixer.dist.php declared the risky
  # declare_strict_types rule while setting setRiskyAllowed(false), a
  # combination the resolver rejects outright, so the config could never
  # have run wherever it was invoked from.
  php-format:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: openssl, json
          coverage: none
      - run: composer install --no-scripts --no-progress --no-interaction
        working-directory: php
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes
        working-directory: php

  # The consumer smoke programs under .github/smoke/, run against this
  # checkout. post-publish-smoke.yml runs the same programs after a release
  # against what each registry serves, and until these jobs existed that was
  # the only place they ran: a smoke program broken by an API change showed
  # up after the release it was meant to check. Each job below builds the
  # artifact the way release.yml does (pack, build, install), installs it
  # outside the checkout on the same runtime floor as its post-publish leg,
  # and runs the program unchanged. What only a registry can get wrong (a
  # version that never indexes, a slow sync) stays post-publish's job.
  smoke-npm:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false
      # npm pack runs prepack (jco transpile, then tsc), so the tarball
      # carries a fresh dist/ built around this tree's component.
      - run: |
          npm ci --ignore-scripts
          mkdir -p "$RUNNER_TEMP/npm-pack"
          npm pack --pack-destination "$RUNNER_TEMP/npm-pack"
        working-directory: node
      # The tarball is a file this job just built, not a registry fetch.
      - name: install the packed tarball outside the checkout # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/npm-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/npm-smoke.mjs "$SMOKE/"
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/npm-pack/*.tgz
          node npm-smoke.mjs

  smoke-pypi:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" python
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      # pip builds a wheel from python/ (aprv.wasm included, as package data)
      # with the setuptools backend tools/build_dist.py drives for the
      # release, and installs that wheel, not the source tree.
      - name: install the package from the checkout into a venv outside it
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/pypi-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/pypi-smoke.py "$SMOKE/"
          python3 -m venv "$SMOKE/venv"
          "$SMOKE/venv/bin/pip" install "$GITHUB_WORKSPACE/python"
          cd "$SMOKE"
          venv/bin/python pypi-smoke.py

  smoke-maven:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # install puts the jar in ~/.m2, which Maven reads before any remote,
      # so the smoke pom resolves this build and never Central's.
      - run: mvn -B install -DskipTests
        working-directory: java
      - name: resolve the installed jar outside the checkout
        run: |
          set -euo pipefail
          VERSION="$(mvn -q -f java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          SMOKE="$RUNNER_TEMP/maven-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/maven-smoke/pom.xml .github/smoke/maven-smoke/Smoke.java "$SMOKE/"
          cd "$SMOKE"
          mvn -B -q -Dsmoke.version="$VERSION" -Dmdep.outputFile=cp.txt dependency:build-classpath
          javac -cp "$(cat cp.txt)" Smoke.java -d .
          java -cp ".:$(cat cp.txt)" Smoke

  smoke-swiftpm:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The post-publish leg's image: the manifest's 6.3 floor.
    container: swift:6.3@sha256:56ef1be2c1ca36f4c52440357dc1fcdfdb5e113587134fcadeef57c225c71b54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" swift
        shell: bash
      # SMOKE_PATH makes the smoke manifest depend on the checkout by path
      # instead of on the published tag by URL. The tag is the artifact for
      # SwiftPM, so this proves the program and the manifest at the root,
      # not a tag; post-publish-smoke still resolves the tag itself.
      - name: build and run against the checkout, outside it
        # The swift image's /bin/sh is dash, which has no `pipefail`.
        shell: bash
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/swiftpm-smoke"
          mkdir -p "$SMOKE"
          cp -R .github/smoke/swiftpm-smoke/. "$SMOKE/"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          export SMOKE_PATH="$GITHUB_WORKSPACE"
          cd "$SMOKE"
          # Release: WasmKit interprets, and a debug build of it is too slow
          # for one honest receipt (swift/CI-NOTES.md).
          swift run -c release Smoke

  smoke-go:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: false
      # A replace directive points the module path at go/; the path is read
      # from go/go.mod, since a fork's GITHUB_REPOSITORY would not match it.
      - name: build against the checkout's module, outside it
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=mod
        run: |
          set -euo pipefail
          MODULE="$(go -C "$GITHUB_WORKSPACE/go" list -m)"
          SMOKE="$RUNNER_TEMP/go-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/go-smoke/main.go "$SMOKE/"
          cd "$SMOKE"
          go mod init smoke
          go mod edit -require="$MODULE@v0.0.0" -replace="$MODULE=$GITHUB_WORKSPACE/go"
          # The library requires wazero; tidy fetches it and writes go.sum.
          go mod tidy
          go run .

  smoke-rubygems:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" ruby
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - run: gem build apple-purchase-receipt-verifier.gemspec --output "$RUNNER_TEMP/aprv.gem"
        working-directory: ruby
      # A scratch GEM_HOME: the gem just built is the only copy of the
      # library on the load path. Not --local, because its one dependency,
      # the wasmtime platform gem, comes from rubygems.org as a consumer's
      # would.
      - name: install the built gem outside the checkout # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/rubygems-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/rubygems-smoke.rb "$SMOKE/"
          cd "$SMOKE"
          export GEM_HOME="$SMOKE/gems"
          gem install --no-document "$RUNNER_TEMP/aprv.gem"
          ruby rubygems-smoke.rb

  # smoke-crates (the packed crate as a path dependency outside the
  # checkout) is held with crates.io itself (OD-03 in
  # docs/rust-core/STATUS.md): the core stays at 0.7 on crates.io until
  # openssl-sys accepts openssl-src 400.x, because a registry build of this
  # tree would get OpenSSL 3, which aprv-openssl refuses, and aprv-openssl
  # is not on crates.io yet. It comes back with publish-crates in
  # release.yml; .github/smoke/crates-smoke is kept for it.

  smoke-nuget:
    needs: [changes, rust-wasm]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm
          path: ${{ runner.temp }}/aprv
      - run: .github/scripts/place-module.sh "$RUNNER_TEMP/aprv" dotnet
      # 10.0 packs (it is the SDK that wrote packages.lock.json, see
      # dotnet-mono); 8.0 is the runtime the net8.0 smoke runs on.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet pack src/ApplePurchaseReceiptVerifier -c Release -o "$RUNNER_TEMP/nupkg"
        working-directory: dotnet
      # The pack folder is added as a source beside nuget.org (the package's
      # own dependencies come from there), and NUGET_PACKAGES is a scratch
      # folder so a same-version package cached by an earlier restore on
      # the runner cannot stand in for the one just packed.
      - name: restore the packed package outside the checkout
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/nuget-smoke"
          mkdir -p "$SMOKE"
          cp -R .github/smoke/nuget-smoke/. "$SMOKE/"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cd "$SMOKE"
          nupkg="$(echo "$RUNNER_TEMP"/nupkg/ApplePurchaseReceiptVerifier.*.nupkg)"
          VERSION="${nupkg##*/ApplePurchaseReceiptVerifier.}"
          VERSION="${VERSION%.nupkg}"
          export NUGET_PACKAGES="$SMOKE/packages"
          dotnet restore "-p:SmokeVersion=$VERSION" \
            --source "$RUNNER_TEMP/nupkg" --source https://api.nuget.org/v3/index.json
          dotnet run --no-restore "-p:SmokeVersion=$VERSION"
