# Opens/updates the release PR from Conventional Commits on main; merging
# that PR creates the vX.Y.Z tag and GitHub Release, then the dispatch step
# below hands the tag to release.yml (publish). The tag push alone cannot
# trigger it: events created with the default GITHUB_TOKEN never fire other
# workflows (GitHub's recursion guard) — workflow_dispatch via the API is
# the documented exception, so we dispatch explicitly.
# One version for every language: extra-files bump node/package.json,
# python/pyproject.toml, java/pom.xml, ruby's version.rb, rust/Cargo.toml and
# dotnet/Directory.Build.props in the same PR; SwiftPM, Go and PHP read the
# tag itself. The lockfiles that also carry the version are regenerated by
# their own tools in the step after the action (see the comment there).
#
# Permission model (deliberate): the repo default token stays READ-ONLY;
# only this job elevates to contents+pull-requests write. The repo setting
# "Allow GitHub Actions to create and approve pull requests" must be ON
# for the bot to open its PR.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time, and never cancelled: two pushes to main a second apart
# start two runs that both rebuild the release branch and both push the
# lockfile sync commit; the second push loses ("the remote contains work
# that you do not have locally") and its run goes red for nothing. Queued
# instead, each run sees the branch the previous one left.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Four lockfiles record the project's own version (rust/Cargo.lock,
      # rust/fuzz/Cargo.lock, rust/ffi/Cargo.lock, python/uv.lock). release-please's toml updater
      # cannot address an entry of a [[package]] array by name (it logs
      # "No entries modified"), and a release PR with bumped manifests and
      # stale locks fails every --locked leg. So the tools that own those
      # files bring them in step on the release branch: `cargo update
      # --workspace` touches workspace members only, the fuzz and ffi crates
      # update the one path dependency, `uv lock` keeps every pinned
      # dependency. The ffi lock was missing here once and v0.5.0's commit
      # failed every --locked ffi leg, so the gate refused to publish it.
      # release-please rebuilds its branch from main on the next push, which
      # drops this commit; the step then runs again and re-adds it.
      # When the action leaves an existing release PR untouched ("remained
      # the same") it reports prs_created without a pr payload, and the
      # branch still carries the sync commit from the run that built it, so
      # there is nothing to do. Read the payload in shell and skip on empty
      # rather than let fromJSON fail on it.
      - name: name the release branch
        id: release-branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          if [ -z "$PR_JSON" ]; then
            echo "release PR unchanged; lockfiles already in step"
            exit 0
          fi
          printf 'name=%s\n' "$(printf '%s' "$PR_JSON" | jq -r .headBranchName)" >> "$GITHUB_OUTPUT"
      - name: check out the release branch
        if: ${{ steps.release-branch.outputs.name != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-branch.outputs.name }}
          # This checkout pushes back to the release branch, so it keeps
          # the token; the job holds contents: write for that push.
          persist-credentials: true # zizmor: ignore[artipacked]
      # `enable-cache: false`, not the action's `auto` default. This job holds
      # contents: write, checks out the release branch with the token kept,
      # and pushes back to it — so a cache entry restored here reaches a
      # privileged, pushing context, which is what zizmor and CodeQL both call
      # cache poisoning. `uv lock` resolves from the index either way; the
      # only thing the cache saves is a download.
      - if: ${{ steps.release-branch.outputs.name != '' }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: bring the lockfiles in step with the release version
        if: ${{ steps.release-branch.outputs.name != '' }}
        env:
          BRANCH: ${{ steps.release-branch.outputs.name }}
        run: |
          cargo update --workspace --manifest-path rust/Cargo.toml
          cargo update --manifest-path rust/fuzz/Cargo.toml -p apple-purchase-receipt-verifier
          cargo update --manifest-path rust/ffi/Cargo.toml -p apple-purchase-receipt-verifier
          uv lock --directory python
          if git diff --quiet -- rust/Cargo.lock rust/fuzz/Cargo.lock rust/ffi/Cargo.lock python/uv.lock; then
            echo "lockfiles already in step"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): bring the lockfiles in step with the release version" \
            -- rust/Cargo.lock rust/fuzz/Cargo.lock rust/ffi/Cargo.lock python/uv.lock
          git push origin "HEAD:$BRANCH"
      - name: dispatch publish workflow at the new tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
