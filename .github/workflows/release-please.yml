# Opens/updates the release PR from Conventional Commits on main; merging
# that PR creates the vX.Y.Z tag and GitHub Release, then the dispatch step
# below hands the tag to release.yml (publish). The tag push alone cannot
# trigger it: events created with the default GITHUB_TOKEN never fire other
# workflows (GitHub's recursion guard) — workflow_dispatch via the API is
# the documented exception, so we dispatch explicitly.
# One version for every language: extra-files bump node/package.json,
# python/pyproject.toml, java/pom.xml, ruby's version.rb, rust/Cargo.toml and
# dotnet/Directory.Build.props in the same PR; SwiftPM, Go and PHP read the
# tag itself. The lockfiles that also carry the version are regenerated by
# their own tools in the step after the action (see the comment there).
#
# From 0.8.0 the Go module and the Swift package carry a committed copy of
# aprv.wasm (docs/rust-core/DECISIONS.md R14), and the tag is what those
# consumers get, so the copies on the release branch must be the module that
# branch builds. release-branch-wasm builds it with read-only permissions and
# no cache; refresh-wasm-copies, which runs no build code, copies that file
# over the committed ones, checks their hash and pushes one commit. The
# release's build-wasm job then refuses to publish if they differ.
#
# Permission model (deliberate): the repo default token stays READ-ONLY;
# only the release-please job (contents+pull-requests write) and
# refresh-wasm-copies (contents write) elevate. The repo setting
# "Allow GitHub Actions to create and approve pull requests" must be ON
# for the bot to open its PR.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time, and never cancelled: two pushes to main a second apart
# start two runs that both rebuild the release branch and both push the
# lockfile sync commit; the second push loses ("the remote contains work
# that you do not have locally") and its run goes red for nothing. Queued
# instead, each run sees the branch the previous one left.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      branch: ${{ steps.release-branch.outputs.name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Four lockfiles record the project's own version (rust/Cargo.lock,
      # rust/fuzz/Cargo.lock, rust/ffi/Cargo.lock, python/uv.lock). release-please's toml updater
      # cannot address an entry of a [[package]] array by name (it logs
      # "No entries modified"), and a release PR with bumped manifests and
      # stale locks fails every --locked leg. So the tools that own those
      # files bring them in step on the release branch: `cargo update
      # --workspace` touches workspace members only, the fuzz and ffi crates
      # update the one path dependency, `uv lock` keeps every pinned
      # dependency. The ffi lock was missing here once and v0.5.0's commit
      # failed every --locked ffi leg, so the gate refused to publish it.
      # release-please rebuilds its branch from main on the next push, which
      # drops this commit; the step then runs again and re-adds it.
      # When the action leaves an existing release PR untouched ("remained
      # the same") it reports prs_created without a pr payload, and the
      # branch still carries the sync commit from the run that built it, so
      # there is nothing to do. Read the payload in shell and skip on empty
      # rather than let fromJSON fail on it.
      - name: name the release branch
        id: release-branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          if [ -z "$PR_JSON" ]; then
            echo "release PR unchanged; lockfiles already in step"
            exit 0
          fi
          printf 'name=%s\n' "$(printf '%s' "$PR_JSON" | jq -r .headBranchName)" >> "$GITHUB_OUTPUT"
      - name: check out the release branch
        if: ${{ steps.release-branch.outputs.name != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-branch.outputs.name }}
          # This checkout pushes back to the release branch, so it keeps
          # the token; the job holds contents: write for that push.
          persist-credentials: true # zizmor: ignore[artipacked]
      # `enable-cache: false`, not the action's `auto` default. This job holds
      # contents: write, checks out the release branch with the token kept,
      # and pushes back to it — so a cache entry restored here reaches a
      # privileged, pushing context, which is what zizmor and CodeQL both call
      # cache poisoning. `uv lock` resolves from the index either way; the
      # only thing the cache saves is a download.
      - if: ${{ steps.release-branch.outputs.name != '' }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: bring the lockfiles in step with the release version
        if: ${{ steps.release-branch.outputs.name != '' }}
        env:
          BRANCH: ${{ steps.release-branch.outputs.name }}
        run: |
          cargo update --workspace --manifest-path rust/Cargo.toml
          cargo update --manifest-path rust/fuzz/Cargo.toml -p apple-purchase-receipt-verifier
          cargo update --manifest-path rust/ffi/Cargo.toml -p apple-purchase-receipt-verifier
          uv lock --directory python
          if git diff --quiet -- rust/Cargo.lock rust/fuzz/Cargo.lock rust/ffi/Cargo.lock python/uv.lock; then
            echo "lockfiles already in step"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): bring the lockfiles in step with the release version" \
            -- rust/Cargo.lock rust/fuzz/Cargo.lock rust/ffi/Cargo.lock python/uv.lock
          git push origin "HEAD:$BRANCH"
      - name: dispatch publish workflow at the new tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  # aprv.wasm as the release branch builds it, once the branch carries a
  # committed copy: the pinned toolchain installed fresh (the file this
  # produces is committed and becomes the tag, so no cache), then the module
  # handed to the next job as an artifact. Read-only: this job runs the
  # build's code and holds no token that can push.
  release-branch-wasm:
    needs: release-please
    if: needs.release-please.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
      commit: ${{ steps.gate.outputs.commit }}
      wasm-sha256: ${{ steps.build.outputs.wasm-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.branch }}
          persist-credentials: false
      - name: does the branch carry a copy to refresh?
        id: gate
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f rust/bindings/abi/build.sh ] && [ -n "$(git ls-files -- '*aprv.wasm')" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no committed aprv.wasm or no build.sh on this branch; nothing to refresh"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: install the pinned wasm toolchain (no cache)
        if: steps.gate.outputs.needed == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wasm-toolchain"
          tools/wasm-toolchain.sh "$dir" > /dev/null
          { echo "WASI_SDK_DIR=$dir/wasi-sdk"; echo "OPENSSL_WASM_DIR=$dir/openssl-wasm"; } >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"
      - name: install the pinned Rust toolchain
        if: steps.gate.outputs.needed == 'true'
        working-directory: rust
        run: rustup toolchain install
      - name: build aprv.wasm
        id: build
        if: steps.gate.outputs.needed == 'true'
        run: |
          set -euo pipefail
          rust/bindings/abi/build.sh "$RUNNER_TEMP/aprv"
          tools/check-wasm.sh "$RUNNER_TEMP/aprv" rust/bindings/abi/wit/aprv.wit
          echo "wasm-sha256=$(sha256sum "$RUNNER_TEMP/aprv/aprv.wasm" | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.gate.outputs.needed == 'true'
        with:
          name: aprv-wasm-release-branch
          path: ${{ runner.temp }}/aprv/aprv.wasm
          if-no-files-found: error
          retention-days: 7

  # Copies the module release-branch-wasm built over every committed
  # aprv.wasm (go/internal/wasm/aprv.wasm and the Swift package's resource),
  # checks each copy's SHA-256 against the build, and pushes one commit to
  # the release branch if anything changed. It runs no code from the
  # repository, which is what lets it hold the pushing token.
  refresh-wasm-copies:
    needs: [release-please, release-branch-wasm]
    if: needs.release-branch-wasm.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.branch }}
          # This checkout pushes back to the release branch, so it keeps
          # the token; the job holds contents: write for that push.
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm-release-branch
          path: ${{ runner.temp }}/aprv
      - name: refresh the committed copies and check their hash
        env:
          BRANCH: ${{ needs.release-please.outputs.branch }}
          BUILT_FROM: ${{ needs.release-branch-wasm.outputs.commit }}
          WASM_SHA256: ${{ needs.release-branch-wasm.outputs.wasm-sha256 }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$BUILT_FROM" ]; then
            echo "::error::$BRANCH moved from $BUILT_FROM to $(git rev-parse HEAD) after the module was built; the next run rebuilds it"
            exit 1
          fi
          echo "$WASM_SHA256  $RUNNER_TEMP/aprv/aprv.wasm" | sha256sum -c -
          mapfile -t copies < <(git ls-files -- '*aprv.wasm')
          for f in "${copies[@]}"; do
            cp "$RUNNER_TEMP/aprv/aprv.wasm" "$f"
            echo "$WASM_SHA256  $f" | sha256sum -c -
          done
          if git diff --quiet -- "${copies[@]}"; then
            echo "the committed copies are already this build ($WASM_SHA256)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): refresh the committed aprv.wasm copies" \
            -m "The Go module and the Swift package ship the module this branch builds, SHA-256 $WASM_SHA256." \
            -- "${copies[@]}"
          git push origin "HEAD:$BRANCH"
