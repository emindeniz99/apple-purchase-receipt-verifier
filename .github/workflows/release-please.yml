# Opens/updates the release PR from Conventional Commits on main; merging
# that PR creates the vX.Y.Z tag and GitHub Release, then the dispatch step
# below hands the tag to release.yml (publish). The tag push alone cannot
# trigger it: events created with the default GITHUB_TOKEN never fire other
# workflows (GitHub's recursion guard) — workflow_dispatch via the API is
# the documented exception, so we dispatch explicitly.
# One version for every language: extra-files bump node/package.json,
# python/pyproject.toml, java/pom.xml, ruby's version.rb, rust/Cargo.toml and
# dotnet/Directory.Build.props in the same PR; SwiftPM, Go and PHP read the
# tag itself. The lockfiles that also carry the version are regenerated by
# their own tools in the step after the action (see the comment there).
#
# From 0.8.0 the Go module and the Swift package carry a committed copy of
# aprv.wasm (docs/rust-core/DECISIONS.md R14), every host tracks a pin of it
# (aprv.wasm.sha256; Node's pins the component), and php/binaries.json pins
# the aprv binaries the PHP installer downloads. The tag is what those
# consumers get, so all of it must name what the release branch builds.
# release-branch-wasm and release-branch-server build the module and the two
# Linux static binaries with read-only permissions and no cache;
# refresh-wasm-copies, which runs no build code, writes the copies and pins
# (tools/refresh-wasm-pins.sh, which only copies files and writes hashes)
# and binaries.json (jq and sha256sum), and pushes one commit. The
# release's build-wasm and php-binaries jobs then refuse to publish if
# anything differs from what the tag builds.
#
# Permission model (deliberate): the repo default token stays READ-ONLY;
# only the release-please job (contents+pull-requests write) and
# refresh-wasm-copies (contents write) elevate. The repo setting
# "Allow GitHub Actions to create and approve pull requests" must be ON
# for the bot to open its PR.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time, and never cancelled: two pushes to main a second apart
# start two runs that both rebuild the release branch and both push the
# lockfile sync commit; the second push loses ("the remote contains work
# that you do not have locally") and its run goes red for nothing. Queued
# instead, each run sees the branch the previous one left.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      branch: ${{ steps.release-branch.outputs.name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Three lockfiles record the project's own version (rust/Cargo.lock,
      # which covers the C ABI since rust/ffi joined the workspace,
      # rust/fuzz/Cargo.lock, python/uv.lock). release-please's toml updater
      # cannot address an entry of a [[package]] array by name (it logs
      # "No entries modified"), and a release PR with bumped manifests and
      # stale locks fails every --locked leg. So the tools that own those
      # files bring them in step on the release branch: `cargo update
      # --workspace` touches workspace members only (the core, aprv-openssl,
      # the bindings and the C ABI), the fuzz crate updates its two path
      # dependencies, `uv lock` keeps every pinned dependency. A lock
      # missing here once made v0.5.0's commit fail every --locked ffi leg,
      # so the gate refused to publish it. rust/server and
      # rust/bindings/abi/tests keep locks of their own but do not carry the
      # release version (0.0.0, publish = false).
      # release-please rebuilds its branch from main on the next push, which
      # drops this commit; the step then runs again and re-adds it.
      # When the action leaves an existing release PR untouched ("remained
      # the same") it reports prs_created without a pr payload, and the
      # branch still carries the sync commit from the run that built it, so
      # there is nothing to do. Read the payload in shell and skip on empty
      # rather than let fromJSON fail on it.
      - name: name the release branch
        id: release-branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          if [ -z "$PR_JSON" ]; then
            echo "release PR unchanged; lockfiles already in step"
            exit 0
          fi
          name="$(printf '%s' "$PR_JSON" | jq -r .headBranchName)"
          # The one branch release-please opens for this repository (a
          # single package at the root, no component in the tag). The jobs
          # below check it out by that literal name rather than by this
          # output, so a branch named anything else stops the run here.
          if [ "$name" != release-please--branches--main ]; then
            echo "::error::release-please opened '$name', not release-please--branches--main; the jobs below check out that literal branch"
            exit 1
          fi
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
      - name: check out the release branch
        if: ${{ steps.release-branch.outputs.name != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Literal: the step above checked release-please named this one.
          ref: release-please--branches--main
          # This checkout pushes back to the release branch, so it keeps
          # the token; the job holds contents: write for that push.
          persist-credentials: true # zizmor: ignore[artipacked]
      # `enable-cache: false`, not the action's `auto` default. This job holds
      # contents: write, checks out the release branch with the token kept,
      # and pushes back to it — so a cache entry restored here reaches a
      # privileged, pushing context, which is what zizmor and CodeQL both call
      # cache poisoning. `uv lock` resolves from the index either way; the
      # only thing the cache saves is a download.
      - if: ${{ steps.release-branch.outputs.name != '' }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: bring the lockfiles in step with the release version
        if: ${{ steps.release-branch.outputs.name != '' }}
        env:
          BRANCH: ${{ steps.release-branch.outputs.name }}
        run: |
          cargo update --workspace --manifest-path rust/Cargo.toml
          cargo update --manifest-path rust/fuzz/Cargo.toml -p apple-purchase-receipt-verifier -p aprv-openssl
          uv lock --directory python
          if git diff --quiet -- rust/Cargo.lock rust/fuzz/Cargo.lock python/uv.lock; then
            echo "lockfiles already in step"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): bring the lockfiles in step with the release version" \
            -- rust/Cargo.lock rust/fuzz/Cargo.lock python/uv.lock
          git push origin "HEAD:$BRANCH"
      - name: dispatch publish workflow at the new tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  # aprv.wasm and its component as the release branch builds them: the
  # pinned toolchain installed fresh (what this produces is committed and
  # becomes the tag, so no cache), then both files handed on as an artifact.
  # Read-only: this job runs the build's code and holds no token that can
  # push.
  release-branch-wasm:
    needs: release-please
    if: needs.release-please.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.build.outputs.commit }}
      wasm-sha256: ${{ steps.build.outputs.wasm-sha256 }}
      component-sha256: ${{ steps.build.outputs.component-sha256 }}
    steps:
      # The release branch by its literal name: release-please opens it in
      # this repository from main, and the release-please job refuses any
      # other name, so the ref is repository-controlled, not a PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-please--branches--main
          persist-credentials: false
      - name: install the pinned wasm toolchain (no cache)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wasm-toolchain"
          tools/wasm-toolchain.sh "$dir" > /dev/null
          { echo "WASI_SDK_DIR=$dir/wasi-sdk"; echo "OPENSSL_WASM_DIR=$dir/openssl-wasm"; } >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"
      # build.sh runs from the repository root, where rustup does not read
      # rust/rust-toolchain.toml, so the pinned channel is named here.
      - name: install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target wasm32-wasip1
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: build aprv.wasm and the component
        id: build
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          rust/bindings/abi/build.sh "$RUNNER_TEMP/aprv"
          tools/check-wasm.sh "$RUNNER_TEMP/aprv" rust/bindings/abi/wit/aprv.wit
          echo "wasm-sha256=$(sha256sum "$RUNNER_TEMP/aprv/aprv.wasm" | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "component-sha256=$(sha256sum "$RUNNER_TEMP/aprv/aprv.component.wasm" | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aprv-wasm-release-branch
          path: |
            ${{ runner.temp }}/aprv/aprv.wasm
            ${{ runner.temp }}/aprv/aprv.component.wasm
          if-no-files-found: error
          retention-days: 7

  # The two Linux static aprv binaries the tag will publish, built on the
  # release branch around its component so their hashes can be committed in
  # php/binaries.json before the tag exists (OD-06): they reproduce
  # (tools/reproduce-server.sh), so release.yml's build at the tag makes the
  # same files, and its php-binaries job checks that it did. macOS and
  # Windows binaries do not reproduce bit for bit, so their entries stay
  # null (those platforms use the server URL option). Read-only, no cache.
  release-branch-server:
    needs: [release-please, release-branch-wasm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      # The release branch by its literal name (see release-branch-wasm),
      # then proof that it is still the commit the module was built from:
      # the binaries embed that component, so a moved branch must stop here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-please--branches--main
          persist-credentials: false
      - name: the commit release-branch-wasm built
        env:
          WANT: ${{ needs.release-branch-wasm.outputs.commit }}
        run: |
          got="$(git rev-parse HEAD)"
          if [ "$got" != "$WANT" ]; then
            echo "::error::release-please--branches--main is at $got, not $WANT, which release-branch-wasm built"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm-release-branch
          path: ${{ runner.temp }}/aprv
      - name: install the pinned Rust toolchain and the target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      # musl-gcc compiles Wasmtime's C helpers for the musl target
      # (build-static.sh).
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        env:
          TARGET: ${{ matrix.target }}
          COMPONENT_SHA256: ${{ needs.release-branch-wasm.outputs.component-sha256 }}
        run: rust/server/scripts/build-static.sh "$RUNNER_TEMP/aprv/aprv.component.wasm" "$TARGET" "$RUNNER_TEMP/server"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aprv-server-release-branch-${{ matrix.target }}
          path: ${{ runner.temp }}/server/aprv-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  # Writes what the two jobs above built into the release branch: the
  # committed module copies and every tracked pin (tools/refresh-wasm-pins.sh
  # copies files and writes hashes, nothing else), and php/binaries.json's
  # tag and two Linux hashes (jq and sha256sum). One commit, pushed to the
  # release branch. No build code runs here, which is what lets it hold the
  # pushing token.
  refresh-wasm-copies:
    needs: [release-please, release-branch-wasm, release-branch-server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The release branch by its literal name (see release-branch-wasm).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-please--branches--main
          # This checkout pushes back to the release branch, so it keeps
          # the token; the job holds contents: write for that push.
          persist-credentials: true # zizmor: ignore[artipacked]
      # The pins written below describe release-branch-wasm's build, so they
      # go on top of that commit or nowhere.
      - name: the commit release-branch-wasm built
        env:
          WANT: ${{ needs.release-branch-wasm.outputs.commit }}
        run: |
          got="$(git rev-parse HEAD)"
          if [ "$got" != "$WANT" ]; then
            echo "::error::release-please--branches--main is at $got, not $WANT, which release-branch-wasm built"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm-release-branch
          path: ${{ runner.temp }}/aprv
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aprv-server-release-branch-*
          path: ${{ runner.temp }}/server
          merge-multiple: true
      - name: refresh the copies, the pins and binaries.json
        env:
          BRANCH: ${{ needs.release-please.outputs.branch }}
          BUILT_FROM: ${{ needs.release-branch-wasm.outputs.commit }}
          WASM_SHA256: ${{ needs.release-branch-wasm.outputs.wasm-sha256 }}
          COMPONENT_SHA256: ${{ needs.release-branch-wasm.outputs.component-sha256 }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$BUILT_FROM" ]; then
            echo "::error::$BRANCH moved from $BUILT_FROM to $(git rev-parse HEAD) after the module was built; the next run rebuilds it"
            exit 1
          fi
          echo "$WASM_SHA256  $RUNNER_TEMP/aprv/aprv.wasm" | sha256sum -c -
          echo "$COMPONENT_SHA256  $RUNNER_TEMP/aprv/aprv.component.wasm" | sha256sum -c -
          mapfile -t changed < <(tools/refresh-wasm-pins.sh "$RUNNER_TEMP/aprv/aprv.wasm" "$RUNNER_TEMP/aprv/aprv.component.wasm")
          # binaries.json: the tag this branch becomes and the two Linux
          # binaries' hashes; every other entry null.
          version="$(cat version.txt)"
          x86="$(sha256sum "$RUNNER_TEMP/server/aprv-x86_64-unknown-linux-musl" | cut -c1-64)"
          arm="$(sha256sum "$RUNNER_TEMP/server/aprv-aarch64-unknown-linux-musl" | cut -c1-64)"
          jq --indent 4 --arg tag "v$version" --arg x86 "$x86" --arg arm "$arm" '
            .tag = $tag
            | .assets |= with_entries(.value = null)
            | .assets["aprv-x86_64-unknown-linux-musl"] = $x86
            | .assets["aprv-aarch64-unknown-linux-musl"] = $arm
          ' php/binaries.json > "$RUNNER_TEMP/binaries.json"
          if ! cmp -s "$RUNNER_TEMP/binaries.json" php/binaries.json; then
            cp "$RUNNER_TEMP/binaries.json" php/binaries.json
            changed+=(php/binaries.json)
          fi
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "the copies, pins and binaries.json already name this build ($WASM_SHA256)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): pin the module and the aprv binaries this branch builds" \
            -m "aprv.wasm $WASM_SHA256, component $COMPONENT_SHA256; aprv-x86_64-unknown-linux-musl $x86, aprv-aarch64-unknown-linux-musl $arm." \
            -- "${changed[@]}"
          git push origin "HEAD:$BRANCH"
