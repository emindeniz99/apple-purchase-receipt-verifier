# Temporary diagnostic for the refresh-corpus 403: which of the two writes
# the publish job performs does GITHUB_TOKEN lack? Deleted with its branch.
name: diag release token

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: draft release (no tag), then tag ref, then release with new tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          set -uo pipefail
          stamp="diag-$(date -u +%Y%m%d%H%M%S)"
          for pair in p19:d5d132d3 p20:905d07dc p21:4f2b8cbc p22:a5267420 p23:4483e8e5 p24:a5676485b62cc6623e434e115fc638f092cf153d; do
            tag="${pair%%:*}"; c="${pair#*:}"
            sha="$(gh api "repos/$GH_REPO/commits/$c" --jq .sha)"
            echo "::group::$tag tag ref at $c ($(gh api "repos/$GH_REPO/commits/$c" --jq .commit.committer.date))"
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$stamp-$tag" -f sha="$sha" --jq '.ref'; echo "exit $?"
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$stamp-$tag" >/dev/null 2>&1 && echo "deleted tag $stamp-$tag"
            echo "::endgroup::"
          done
