# Temporary diagnostic for the refresh-corpus 403: which of the two writes
# the publish job performs does GITHUB_TOKEN lack? Deleted with its branch.
name: diag release token

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: draft release (no tag), then tag ref, then release with new tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          set -uo pipefail
          stamp="diag-$(date -u +%Y%m%d%H%M%S)"
          echo "::group::1 draft release, no tag"
          gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$stamp-draft" -F draft=true -f name="$stamp draft" --jq '.id' > draft-id.txt; echo "exit $?"
          echo "::endgroup::"
          echo "::group::2 tag ref via git API"
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$stamp-ref" -f sha="$SHA" --jq '.ref'; echo "exit $?"
          echo "::endgroup::"
          echo "::group::3 release that creates its tag (the corpus shape)"
          gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$stamp-rel" -f target_commitish="$SHA" -F prerelease=true -f make_latest=false -f name="$stamp rel" --jq '.id' > rel-id.txt; echo "exit $?"
          echo "::endgroup::"
          echo "::group::4 gh release create, same shape"
          echo diag > diag.txt
          gh release create "$stamp-gh" diag.txt --target "$SHA" --prerelease --latest=false --title "$stamp gh" --notes diag; echo "exit $?"
          echo "::endgroup::"
          echo "::group::5 gh release create targeting the v0.11.1 commit (the corpus run's target)"
          gh release create "$stamp-old" diag.txt --target a5676485b62cc6623e434e115fc638f092cf153d --prerelease --latest=false --title "$stamp old" --notes diag; echo "exit $?"
          echo "::endgroup::"
          echo "::group::6 gh release create named corpus-diag-* at head"
          gh release create "corpus-diag-$stamp" diag.txt --target "$SHA" --prerelease --latest=false --title "$stamp corpus" --notes diag; echo "exit $?"
          echo "::endgroup::"
          echo "::group::7 gh release create with --notes-file"
          echo notes > README.md
          gh release create "$stamp-nf" diag.txt --target "$SHA" --prerelease --latest=false --title "$stamp nf" --notes-file README.md; echo "exit $?"
          echo "::endgroup::"
          echo "::group::8 target = the commit before v0.11.1 (no release on it)"
          gh release create "$stamp-p8" diag.txt --target 6f415af95b65806d0d1eb695b0f52f14360fd100 --prerelease --latest=false --title "$stamp p8" --notes diag; echo "exit $?"
          echo "::endgroup::"
          echo "::group::9 target = corpus-2026-10-08's commit (has a prerelease)"
          gh release create "$stamp-p9" diag.txt --target 90b498753f05ce4a3ce3c8c00c2b2d3f26a04708 --prerelease --latest=false --title "$stamp p9" --notes diag; echo "exit $?"
          echo "::endgroup::"
          echo "::group::10 target = main's parent commit"
          gh release create "$stamp-p10" diag.txt --target 4171c5aaa7f695aa271e17f25a11a08fbc0bd2e5 --prerelease --latest=false --title "$stamp p10" --notes diag; echo "exit $?"
          echo "::endgroup::"
          echo "::group::11 target = branch name main"
          gh release create "$stamp-p11" diag.txt --target main --prerelease --latest=false --title "$stamp p11" --notes diag; echo "exit $?"
          echo "::endgroup::"
          echo "::group::12 tag ref via git API at the v0.11.1 commit"
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$stamp-p12" -f sha=a5676485b62cc6623e434e115fc638f092cf153d --jq '.ref'; echo "exit $?"
          echo "::endgroup::"
          echo "::group::cleanup"
          for t in "$stamp-old" "corpus-diag-$stamp" "$stamp-nf" "$stamp-p8" "$stamp-p9" "$stamp-p10" "$stamp-p11"; do gh release delete "$t" --yes --cleanup-tag 2>&1 || true; done
          # Leftovers of the first run, which stopped before its cleanup.
          gh api -X DELETE "repos/$GH_REPO/releases/410955459" 2>&1 || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/diag-20261012200007-ref" 2>&1 || true
          for f in draft-id.txt rel-id.txt; do id=$(cat "$f" 2>/dev/null || true); [ -n "$id" ] && gh api -X DELETE "repos/$GH_REPO/releases/$id" && echo "deleted release $id"; done
          gh release delete "$stamp-gh" --yes --cleanup-tag 2>&1 || true
          for t in "$stamp-ref" "$stamp-rel" "$stamp-p12"; do gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" 2>&1 && echo "deleted tag $t" || true; done
          echo "::endgroup::"
