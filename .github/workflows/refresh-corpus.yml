# R35: rows belong to a module. The release PR refreshes the parity corpus
# and its pin itself (release-please.yml, release-branch-corpus), so a
# release never leaves fixtures/corpus.json naming another module. This is
# the hand-run fallback for a release whose PR could not (a flipped verdict
# stopped it, or the run failed): it builds the archive from the release's
# published assets with the same tools/build-corpus.sh, publishes it, and
# prints the new pin for a reviewed PR that changes fixtures/corpus.json.
name: refresh parity corpus

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published module release (vX.Y.Z) whose aprv.wasm main pins
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-corpus
  cancel-in-progress: false

jobs:
  # Runs only from main: the workflow file of the dispatched ref is the code
  # that builds and publishes the corpus, so a branch copy must not run it.
  # On any other ref both jobs are skipped. The archive is for main's
  # wrappers, so the release's module must be the one main pins.
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      state: ${{ steps.build.outputs.state }}
    steps:
      - name: validate inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: fetch the release's module and check it against main's pins
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/module"
          mkdir -p "$dir"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          for file in aprv.wasm aprv.component.wasm aprv.wit; do
            curl -fsSL --retry 3 "$base/$file" -o "$dir/$file"
          done
          cat go/internal/wasm/aprv.wasm.sha256 node/wasm/aprv.component.wasm.sha256 > "$dir/SHA256SUMS"
          (cd "$dir" && sha256sum -c SHA256SUMS)
      - name: build the archive
        id: build
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/module"
          out="$RUNNER_TEMP/corpus-release"
          tools/build-corpus.sh "$dir/aprv.wasm" "$dir/aprv.component.wasm" "$dir/aprv.wit" "${RELEASE_TAG#v}" "$out"
          if [ ! -f "$out/state" ]; then
            echo "::notice::fixtures/corpus.json already pins an archive of this module; nothing to do"
            echo "state=fresh" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "state=$(cat "$out/state")" >> "$GITHUB_OUTPUT"
      - if: steps.build.outputs.state != 'fresh'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-release
          path: ${{ runner.temp }}/corpus-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && needs.generate.outputs.state != 'fresh'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout or execution of the corpus with a write token.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-release
          path: ${{ runner.temp }}/corpus-release/
      - name: publish the corpus prerelease and print the pin
        working-directory: ${{ runner.temp }}/corpus-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATE: ${{ needs.generate.outputs.state }}
        run: |
          set -euo pipefail
          # "reused": a release of this name already holds this module.
          if [ "$STATE" = built ]; then
            archive="$(basename "$(jq -er .url corpus.json)")"
            name="${archive%.tar.gz}"
            [[ "$name" =~ ^corpus-[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{8}$ ]]
            sha256sum -c "$archive.sha256"
            # No --clobber: an existing corpus tag or asset is immutable.
            # The tag sits on the dispatched head of main, not on the
            # commit the rows were built from (the archive's README names
            # that one): GITHUB_TOKEN has no workflows permission, so it
            # may not create a ref at a commit whose .github/workflows
            # differ from the default branch's head, and GitHub answers
            # 403 "Resource not accessible by integration" (measured
            # 2026-10-12).
            gh release create "$name" "$archive" "$archive.sha256" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "parity corpus $name" --notes-file README.md
          fi
          { echo '```json'; cat corpus.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
