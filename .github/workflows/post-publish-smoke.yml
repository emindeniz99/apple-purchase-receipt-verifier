# Verifies what consumers actually receive, after a release has been published.
#
# The CI suite tests the working tree; this tests the artifact. That gap shipped
# two broken npm releases (0.1.1 and 0.2.0 contained no JavaScript at all, so
# every `npm i` + import died on ERR_MODULE_NOT_FOUND) while every check was
# green, because nothing ever installed the published package. Each job here
# installs by name/coordinates from the real registry, into a directory outside
# the checkout, and verifies a genuine Apple-signed receipt with it.
#
# ci.yml's smoke-* jobs run the same programs on every push against artifacts
# built from the checkout, so a program broken by an API change fails there,
# before a release, and this workflow is left to catch what only a registry
# can get wrong.
#
# Registries do not publish atomically, so each job polls for the version to
# appear. Maven Central's sync is the slow one and gets the longest budget.
#
# Not every registry is live on every release: RubyGems, crates.io and NuGet
# need an owner bootstrap (BOOTSTRAP.md) before anything can be published to
# them, and `release.yml` skips those publish jobs until it happens. It passes
# the registries it actually published in the `registries` input, and the legs
# below are gated on it, so an unbootstrapped registry means a skipped leg
# rather than a job that fails on an install that cannot work.
#
# Packagist has no publish job — the tag is the release, and Packagist imports
# it on its own — but the PHP package is still a thing this repository ships:
# its installer downloads the release's aprv binary and checks it against the
# hashes the tag's php/binaries.json pins. The packagist leg waits for the
# import and runs that path end to end (php/RELEASE.md, acceptance test 8).
name: post-publish-smoke

# zizmor flags workflow_run as fundamentally dangerous, and normally it is: it
# runs in the base repository with a write-capable token and access to secrets,
# which is how fork pull requests get privilege-escalated through it. None of
# that applies here. This workflow requests contents: read only, uses no
# secrets, downloads no artifacts from the triggering run, and checks out a tag
# that the resolve job validates as a release version. workflow_run also only
# fires for runs in this repository, and `release` itself only runs on a v* tag
# push or a manual dispatch — both of which already require write access.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to smoke-test, without the v (e.g. 0.2.1)'
        required: true
        type: string
      registries:
        description: 'Comma-separated registries to test; the default is all of them'
        required: false
        default: npm,pypi,maven,swiftpm,go,php,rubygems,crates,nuget
        type: string

permissions:
  contents: read

# Every job below restores nothing from cache, and every setup action says so
# explicitly rather than relying on its default.
#
# This is the one workflow in the repository where that matters. It is
# triggered by `workflow_run`, so it runs in the base repository with a token
# GitHub scopes to this repo, and every job then installs a package that was
# published minutes earlier and executes it. CodeQL reports that pairing as
# "Cache Poisoning via execution of untrusted code": a job that runs
# freshly-published third-party code and also has a warm cache can write that
# cache, and anything it writes is restored later by a job that is trusted.
# The direction that actually bites is the reverse one — a cache entry poisoned
# by some earlier run being restored HERE, into the job whose whole purpose is
# to answer "is the artifact consumers receive good?". A smoke test that quietly
# reuses a cached toolchain or dependency is not testing the artifact any more.
#
# The repository's graduation notes already carry the same rule for the publish
# side: a release job must not set `cache:`, because a poisoned cache becomes
# the published artifact. This is that rule applied one step later in the chain.
#
# Turning it off explicitly rather than leaving the default is the point.
# setup-node, setup-python and setup-java default to no cache today, but a
# default is a thing that can change under a version bump, and a reader cannot
# tell "off" from "nobody thought about it". These settings are an assertion.
jobs:
  resolve:
    name: resolve the published version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A failed release has nothing to smoke-test.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.pick.outputs.version }}
      ref: ${{ steps.pick.outputs.ref }}
      # Comma-wrapped on both ends, so a leg can test membership with
      # contains(..., ',name,') and never match a name by prefix.
      registries: ${{ steps.pick.outputs.registries }}
    steps:
      # Event fields go through the environment, never into the script body:
      # interpolating them directly is the GitHub Actions script-injection sink.
      - id: pick
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_REGISTRIES: ${{ inputs.registries }}
          RELEASE_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_VERSION:-}" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${RELEASE_REF#v}"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not a release version; nothing to smoke-test"; exit 1 ;;
          esac
          # workflow_run carries no inputs, so a run triggered that way tests
          # everything and a registry that is genuinely missing fails its leg.
          REGISTRIES="${DISPATCH_REGISTRIES:-npm,pypi,maven,swiftpm,go,php,rubygems,crates,nuget}"
          case "$REGISTRIES" in
            *[!a-z,]*) echo "::error::'$REGISTRIES' is not a comma-separated registry list"; exit 1 ;;
          esac
          {
            echo "version=$VERSION"
            echo "ref=v$VERSION"
            echo "registries=,$REGISTRIES,"
          } >> "$GITHUB_OUTPUT"
          echo "smoke-testing $VERSION on: $REGISTRIES"

  # What the GitHub Release and GHCR serve, checked the way a consumer would
  # (R34, MIGRATION.md steps 1.15 and 2.10): every file against SHA256SUMS;
  # every artifact's SLSA provenance and CycloneDX SBOM attestations with
  # `gh attestation verify`, signed by this repository's release.yml at this
  # tag; every SBOM checked to name the versions pinned at the tag; the image
  # by digest the same way. Releases before aprv.wasm existed carry none of
  # this, and the job says so and succeeds.
  attestations:
    name: attestations — verify the release's provenance and SBOMs
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read    # gh attestation verify reads them
      packages: read        # and the image's from GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - name: download the release's artifacts
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          if ! gh release view "$REF" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx aprv.wasm; then
            echo "::notice::$REF has no aprv.wasm asset (a release before 0.8.0); nothing to verify"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$REF" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
          (cd "$RUNNER_TEMP/assets" && sha256sum --check --strict SHA256SUMS)
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: provenance and SBOM attestations of every artifact
        if: steps.assets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          workflow="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for f in aprv.wasm aprv.component.wasm aprv-*-linux-musl aprv-*-apple-darwin aprv-*-windows-msvc.exe; do
            [ -f "$f" ] || { echo "::error::the release has no $f"; exit 1; }
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$workflow" --source-ref "refs/tags/$REF"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$workflow" --source-ref "refs/tags/$REF" \
              --predicate-type https://cyclonedx.org/bom
          done
          gh attestation verify aprv.wit --repo "$GITHUB_REPOSITORY" --signer-workflow "$workflow" --source-ref "refs/tags/$REF"
      - name: every SBOM names the versions pinned at this tag
        if: steps.assets.outputs.present == 'true'
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/assets"
          for f in aprv.wasm aprv.component.wasm; do
            node tools/sbom-augment.mjs check --kind wasm "$a/$f.cdx.json"
          done
          for f in "$a"/aprv-*-linux-musl "$a"/aprv-*-apple-darwin "$a"/aprv-*-windows-msvc.exe; do
            node tools/sbom-augment.mjs check --kind server --embedded "$a/aprv.component.wasm" "$f.cdx.json"
          done
      - name: the image's provenance, by digest
        if: steps.assets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.resolve.outputs.ref }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          owner=$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://ghcr.io/$owner/aprv-server:$VERSION" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$REF"

  npm:
    name: npm — install the published package and verify a receipt
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      # The engines floor, not the newest runtime: a consumer on the oldest
      # version we claim is the one most likely to hit a packaging problem.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          # No npm cache: see the note above the jobs.
          cache: ''

      # Installing outside a lockfile is the entire point: the subject under
      # test is the tarball the registry just started serving, which by
      # definition no lockfile in this repository can pin.
      - name: install from the registry, outside the checkout # zizmor: ignore[adhoc-packages]
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/npm-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/npm-smoke.mjs "$SMOKE/"
          cd "$SMOKE"
          npm init -y > /dev/null
          installed=false
          for attempt in $(seq 1 10); do
            if npm install "apple-purchase-receipt-verifier@$VERSION"; then
              installed=true
              break
            fi
            echo "not on the registry yet (attempt $attempt of 10); waiting 30s"
            sleep 30
          done
          if [ "$installed" != true ]; then
            echo "::error::apple-purchase-receipt-verifier@$VERSION never became installable from npm"
            exit 1
          fi
          node npm-smoke.mjs

  pypi:
    name: pypi — install the published wheel and verify a receipt
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      # requires-python floor, same reasoning as the node job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          # No pip cache: see the note above the jobs.
          cache: ''

      - name: install from the registry, outside the checkout
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/pypi-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/pypi-smoke.py "$SMOKE/"
          cd "$SMOKE"
          python3 -m venv venv
          installed=false
          for attempt in $(seq 1 10); do
            if venv/bin/pip install "apple-purchase-receipt-verifier==$VERSION"; then
              installed=true
              break
            fi
            echo "not on the index yet (attempt $attempt of 10); waiting 30s"
            sleep 30
          done
          if [ "$installed" != true ]; then
            echo "::error::apple-purchase-receipt-verifier==$VERSION never became installable from PyPI"
            exit 1
          fi
          venv/bin/python pypi-smoke.py

  maven:
    name: maven central — resolve the published jar and verify a receipt
    needs: resolve
    runs-on: ubuntu-latest
    # Central's sync lags the portal release by tens of minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      # The jar is Java 8 bytecode; run it on a current LTS, as consumers do.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          # No ~/.m2 cache: see the note above the jobs. This job's retry loop
          # deletes the coordinate from ~/.m2 on every attempt anyway, so a
          # restored cache would be actively counterproductive here.
          cache: ''

      - name: resolve from Central, outside the checkout
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/maven-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/maven-smoke/pom.xml .github/smoke/maven-smoke/Smoke.java "$SMOKE/"
          cd "$SMOKE"
          # Measured on 0.2.2: Central served the artifact by attempt 5, but the
          # loop kept failing until attempt 27 — a failed lookup gets cached in
          # ~/.m2 and Maven won't re-query a release repository until the update
          # interval elapses, so each retry clears the cached miss and forces a
          # remote check.
          resolved=false
          for attempt in $(seq 1 40); do
            rm -rf ~/.m2/repository/io/github/emindeniz99/apple-purchase-receipt-verifier
            if mvn -B -q -U -Dsmoke.version="$VERSION" -Dmdep.outputFile=cp.txt dependency:build-classpath; then
              resolved=true
              break
            fi
            echo "not on Central yet (attempt $attempt of 40); waiting 60s"
            sleep 60
          done
          if [ "$resolved" != true ]; then
            echo "::error::io.github.emindeniz99:apple-purchase-receipt-verifier:$VERSION never appeared on Central"
            exit 1
          fi
          javac -cp "$(cat cp.txt)" Smoke.java -d .
          java -cp ".:$(cat cp.txt)" Smoke

  swiftpm:
    name: swiftpm — resolve the published tag and verify a receipt
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The manifest's floor, in the same digest-pinned image as the CI swift
    # job.
    container: swift:6.3@sha256:56ef1be2c1ca36f4c52440357dc1fcdfdb5e113587134fcadeef57c225c71b54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: resolve the published tag, outside the checkout
        # The swift image's /bin/sh is dash, which has no `pipefail`.
        shell: bash
        env:
          SMOKE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/swiftpm-smoke"
          mkdir -p "$SMOKE"
          cp -R .github/smoke/swiftpm-smoke/. "$SMOKE/"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cd "$SMOKE"
          # The tag is pushed before this workflow can run, so there is nothing
          # to wait for; a resolve failure here is a real broken tag (one
          # without the committed aprv.wasm resource, for instance). Release:
          # WasmKit interprets, and a debug build of it is too slow for an
          # honest receipt.
          swift run -c release Smoke

  go:
    name: go — resolve the published module and verify a receipt
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: contains(needs.resolve.outputs.registries, ',go,')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      # The go.mod floor, with GOTOOLCHAIN=local so Go cannot quietly download
      # a newer toolchain and test something other than the floor.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          # setup-go caches by default; off here, see the note above the jobs.
          cache: false

      - name: resolve the published module, outside the checkout
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GOTOOLCHAIN: local
          GOFLAGS: -mod=mod
          GOPROXY: https://proxy.golang.org
        run: |
          set -euo pipefail
          MODULE="github.com/$GITHUB_REPOSITORY/go"
          SMOKE="$RUNNER_TEMP/go-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/go-smoke/main.go "$SMOKE/"
          cd "$SMOKE"
          go mod init smoke
          # The module is published by release.yml's tag-go-module job, which
          # already waited for the proxy; poll anyway, because this workflow is
          # dispatched separately and the proxy is eventually consistent.
          resolved=false
          for attempt in $(seq 1 20); do
            if go get "$MODULE@v$VERSION"; then
              resolved=true
              break
            fi
            echo "the proxy has not picked up v$VERSION yet (attempt $attempt of 20); waiting 30s"
            sleep 30
          done
          if [ "$resolved" != true ]; then
            echo "::error::$MODULE@v$VERSION never became resolvable from proxy.golang.org"
            exit 1
          fi
          go run .

  packagist:
    name: packagist — install the published package and its binary, verify a receipt
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: contains(needs.resolve.outputs.registries, ',php,')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      # The composer.json floor, with the two extensions the package needs
      # and nothing else. setup-php caches nothing unless asked.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          extensions: json, curl
          coverage: none

      # Installing outside a lockfile is the entire point, as in the npm leg.
      # aprv-install downloads the release's aprv binary for this platform
      # and refuses it unless it matches the hash the tag's
      # php/binaries.json pins.
      - name: install from Packagist, outside the checkout # zizmor: ignore[adhoc-packages]
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/packagist-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/packagist-smoke.php "$SMOKE/"
          cd "$SMOKE"
          echo '{}' > composer.json
          installed=false
          for attempt in $(seq 1 40); do
            if composer require --no-interaction --no-progress "emindeniz99/apple-purchase-receipt-verifier:$VERSION"; then
              installed=true
              break
            fi
            echo "Packagist has not imported $VERSION yet (attempt $attempt of 40); waiting 30s"
            sleep 30
          done
          if [ "$installed" != true ]; then
            echo "::error::emindeniz99/apple-purchase-receipt-verifier $VERSION never became installable from Packagist"
            exit 1
          fi
          vendor/bin/aprv-install
          php packagist-smoke.php

  rubygems:
    name: rubygems — install the published gem and verify a receipt
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skipped, not failed, while RubyGems is unbootstrapped (BOOTSTRAP.md).
    if: contains(needs.resolve.outputs.registries, ',rubygems,')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      # The gemspec's required_ruby_version floor, same reasoning as the node
      # and python jobs.
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: "3.3"
          # No bundler cache, and nothing else this action caches: see the
          # note above the jobs. The gem under test comes from the registry
          # into a scratch GEM_HOME, never from a restored cache.
          bundler-cache: false

      # A scratch GEM_HOME, so the gem under test is the only thing on the
      # load path and nothing in the checkout can satisfy the require.
      #
      # Installing outside a lockfile is the entire point, same as the npm leg:
      # the subject under test is the gem the registry just started serving,
      # which by definition no lockfile in this repository can pin.
      - name: install from the registry, outside the checkout # zizmor: ignore[adhoc-packages]
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/rubygems-smoke"
          mkdir -p "$SMOKE"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cp .github/smoke/rubygems-smoke.rb "$SMOKE/"
          cd "$SMOKE"
          export GEM_HOME="$SMOKE/gems"
          installed=false
          for attempt in $(seq 1 10); do
            if gem install --no-document apple-purchase-receipt-verifier -v "$VERSION"; then
              installed=true
              break
            fi
            echo "not on rubygems.org yet (attempt $attempt of 10); waiting 30s"
            sleep 30
          done
          if [ "$installed" != true ]; then
            echo "::error::apple-purchase-receipt-verifier $VERSION never became installable from RubyGems.org"
            exit 1
          fi
          ruby rubygems-smoke.rb

  crates:
    name: crates.io — depend on the published crate and verify a receipt
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Skipped, not failed, while crates.io is unbootstrapped (BOOTSTRAP.md).
    if: contains(needs.resolve.outputs.registries, ',crates,')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      # No Swatinem/rust-cache or actions/cache here, deliberately: this leg
      # has no setup action to turn caching off in, and it must not grow one.
      # See the note above the jobs.
      - run: rustup toolchain install stable --profile minimal

      # `exclude` drops tests/ and fuzz/ from the published tarball, so the file
      # set a consumer receives is not the repository file set. The receipt
      # comes from the checkout for the same reason.
      - name: depend on the published crate, outside the checkout
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/crates-smoke"
          mkdir -p "$SMOKE"
          cp -R .github/smoke/crates-smoke/. "$SMOKE/"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cd "$SMOKE"
          added=false
          for attempt in $(seq 1 20); do
            if cargo add "apple-purchase-receipt-verifier@=$VERSION"; then
              added=true
              break
            fi
            echo "not on crates.io yet (attempt $attempt of 20); waiting 30s"
            sleep 30
          done
          if [ "$added" != true ]; then
            echo "::error::apple-purchase-receipt-verifier $VERSION never became resolvable from crates.io"
            exit 1
          fi
          cargo run

  nuget:
    name: nuget — restore the published package and verify a receipt
    needs: resolve
    runs-on: ubuntu-latest
    # The Wasmtime package it restores is about 200 MB unpacked.
    timeout-minutes: 30
    # Skipped, not failed, while NuGet is unbootstrapped (BOOTSTRAP.md).
    if: contains(needs.resolve.outputs.registries, ',nuget,')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      # net8.0 is the floor of the two shipped assets and selects
      # lib/net8.0; the netstandard2.0 asset needs a net4x consumer on a
      # Windows runner and is not covered here (dotnet/RELEASE.md).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          # No NuGet cache: see the note above the jobs. The restore loop
          # below already passes --no-cache for the same reason at the HTTP
          # layer; this closes the Actions-cache half of it.
          cache: false

      - name: restore from the registry, outside the checkout
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/nuget-smoke"
          mkdir -p "$SMOKE"
          cp -R .github/smoke/nuget-smoke/. "$SMOKE/"
          cp fixtures/public-receipts/receipt-sandbox-g5.b64 "$SMOKE/"
          cd "$SMOKE"
          restored=false
          for attempt in $(seq 1 20); do
            # --no-cache: NuGet caches an HTTP response, a 404 for a
            # not-yet-indexed version included, for 30 minutes — the same
            # cached-miss trap the maven job documents.
            if dotnet restore --no-cache "-p:SmokeVersion=$VERSION"; then
              restored=true
              break
            fi
            echo "not on nuget.org yet (attempt $attempt of 20); waiting 30s"
            sleep 30
          done
          if [ "$restored" != true ]; then
            echo "::error::ApplePurchaseReceiptVerifier $VERSION never became restorable from nuget.org"
            exit 1
          fi
          dotnet run --no-restore "-p:SmokeVersion=$VERSION"
