# Watches Apple's published root certificates and fails (= notifies) when
# anything changes: the bytes of the two pinned roots, OR the set of roots
# Apple lists on its PKI page (so a future G4 is caught the week it appears,
# not when it breaks a customer). Trust anchors are deliberately NEVER
# fetched at runtime (PLAN D12) — this scheduled diff is the
# rotation-monitoring mechanism instead. All three published roots are
# pinned (PLAN D15), so this job checks the bytes of all three plus the
# set of roots the PKI page lists.
name: apple-root-watch

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare pinned roots against Apple PKI
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/AppleIncRootCertificate.cer https://www.apple.com/appleca/AppleIncRootCertificate.cer
          curl -sSL -o /tmp/AppleRootCA-G2.cer https://www.apple.com/certificateauthority/AppleRootCA-G2.cer
          curl -sSL -o /tmp/AppleRootCA-G3.cer https://www.apple.com/certificateauthority/AppleRootCA-G3.cer
          diff <(sha256sum < certs/AppleIncRootCertificate.cer) <(sha256sum < /tmp/AppleIncRootCertificate.cer)
          diff <(sha256sum < certs/AppleRootCA-G2.cer) <(sha256sum < /tmp/AppleRootCA-G2.cer)
          diff <(sha256sum < certs/AppleRootCA-G3.cer) <(sha256sum < /tmp/AppleRootCA-G3.cer)
          echo "pinned roots match Apple PKI"
      - name: Check for newly published roots on the PKI page
        # Scoped to the page's "Apple Root Certificates" section rather than
        # a filename pattern, so a future root is caught whatever Apple names
        # it. If Apple restructures the page the extraction comes up empty
        # and the diff fails — loud either way.
        run: |
          set -euo pipefail
          curl -sSL https://www.apple.com/certificateauthority/ \
            | sed -n '/<h2>Apple Root Certificates<\/h2>/,/<h2>Apple Intermediate Certificates<\/h2>/p' \
            | grep -oE 'href="[^"]*\.cer"' \
            | grep -oE '[^/"]+\.cer' \
            | sort -u > /tmp/published-roots.txt
          printf '%s\n' AppleIncRootCertificate.cer AppleRootCA-G2.cer AppleRootCA-G3.cer \
            | sort > /tmp/known-roots.txt
          diff /tmp/known-roots.txt /tmp/published-roots.txt
          echo "no new roots published"
