# Publishes on version tags (v*). Registry side of the handshake:
#
#   PyPI  — trusted publisher (OIDC): project apple-purchase-receipt-verifier,
#           repo emindeniz99/apple-purchase-receipt-verifier, workflow
#           release.yml, environment pypi. First publish works via OIDC
#           (pending publisher); no token anywhere.
#   npm   — trusted publisher (OIDC) matches this FILENAME (release.yml).
#           Never rename this file. The very first npm publish must be done
#           manually by the owner (OIDC cannot create a package); this job
#           takes over from the next version.
#   Maven — token + GPG based (Central has no OIDC): CENTRAL_USERNAME /
#           CENTRAL_PASSWORD (portal token pair), GPG_PRIVATE_KEY (armored,
#           passphrase-protected) and GPG_PASSPHRASE repo secrets.
#   Swift — nothing to publish; SwiftPM consumes the tag itself.
#
# Both jobs skip (loudly) when the registry already has the tag's version,
# so a manually bootstrapped version doesn't fail the tag run.
#
# Security: every action pinned to a commit SHA; no dependency cache in
# publish jobs (a poisoned restore would become the shipped artifact);
# checkouts never push, so credentials are not persisted.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-pypi:
    name: publish python to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Skip if this version is already on PyPI
        id: gate
        working-directory: python
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if curl -fsSL "https://pypi.org/pypi/apple-purchase-receipt-verifier/$VERSION/json" >/dev/null 2>&1; then
            echo "PyPI already has $VERSION — skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist + wheel
        if: steps.gate.outputs.publish == 'true'
        working-directory: python
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.gate.outputs.publish == 'true'
        with:
          packages-dir: python/dist/

  publish-npm:
    name: publish node to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm's OIDC trusted publishing needs npm >= 11.5; Node 24 ships it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish unless this version is already on npm
        working-directory: node
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "apple-purchase-receipt-verifier@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION — skipping publish."
          else
            npm publish
          fi

  publish-maven:
    name: publish java to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip if this version is already on Maven Central
        id: gate
        run: |
          set -euo pipefail
          VERSION=$(cat version.txt)
          if curl -fsSL "https://repo1.maven.org/maven2/io/github/emindeniz99/apple-purchase-receipt-verifier/$VERSION/" >/dev/null 2>&1; then
            echo "Central already has $VERSION — skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # setup-java writes the settings.xml server entry (id `central`, the
      # pom's publishingServerId) with env-var placeholders and imports the
      # GPG key; the actual values only ever exist as env vars on the mvn
      # step below.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.gate.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy to Central (tests, sources, javadoc, GPG, upload)
        if: steps.gate.outputs.publish == 'true'
        working-directory: java
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P central deploy
