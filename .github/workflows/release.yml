# Publishes on version tags (v*). Registry side of the handshake:
#
#   PyPI  — trusted publisher (OIDC): project apple-purchase-receipt-verifier,
#           repo emindeniz99/apple-purchase-receipt-verifier, workflow
#           release.yml, environment pypi. First publish works via OIDC
#           (pending publisher); no token anywhere.
#   npm   — trusted publisher (OIDC) matches this FILENAME (release.yml).
#           Never rename this file. The very first npm publish must be done
#           manually by the owner (OIDC cannot create a package); this job
#           takes over from the next version.
#   Maven — token + GPG based (Central has no OIDC): CENTRAL_USERNAME /
#           CENTRAL_PASSWORD (portal token pair), GPG_PRIVATE_KEY (armored,
#           passphrase-protected) and GPG_PASSPHRASE repo secrets.
#   Swift — nothing to publish; SwiftPM consumes the tag itself.
#   RubyGems — trusted publisher (OIDC) keyed to this FILENAME, environment
#           rubygems. RubyGems supports a pending publisher, so the first
#           publish can go through this job with no manual gem push; see
#           BOOTSTRAP.md.
#   crates.io — trusted publisher (OIDC) keyed to this FILENAME. The crate
#           must exist first, so the owner makes the first publish by hand
#           (BOOTSTRAP.md).
#   NuGet — trusted publisher (OIDC) keyed to this FILENAME. Package id
#           ApplePurchaseReceiptVerifier; first publish is manual, same
#           reason as npm (BOOTSTRAP.md).
#   Go    — no registry: proxy.golang.org serves the module from this
#           repository, published by a go/vX.Y.Z tag the job below creates.
#   Packagist — no job needed: the package is the repository ROOT's
#           composer.json (Packagist reads a root and nowhere else), and
#           Packagist imports every tag on its own once the owner submits
#           the repository. See BOOTSTRAP.md.
#   GitHub Release — aprv.wasm, its component and WIT, the aprv-server
#           binaries, the SBOMs, the provenance bundles, the OpenAPI
#           document, the wire schemas and SHA256SUMS (release-assets).
#   GHCR  — the aprv-server image (publish-image), with GITHUB_TOKEN; Docker
#           Hub too once the docker-hub environment holds its token
#           (publish-image-dockerhub, BOOTSTRAP.md).
#
# aprv.wasm is built ONCE, by build-wasm, and every package that carries it
# takes that file from the run's artifacts and checks its SHA-256 before
# building: no publish job compiles the module. The server binaries likewise
# come from build-server. Both are attested (SLSA build provenance) where
# they are built, and their CycloneDX SBOMs are attested by the sbom job.
#
# Every publish job skips (loudly) when the registry already has the tag's
# version, so a manually bootstrapped version doesn't fail the tag run, and
# each one proves the built artifact carries the library before pushing it.
#
# The three OIDC registries also ask whether their package exists at all, so
# that an unfinished bootstrap is a skip rather than a failed release. Without
# it, one unbootstrapped registry failed the whole tag run at its login step
# and took post-publish verification of the live registries down with it
# (v0.4.0, run 7). crates.io and NuGet cannot publish a package that does not
# exist, so a 404 there means "skip" outright. RubyGems can, through a pending
# publisher, so publish-rubygems always attempts OIDC and uses the lookup only
# to read a failure: no gem and no credentials is an unfinished bootstrap; a
# gem that exists is a real authentication failure. Either way the smoke
# workflow is told which registries it may test.
#
# Completing a half-published release (0.8.0, 2026-10-04: two jobs failed
# on this file's first run and six registries were left without the
# version): the tag's commit cannot be changed, so the fix lands on main and
# `gh workflow run release.yml --ref main -f tag=vX.Y.Z` runs this file from
# there. ci-passed refuses a tag that is not `v` + version.txt at the
# dispatched commit or that does not exist. The publish jobs then skip the
# registries that already carry the version and publish the rest; the
# tag-keyed jobs (release assets, image, Go tag, PHP pins, smoke) read the
# tag from the input. The attestations and the image's revision name the
# dispatched commit, which is what built the files. A dry run
# (`-f dry_run=true`) rehearses the same path with nothing submitted:
# everything is built, checked and reproduced; uploads, pushes, the Go tag,
# the release assets, the attestations and the smoke dispatch are skipped
# (npm, crates.io and Maven run their own dry-run modes). What a publish
# job would have uploaded is kept for 30 days as a workflow artifact named
# dry-run-<registry>, and the release's asset set as dry-run-release-assets,
# so the files can be inspected. A gate that would skip a version the
# registry already carries reports it and builds anyway, so a rehearsal
# on main after a release still builds every package. Maven runs under
# the maven-central-dry-run environment, which asks no reviewer and is
# handed no key (the credentials live on maven-central), and skips signing.
# A dry run without a tag (from main mid-cycle) has no release branch, so
# the committed module copies and pins (and php/SHA256SUMS) still name the
# last release while the core has moved on: each job that reads them
# (build-wasm, the -wasm Maven build, the gem, php-binaries) first writes
# them in its own checkout as release-please.yml would on the release
# branch, from this run's files, and build-wasm and php-binaries warn about
# each file that would change. Nothing is committed or pushed. Such a run
# proves nothing about the pins. A dry run with a tag rehearses a
# completion and refreshes nothing, so it checks the pins exactly as the
# real completion will; a tag run never takes the refresh either.
#
# Security: every action pinned to a commit SHA; no dependency cache in
# publish or build jobs (a poisoned restore would become the shipped
# artifact), the wasm toolchain included; checkouts never push, so
# credentials are not persisted.

name: release

on:
  push:
    tags: ['v*']
  # A dispatch from a branch completes or rehearses a release (the header):
  # `tag` names the vX.Y.Z whose registries are still missing (the branch
  # must carry that version in version.txt); `dry_run` runs every job and
  # submits nothing. A branch dispatch must do one or the other.
  workflow_dispatch:
    inputs:
      tag:
        description: "The vX.Y.Z tag to complete: publish what its run left unpublished, from this ref"
        required: false
        type: string
      dry_run:
        description: "Run every job but submit nothing: no upload, push, tag, release asset or attestation"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Nothing publishes until the ci workflow has passed on this exact commit.
  # release-please tags the merge commit and dispatches this workflow while
  # ci is still running on it, so the gate waits for that run rather than
  # trusting the merge.
  ci-passed:
    name: wait for ci on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # A branch dispatch either completes a named tag or is a dry run; a
      # bare one would tag go/<branch> and push an image named <branch>.
      - name: the dispatch names a tag this tree carries, or is a dry run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ -z "$TAG" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              # Another tag (go/vX.Y.Z, corpus-*) names no release.
              if ! [[ "$REF_NAME" =~ $semver ]]; then
                echo "::error::'$REF_NAME' is not a vX.Y.Z release tag"
                exit 1
              fi
            elif [ "$DRY_RUN" != "true" ]; then
              echo "::error::a dispatch from a branch must name the tag it completes (tag=vX.Y.Z) or be a dry run (dry_run=true)"
              exit 1
            fi
            exit 0
          fi
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.txt?ref=$GITHUB_SHA" --jq .content | base64 -d | tr -d '[:space:]')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::version.txt at $GITHUB_SHA is $version, not ${TAG#v}; a completion publishes the tree's own version only"
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG does not exist; a completion finishes a release that release-please already tagged"
            exit 1
          fi
          # A completion publishes this tree, not the tag's. The packages
          # that already carry the version were built at the tag, so every
          # package file changed since is named for the operator to judge.
          changed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$TAG...$GITHUB_SHA" --jq '.files[].filename' \
            | grep -E '^(java|java-wasm|node|python|ruby|dotnet|rust|go|swift|php)/|^composer\.json$' || true)
          if [ -n "$changed" ]; then
            echo "::warning::completing $TAG from $GITHUB_SHA, whose package files differ from the tag's:"
            while IFS= read -r f; do echo "::warning::  $f"; done <<<"$changed"
          fi
          echo "completing $TAG from $GITHUB_SHA"
      - name: poll the ci workflow run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || echo "none/")
            case "$state" in
              completed/success) echo "ci passed on $GITHUB_SHA"; exit 0 ;;
              completed/*) echo "::error::ci concluded '${state#completed/}' on $GITHUB_SHA; not publishing"; exit 1 ;;
              *) echo "ci is $state on $GITHUB_SHA (attempt $attempt of 80); waiting 30s"; sleep 30 ;;
            esac
          done
          echo "::error::ci never completed on $GITHUB_SHA; not publishing"
          exit 1

  # aprv.wasm and its component, built once for the release (MIGRATION.md,
  # "Release workflow changes"; THREAT-MODEL.md §4): the pinned toolchain
  # installed fresh (never a cache: a poisoned restore would become the
  # shipped module), the same contract checks as ci.yml's rust-wasm, the
  # committed Go and Swift copies held to this build (a go/v* tag is
  # forever, so tag-go-module waits for this job), a second build in a fresh
  # clone that must reproduce the hash, and SLSA build provenance for the
  # module, the component and the WIT. Every job below takes these files and
  # never rebuilds them.
  build-wasm:
    name: build aprv.wasm
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write       # sign the provenance attestation
      attestations: write   # store it
    outputs:
      wasm-sha256: ${{ steps.build.outputs.wasm-sha256 }}
      component-sha256: ${{ steps.build.outputs.component-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: install the pinned wasm toolchain (no cache)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wasm-toolchain"
          tools/wasm-toolchain.sh "$dir" > /dev/null
          { echo "WASI_SDK_DIR=$dir/wasi-sdk"; echo "OPENSSL_WASM_DIR=$dir/openssl-wasm"; } >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"
      # The rustc rust/rust-toolchain.toml names, made the one every later
      # step uses: build.sh runs from the repository root, where rustup does
      # not read that file.
      - name: install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target wasm32-wasip1
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: build aprv.wasm and the component
        id: build
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/aprv"
          rust/bindings/abi/build.sh "$out"
          mkdir -p "$out/build-info"
          cp "$WASI_SDK_DIR/VERSION" "$out/build-info/VERSION"
          (cd rust && rustc -vV) > "$out/build-info/rustc-vv.txt"
          echo "wasm-sha256=$(sha256sum "$out/aprv.wasm" | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "component-sha256=$(sha256sum "$out/aprv.component.wasm" | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: imports, exports, WIT read-back and SHA256SUMS
        run: tools/check-wasm.sh "$RUNNER_TEMP/aprv" rust/bindings/abi/wit/aprv.wit
      - name: the ABI tests and every case, on the trap-on-anything host
        run: |
          set -euo pipefail
          node tools/wasm-trap-host.mjs abi-tests "$RUNNER_TEMP/aprv/aprv.wasm" fixtures/cases.json
          node tools/wasm-trap-host.mjs cases "$RUNNER_TEMP/aprv/aprv.wasm" fixtures/cases.json
      # The committed Go and Swift copies and every tracked pin (each host's
      # aprv.wasm.sha256, Node's component pin): the Go and Swift packages,
      # the Java build and the gem check the module against its pin, so a
      # stale one fails a consumer or a publish job. release-please.yml
      # rewrites them all on the release branch.
      #
      # A dry run without a tag (a rehearsal from main after a core change)
      # has no release branch to take them from, so it first writes them
      # here the way release-please would (tools/refresh-wasm-pins.sh), in
      # this checkout only and never committed, and the check below then
      # holds the refreshed tree. Each publish job that reads a pin does the
      # same in its own checkout. A file it changes is a warning: from a
      # release branch it means release-please did not refresh it. A dry
      # run with a tag rehearses a completion, whose real run refreshes
      # nothing, so it checks the committed pins exactly as that run will.
      - name: "dry run: refresh the copies and pins in this checkout, as release-please would"
        if: ${{ inputs.dry_run && !inputs.tag }}
        run: |
          set -euo pipefail
          changed="$(tools/refresh-wasm-pins.sh "$RUNNER_TEMP/aprv/aprv.wasm" "$RUNNER_TEMP/aprv/aprv.component.wasm")"
          if [ -n "$changed" ]; then
            echo "::warning::dry run: $(wc -l <<<"$changed") copies and pins would be refreshed by release-please (written in this checkout only, not committed): $(tr '\n' ' ' <<<"$changed")"
          else
            echo "dry run: the committed copies and pins already name this build"
          fi
      - name: the committed copies and pins are this build
        env:
          BUILT: ${{ steps.build.outputs.wasm-sha256 }}
          COMPONENT: ${{ steps.build.outputs.component-sha256 }}
        run: |
          set -euo pipefail
          bad=0
          check() { # file got want
            if [ "$2" = "$3" ]; then echo "$1 is this build ($3)"
            else echo "::error file=$1::$1 is $2, the release builds $3; release-please.yml refreshes it on the release branch"; bad=1; fi
          }
          for f in $(git ls-files -- '*aprv.wasm'); do check "$f" "$(sha256sum "$f" | cut -c1-64)" "$BUILT"; done
          for f in $(git ls-files -- '*aprv.wasm.sha256'); do check "$f" "$(cut -c1-64 "$f")" "$BUILT"; done
          for f in $(git ls-files -- '*aprv.component.wasm.sha256'); do check "$f" "$(cut -c1-64 "$f")" "$COMPONENT"; done
          exit "$bad"
      - name: the build reproduces in a fresh clone
        env:
          EXPECTED: ${{ steps.build.outputs.wasm-sha256 }}
          APRV_EXPECTED_COMPONENT_SHA256: ${{ steps.build.outputs.component-sha256 }}
        run: |
          APRV_REPO_URL="file://$GITHUB_WORKSPACE" APRV_TOOLCHAIN_DIR="$RUNNER_TEMP/wasm-toolchain" \
            tools/reproduce-wasm.sh "$GITHUB_SHA" "$EXPECTED"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.dry_run }}
        id: provenance
        with:
          subject-path: |
            ${{ runner.temp }}/aprv/aprv.wasm
            ${{ runner.temp }}/aprv/aprv.component.wasm
            ${{ runner.temp }}/aprv/aprv.wit
      - name: keep the provenance bundle with the files
        if: ${{ !inputs.dry_run }}
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/aprv/aprv-wasm.provenance.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aprv-wasm-release
          path: ${{ runner.temp }}/aprv/
          if-no-files-found: error
          retention-days: 30

  # The aprv-server binaries (R31): static musl for Linux, native builds for
  # macOS and Windows, each on a runner of its own architecture, each built
  # in two stages by rust/server/scripts/build-static.sh (precompile the
  # release's component for an explicit baseline with the serving binary's
  # Wasmtime features, then build the binary that embeds it). No cache. The
  # Linux builds are rebuilt once by tools/reproduce-server.sh; the macOS
  # and Windows linkers stamp their output, so those are attested but not
  # claimed to reproduce.
  build-server:
    name: build aprv-server (${{ matrix.target }})
    needs: build-wasm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write       # sign the provenance attestation
      attestations: write   # store it
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, exe: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, exe: "" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, exe: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe" }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, exe: ".exe" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm-release
          path: ${{ runner.temp }}/aprv
      - name: the component is build-wasm's
        shell: bash
        env:
          COMPONENT_SHA256: ${{ needs.build-wasm.outputs.component-sha256 }}
        run: echo "$COMPONENT_SHA256  $RUNNER_TEMP/aprv/aprv.component.wasm" | sha256sum -c -
      - name: install the pinned Rust toolchain and the target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      # musl-gcc compiles Wasmtime's C helpers for the musl target
      # (build-static.sh).
      - name: install musl-gcc
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # build-static.sh writes aprv-<target>[.exe] and the precompiled
      # component's manifest (aprv.<target>.ccwasm.json), which goes into
      # the artifact for the record; COMPONENT_SHA256 makes it refuse any
      # component but build-wasm's.
      - name: build
        id: build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          COMPONENT_SHA256: ${{ needs.build-wasm.outputs.component-sha256 }}
        run: |
          set -euo pipefail
          rust/server/scripts/build-static.sh "$RUNNER_TEMP/aprv/aprv.component.wasm" "$TARGET" "$RUNNER_TEMP/build"
          out="$RUNNER_TEMP/server"
          mkdir -p "$out/build-info"
          cp "$RUNNER_TEMP/build/aprv-$TARGET$EXE" "$out/aprv-$TARGET$EXE"
          cp "$RUNNER_TEMP/build/aprv.$TARGET.ccwasm.json" "$out/build-info/"
          rustc -vV > "$out/build-info/rustc-vv-$TARGET.txt"
          "$out/aprv-$TARGET$EXE" info
          echo "sha256=$(sha256sum "$out/aprv-$TARGET$EXE" | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: the static binary has no interpreter and no dynamic dependency
        if: endsWith(matrix.target, '-linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/server/aprv-$TARGET"
          if readelf -lW "$bin" | grep -q INTERP; then echo "::error::$bin has a program interpreter"; exit 1; fi
          if readelf -dW "$bin" | grep -q NEEDED; then echo "::error::$bin needs a shared library"; exit 1; fi
      # On x86_64 the fresh clone rebuilds the component too. The wasm
      # toolchain's pinned archives are x86_64 only (tools/wasm-toolchain.sh),
      # so the aarch64 leg hands the script build-wasm's component, which that
      # job already rebuilt in a fresh clone, and reproduces the server stage
      # (0.8.0's first run, 2026-10-04, failed here for want of this).
      - name: the Linux build reproduces in a fresh clone
        if: endsWith(matrix.target, '-linux-musl')
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED: ${{ steps.build.outputs.sha256 }}
          APRV_EXPECTED_COMPONENT_SHA256: ${{ needs.build-wasm.outputs.component-sha256 }}
          APRV_COMPONENT: ${{ startsWith(matrix.target, 'aarch64-') && format('{0}/aprv/aprv.component.wasm', runner.temp) || '' }}
        run: APRV_REPO_URL="file://$GITHUB_WORKSPACE" tools/reproduce-server.sh "$GITHUB_SHA" "$TARGET" "$EXPECTED"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.dry_run }}
        id: provenance
        with:
          subject-path: ${{ runner.temp }}/server/aprv-${{ matrix.target }}${{ matrix.exe }}
      - name: keep the provenance bundle with the binary
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TARGET: ${{ matrix.target }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/server/aprv-$TARGET.provenance.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aprv-server-${{ matrix.target }}
          path: ${{ runner.temp }}/server/
          if-no-files-found: error
          retention-days: 30

  # One CycloneDX SBOM per artifact (R34): cargo cyclonedx (pinned, built
  # here from crates.io with --locked) for what Cargo resolved, then
  # tools/sbom-augment.mjs for what Cargo cannot see, read from the pins,
  # checked to name every one; each SBOM attested against its artifact.
  sbom:
    name: SBOMs for aprv.wasm and the server binaries
    needs: [build-wasm, build-server]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # sign the SBOM attestations
      attestations: write   # store them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aprv-*
          path: ${{ runner.temp }}/in
      - name: install cargo-cyclonedx 0.5.9
        working-directory: rust
        run: |
          rustup toolchain install
          cargo install cargo-cyclonedx --version 0.5.9 --locked --root "$RUNNER_TEMP/cargo-tools"
          echo "$RUNNER_TEMP/cargo-tools/bin" >> "$GITHUB_PATH"
      - name: write and check the SBOMs
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/in"
          out="$RUNNER_TEMP/sbom"
          mkdir -p "$out"
          w="$in/aprv-wasm-release"
          cargo cyclonedx --manifest-path rust/bindings/abi/Cargo.toml --format json --spec-version 1.5 \
            --target wasm32-wasip1 --override-filename aprv-abi.cdx -q
          for f in aprv.wasm aprv.component.wasm; do
            node tools/sbom-augment.mjs augment --kind wasm --in rust/bindings/abi/aprv-abi.cdx.json \
              --out "$out/$f.cdx.json" --artifact "$w/$f" --wasi-sdk-dir "$w/build-info" --rustc-vv "$w/build-info/rustc-vv.txt"
          done
          for dir in "$in"/aprv-server-*; do
            target="${dir##*/aprv-server-}"
            bin="$dir/aprv-$target"
            [ -f "$bin" ] || bin="$bin.exe"
            cargo cyclonedx --manifest-path rust/server/Cargo.toml --format json --spec-version 1.5 \
              --target "$target" --override-filename "aprv-server-$target.cdx" -q
            node tools/sbom-augment.mjs augment --kind server --in "rust/server/aprv-server-$target.cdx.json" \
              --out "$out/${bin##*/}.cdx.json" --artifact "$bin" --embedded "$w/aprv.component.wasm" \
              --rustc-vv "$dir/build-info/rustc-vv-$target.txt"
          done
          ls -l "$out"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: ${{ runner.temp }}/in/aprv-wasm-release/aprv.wasm
          sbom-path: ${{ runner.temp }}/sbom/aprv.wasm.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: ${{ runner.temp }}/in/aprv-wasm-release/aprv.component.wasm
          sbom-path: ${{ runner.temp }}/sbom/aprv.component.wasm.cdx.json
      # One attestation per binary: attest takes one SBOM per call, and a
      # matrix here would rebuild cargo-cyclonedx six times.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: ${{ runner.temp }}/in/aprv-server-x86_64-unknown-linux-musl/aprv-x86_64-unknown-linux-musl
          sbom-path: ${{ runner.temp }}/sbom/aprv-x86_64-unknown-linux-musl.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: ${{ runner.temp }}/in/aprv-server-aarch64-unknown-linux-musl/aprv-aarch64-unknown-linux-musl
          sbom-path: ${{ runner.temp }}/sbom/aprv-aarch64-unknown-linux-musl.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: ${{ runner.temp }}/in/aprv-server-x86_64-apple-darwin/aprv-x86_64-apple-darwin
          sbom-path: ${{ runner.temp }}/sbom/aprv-x86_64-apple-darwin.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: ${{ runner.temp }}/in/aprv-server-aarch64-apple-darwin/aprv-aarch64-apple-darwin
          sbom-path: ${{ runner.temp }}/sbom/aprv-aarch64-apple-darwin.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: ${{ runner.temp }}/in/aprv-server-x86_64-pc-windows-msvc/aprv-x86_64-pc-windows-msvc.exe
          sbom-path: ${{ runner.temp }}/sbom/aprv-x86_64-pc-windows-msvc.exe.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: ${{ runner.temp }}/in/aprv-server-aarch64-pc-windows-msvc/aprv-aarch64-pc-windows-msvc.exe
          sbom-path: ${{ runner.temp }}/sbom/aprv-aarch64-pc-windows-msvc.exe.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aprv-sboms
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 30

  # The GitHub Release carries the files every host and user pins against:
  # the module, the component, the WIT, the server binaries, the OpenAPI
  # document, the wire schemas, the SBOMs, the provenance bundles, and one
  # SHA256SUMS over all of them. The Java -wasm jar and the Composer package
  # pin the binaries' hashes, so an asset is never replaced: one that exists
  # with the same digest is skipped (a re-run), one with another digest
  # fails the job.
  release-assets:
    name: attach the artifacts to the GitHub Release
    needs: [build-wasm, build-server, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # uploads release assets; nothing is pushed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aprv-*
          path: ${{ runner.temp }}/in
      - name: gather the assets and write SHA256SUMS
        env:
          WASM_SHA256: ${{ needs.build-wasm.outputs.wasm-sha256 }}
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/assets"
          mkdir -p "$a"
          w="$RUNNER_TEMP/in/aprv-wasm-release"
          echo "$WASM_SHA256  $w/aprv.wasm" | sha256sum -c -
          cp "$w/aprv.wasm" "$w/aprv.component.wasm" "$w/aprv.wit" "$a/"
          # Absent in a dry run, which attests nothing.
          if [ -f "$w/aprv-wasm.provenance.sigstore.json" ]; then cp "$w/aprv-wasm.provenance.sigstore.json" "$a/"; fi
          for dir in "$RUNNER_TEMP"/in/aprv-server-*; do
            find "$dir" -maxdepth 1 -type f -name 'aprv-*' -exec cp {} "$a/" \;
          done
          cp "$RUNNER_TEMP"/in/aprv-sboms/*.cdx.json "$a/"
          if [ -f rust/server/openapi.yaml ]; then cp rust/server/openapi.yaml "$a/aprv-server-openapi.yaml"; fi
          for s in rust/bindings/wire/schema/*.schema.json; do cp "$s" "$a/"; done
          (cd "$a" && sha256sum -- * > SHA256SUMS)
          cat "$a/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.dry_run }}
        with:
          name: dry-run-release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 30
      - name: upload, never replacing an asset
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/assets"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | "\(.name) \(.digest)"')
          for f in "$a"/*; do
            name="${f##*/}"
            want="sha256:$(sha256sum "$f" | cut -c1-64)"
            have=$(awk -v n="$name" '$1 == n { print $2 }' <<<"$existing")
            if [ -z "$have" ]; then
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            elif [ "$have" = "$want" ]; then
              echo "$name is already attached with the same digest"
            else
              echo "::error::$name is already attached with digest $have, this run built $want; a release asset is never replaced"
              exit 1
            fi
          done

  # The image (R34, MIGRATION.md step 2.6) holds the release's own static
  # binaries: rust/server/Dockerfile's `prebuilt` stage copies
  # aprv-<arch> from the build context into its digest-pinned distroless
  # base, so the published image runs exactly the attested binaries and
  # nothing is compiled here. Both architectures in one index, pushed to
  # GHCR with the OCI annotations and attested (provenance and each
  # platform's SBOM); Docker Hub receives the same index, by digest, once
  # the owner has set up the docker-hub environment (BOOTSTRAP.md).
  publish-image:
    name: publish the aprv-server image
    needs: [build-server, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write       # push to GHCR with GITHUB_TOKEN
      id-token: write       # sign the attestations
      attestations: write   # store them
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aprv-server-*-linux-musl
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-sboms
          path: ${{ runner.temp }}/sbom
      - name: build and push the index to GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # A dry run from a branch has no tag: the image is named after the
          # tree's version (a branch name is not a valid image tag anyway).
          if [ "$DRY_RUN" = "true" ] && [[ "$TAG" != v[0-9]* ]]; then TAG="v$(cat version.txt)"; fi
          version="${TAG#v}"
          owner=$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")
          image="ghcr.io/$owner/aprv-server"
          ctx="$RUNNER_TEMP/ctx"
          mkdir -p "$ctx"
          install -m 0755 "$RUNNER_TEMP/in/aprv-server-x86_64-unknown-linux-musl/aprv-x86_64-unknown-linux-musl" "$ctx/aprv-amd64"
          install -m 0755 "$RUNNER_TEMP/in/aprv-server-aarch64-unknown-linux-musl/aprv-aarch64-unknown-linux-musl" "$ctx/aprv-arm64"
          docker buildx create --use --name aprv
          ann=()
          for kv in "source=https://github.com/$GITHUB_REPOSITORY" "revision=$GITHUB_SHA" "version=$version" \
                    "licenses=MIT" "description=aprv-server: Apple receipt and JWS verification over HTTP, running aprv.wasm"; do
            ann+=(--annotation "index,manifest:org.opencontainers.image.$kv" --label "org.opencontainers.image.$kv")
          done
          if [ "$DRY_RUN" = "true" ]; then
            # The same build into a local OCI layout: nothing is pushed, so
            # there is no registry digest to inspect or attest.
            docker buildx build --platform linux/amd64,linux/arm64 --target prebuilt \
              -f rust/server/Dockerfile "${ann[@]}" \
              --provenance=false --sbom=false \
              --tag "$image:$version" --output "type=oci,dest=$RUNNER_TEMP/aprv-server-image.tar" \
              --metadata-file "$RUNNER_TEMP/metadata.json" "$ctx"
            echo "dry run: built $image:$version into $RUNNER_TEMP/aprv-server-image.tar, $(wc -c < "$RUNNER_TEMP/aprv-server-image.tar") bytes; not pushed"
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --target prebuilt \
            -f rust/server/Dockerfile "${ann[@]}" \
            --provenance=false --sbom=false \
            --tag "$image:$version" --push \
            --metadata-file "$RUNNER_TEMP/metadata.json" "$ctx"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect --raw "$image@$digest" \
            | jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.architecture) \(.digest)"' > "$RUNNER_TEMP/platforms.txt"
          echo "amd64=$(awk '$1 == "amd64" { print $2 }' "$RUNNER_TEMP/platforms.txt")" >> "$GITHUB_OUTPUT"
          echo "arm64=$(awk '$1 == "arm64" { print $2 }' "$RUNNER_TEMP/platforms.txt")" >> "$GITHUB_OUTPUT"
          echo "pushed $image:$version at $digest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.dry_run }}
        with:
          name: dry-run-image
          path: ${{ runner.temp }}/aprv-server-image.tar
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/sbom/aprv-x86_64-unknown-linux-musl.cdx.json
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom/aprv-aarch64-unknown-linux-musl.cdx.json
          push-to-registry: true

  # Docker Hub gets the index publish-image pushed to GHCR, copied by digest,
  # so both registries serve the same attested bytes. The token lives on the
  # docker-hub environment; until the owner fills it in (BOOTSTRAP.md), the
  # job says so and succeeds.
  publish-image-dockerhub:
    name: copy the aprv-server image to Docker Hub
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: docker-hub
    permissions:
      contents: read
      packages: read        # read the index from GHCR
    steps:
      - name: is Docker Hub set up?
        id: hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_NAMESPACE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the docker-hub environment lacks DOCKERHUB_TOKEN, DOCKERHUB_USERNAME or DOCKERHUB_NAMESPACE; the image is on GHCR only (BOOTSTRAP.md)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: copy the index by digest
        if: ${{ steps.hub.outputs.enabled == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          IMAGE: ${{ needs.publish-image.outputs.image }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          docker buildx imagetools create --tag "docker.io/$DOCKERHUB_NAMESPACE/aprv-server:${TAG#v}" "$IMAGE@$DIGEST"

  publish-pypi:
    name: publish python to PyPI
    runs-on: ubuntu-latest
    needs: [ci-passed, build-wasm]
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one aprv.wasm build-wasm made and attested, checked by hash; the
      # package build reads it from APRV_WASM / APRV_COMPONENT and never
      # compiles the module itself (.github/CI-NOTES.md).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm-release
          path: ${{ runner.temp }}/aprv
      - name: the module is build-wasm's
        env:
          WASM_SHA256: ${{ needs.build-wasm.outputs.wasm-sha256 }}
          COMPONENT_SHA256: ${{ needs.build-wasm.outputs.component-sha256 }}
        run: |
          set -euo pipefail
          echo "$WASM_SHA256  $RUNNER_TEMP/aprv/aprv.wasm" | sha256sum -c -
          echo "$COMPONENT_SHA256  $RUNNER_TEMP/aprv/aprv.component.wasm" | sha256sum -c -
          { echo "APRV_WASM=$RUNNER_TEMP/aprv/aprv.wasm"; echo "APRV_COMPONENT=$RUNNER_TEMP/aprv/aprv.component.wasm"; } >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Skip if this version is already on PyPI
        id: gate
        working-directory: python
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if curl -fsSL "https://pypi.org/pypi/apple-purchase-receipt-verifier/$VERSION/json" >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "PyPI already has $VERSION; a dry run builds it anyway."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "PyPI already has $VERSION — skipping publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The sdist and one wheel per platform wasmtime-py ships a wheel for,
      # never a py3-none-any wheel: on a platform without a wasmtime wheel pip
      # takes the sdist, which stops with the pointer to aprv-server (R28).
      # build_dist.py copies APRV_WASM (build-wasm's module, checked above)
      # into the package and writes its aprv.wasm.sha256; --check refuses a
      # set of files that is not exactly that.
      - name: Build the sdist and the platform wheels
        if: steps.gate.outputs.publish == 'true'
        working-directory: python
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade build
          python3 tools/build_dist.py --out dist
          python3 tools/build_dist.py --check dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.dry_run && steps.gate.outputs.publish == 'true' }}
        with:
          name: dry-run-pypi
          path: python/dist/
          if-no-files-found: error
          retention-days: 30
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: ${{ steps.gate.outputs.publish == 'true' && !inputs.dry_run }}
        with:
          packages-dir: python/dist/

  publish-npm:
    name: publish node to npm
    runs-on: ubuntu-latest
    needs: [ci-passed, build-wasm]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one aprv.wasm build-wasm made and attested, checked by hash; the
      # package build reads it from APRV_WASM / APRV_COMPONENT and never
      # compiles the module itself (.github/CI-NOTES.md).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm-release
          path: ${{ runner.temp }}/aprv
      - name: the module is build-wasm's
        env:
          WASM_SHA256: ${{ needs.build-wasm.outputs.wasm-sha256 }}
          COMPONENT_SHA256: ${{ needs.build-wasm.outputs.component-sha256 }}
        run: |
          set -euo pipefail
          echo "$WASM_SHA256  $RUNNER_TEMP/aprv/aprv.wasm" | sha256sum -c -
          echo "$COMPONENT_SHA256  $RUNNER_TEMP/aprv/aprv.component.wasm" | sha256sum -c -
          { echo "APRV_WASM=$RUNNER_TEMP/aprv/aprv.wasm"; echo "APRV_COMPONENT=$RUNNER_TEMP/aprv/aprv.component.wasm"; } >> "$GITHUB_ENV"

      # npm's OIDC trusted publishing needs npm >= 11.5; Node 24 ships it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish unless this version is already on npm
        working-directory: node
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          published=false
          if npm view "apple-purchase-receipt-verifier@$VERSION" version >/dev/null 2>&1; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "npm already has $VERSION — skipping publish."
              exit 0
            fi
            echo "npm already has $VERSION; a dry run builds it anyway."
            published=true
          fi
          npm ci --ignore-scripts
          npm run build
          # The tarball must carry the entry point, the module and the
          # licence texts before it reaches the registry (scripts/check-pack.mjs
          # says why; ci.yml's smoke-npm runs the same check).
          npm pack --dry-run --json | node scripts/check-pack.mjs
          if [ "$DRY_RUN" = "true" ]; then
            # npm 11.3 and later refuse `publish --dry-run` over a version the
            # registry already serves, so the registry step is left out then.
            if [ "$published" != true ]; then npm publish --dry-run; fi
            # The tarball itself, for the dry-run-npm artifact; npm pack does
            # not create the destination.
            mkdir -p "$RUNNER_TEMP/npm-pack"
            npm pack --pack-destination "$RUNNER_TEMP/npm-pack" > /dev/null
          else
            npm publish
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.dry_run }}
        with:
          name: dry-run-npm
          path: ${{ runner.temp }}/npm-pack/
          if-no-files-found: error
          retention-days: 30

  # Two artifactIds (R25, ARCHITECTURE.md §7.8): the main
  # artifact from java/, unchanged, and apple-purchase-receipt-verifier-wasm
  # from java-wasm/, whose Endive classes are compiled from build-wasm's
  # aprv.wasm and which carries the two static Linux server binaries from
  # build-server as the classifier jars linux-x86_64 and linux-aarch64 (R26).
  # They go up as two deployments; whether Central counts them as one
  # release event against the 7 a month is the owner's open question
  # (BOOTSTRAP.md, "Maven Central"). The -wasm deployment is held behind
  # the repository variable APRV_PUBLISH_JAVA_WASM (owner, 2026-10-04): the
  # artifact is a preview whose API may still change, and a version on
  # Central is permanent (Central does not delete or replace a published
  # release), so until the variable is `true` a release deploys the main
  # artifact alone. The -wasm jar is still built and tested in CI whenever
  # Java or the core changes; only its upload waits.
  publish-maven:
    name: publish java to Maven Central
    runs-on: ubuntu-latest
    needs: [ci-passed, build-wasm, build-server]
    timeout-minutes: 30
    # The one publish job that holds long-lived secrets (Maven Central has no
    # OIDC path). The environment scopes them to this job alone once the four
    # secrets live on the environment rather than the repository. A dry run
    # names an environment that protects nothing and holds none of them
    # (GitHub creates it on first use), so the rehearsal needs no reviewer
    # and no branch allowance, and signing is skipped below in any case.
    environment: ${{ inputs.dry_run && 'maven-central-dry-run' || 'maven-central' }}
    permissions:
      contents: read
      id-token: write       # sign the provenance of the -wasm jars
      attestations: write   # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip if this version is already on Maven Central
        id: gate
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(cat version.txt)
          if curl -fsSL "https://repo1.maven.org/maven2/io/github/emindeniz99/apple-purchase-receipt-verifier/$VERSION/" >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "Central already has $VERSION; a dry run builds it anyway."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Central already has $VERSION — skipping publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The -wasm artifact is part of every release tree; a tree without it
      # is an error, not a reason to deploy only the main artifact. Its
      # upload is held until the owner sets APRV_PUBLISH_JAVA_WASM to `true`
      # (the header above); a held release prints a notice and deploys the
      # main artifact alone.
      - name: Skip the -wasm artifact if it is held or already on Maven Central
        id: gate-wasm
        env:
          PUBLISH_JAVA_WASM: ${{ vars.APRV_PUBLISH_JAVA_WASM }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(cat version.txt)
          if [ ! -f java-wasm/pom.xml ]; then
            echo "::error::java-wasm/pom.xml is missing; the release ships the -wasm artifact"
            exit 1
          elif [ "${PUBLISH_JAVA_WASM:-}" != "true" ]; then
            echo "::notice::APRV_PUBLISH_JAVA_WASM is not true — the -wasm artifact $VERSION is held; skipping the -wasm upload."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif curl -fsSL "https://repo1.maven.org/maven2/io/github/emindeniz99/apple-purchase-receipt-verifier-wasm/$VERSION/" >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "Central already has the -wasm artifact $VERSION; a dry run builds it anyway."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Central already has the -wasm artifact $VERSION — skipping it."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # setup-java writes the settings.xml server entry (id `central`, the
      # pom's publishingServerId) with env-var placeholders and imports the
      # GPG key; the actual values only ever exist as env vars on the mvn
      # step below.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.gate.outputs.publish == 'true' || steps.gate-wasm.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy to Central (tests, sources, javadoc, GPG, upload)
        if: steps.gate.outputs.publish == 'true'
        working-directory: java
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # A dry run builds and tests, unsigned (gpg.skip; the environment
          # hands it no key). skipPublishing is the central-publishing-maven-
          # plugin's switch that stages nothing, so no bundle is written and
          # nothing reaches the portal.
          if [ "$DRY_RUN" = "true" ]; then
            mvn -B -P central deploy -DskipPublishing=true -Dgpg.skip=true
          else
            mvn -B -P central deploy
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.gate-wasm.outputs.publish == 'true'
        with:
          name: aprv-wasm-release
          path: ${{ runner.temp }}/aprv
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.gate-wasm.outputs.publish == 'true'
        with:
          pattern: aprv-server-*-linux-musl
          path: ${{ runner.temp }}/server

      # The module against build-wasm's hash; the two binaries side by side
      # with a SHA256SUMS naming exactly them, which the jar carries as the
      # pins its maven() and github() sources check (the committed
      # src/main/server/SHA256SUMS pins a development build only).
      - name: the module is build-wasm's, the binaries are build-server's
        if: steps.gate-wasm.outputs.publish == 'true'
        env:
          WASM_SHA256: ${{ needs.build-wasm.outputs.wasm-sha256 }}
        run: |
          set -euo pipefail
          echo "$WASM_SHA256  $RUNNER_TEMP/aprv/aprv.wasm" | sha256sum -c -
          d="$RUNNER_TEMP/dist"
          mkdir -p "$d"
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            install -m 0755 "$RUNNER_TEMP/server/aprv-server-$t/aprv-$t" "$d/aprv-$t"
          done
          (cd "$d" && sha256sum aprv-x86_64-unknown-linux-musl aprv-aarch64-unknown-linux-musl > SHA256SUMS)
          cat "$d/SHA256SUMS"

      # A dry run without a tag: the pin is written here as release-please
      # would write it, from the component and module checked against
      # build-wasm's hashes, in this checkout only (build-wasm's dry-run
      # step says why and reports what changed).
      - name: "dry run: refresh the pins in this checkout, as release-please would"
        if: ${{ inputs.dry_run && !inputs.tag && steps.gate-wasm.outputs.publish == 'true' }}
        env:
          COMPONENT_SHA256: ${{ needs.build-wasm.outputs.component-sha256 }}
        run: |
          set -euo pipefail
          echo "$COMPONENT_SHA256  $RUNNER_TEMP/aprv/aprv.component.wasm" | sha256sum -c -
          tools/refresh-wasm-pins.sh "$RUNNER_TEMP/aprv/aprv.wasm" "$RUNNER_TEMP/aprv/aprv.component.wasm"

      # The property names are the -wasm build's (java-wasm/CI-NOTES.md): the
      # module Endive compiles, the two binaries attached as classifiers, and
      # the SHA256SUMS that pins them. The validate phase also refuses a
      # module whose hash differs from java-wasm/src/main/wasm/aprv.wasm.sha256,
      # which release-please.yml rewrote on the release branch (in a dry run,
      # the step above).
      - name: Deploy the -wasm artifact and its classifier jars to Central
        if: steps.gate-wasm.outputs.publish == 'true'
        working-directory: java-wasm
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          skip=()
          if [ "$DRY_RUN" = "true" ]; then skip=(-DskipPublishing=true -Dgpg.skip=true); fi
          mvn -B -P central deploy "${skip[@]}" \
            "-Daprv.wasm=$RUNNER_TEMP/aprv/aprv.wasm" \
            "-Daprv.server.linux-x86_64=$RUNNER_TEMP/dist/aprv-x86_64-unknown-linux-musl" \
            "-Daprv.server.linux-aarch64=$RUNNER_TEMP/dist/aprv-aarch64-unknown-linux-musl" \
            "-Daprv.server.sha256sums=$RUNNER_TEMP/dist/SHA256SUMS"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ steps.gate-wasm.outputs.publish == 'true' && !inputs.dry_run }}
        with:
          subject-path: java-wasm/target/apple-purchase-receipt-verifier-wasm-*.jar

      # The jars Central would have received (the -wasm ones only when its
      # gate let them build), unsigned: skipPublishing writes no bundle.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.dry_run && (steps.gate.outputs.publish == 'true' || steps.gate-wasm.outputs.publish == 'true') }}
        with:
          name: dry-run-maven
          path: |
            java/target/*.jar
            java-wasm/target/*.jar
          if-no-files-found: error
          retention-days: 30

  publish-rubygems:
    name: publish ruby to RubyGems.org
    runs-on: ubuntu-latest
    needs: [ci-passed, build-wasm]
    timeout-minutes: 20
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    outputs:
      # 'true' when RubyGems is expected to serve this version by the time the
      # job is done: it either published it here or already had it. 'false'
      # only when the bootstrap has not happened. The smoke workflow gates its
      # rubygems leg on this.
      available: ${{ steps.adjudicate.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one aprv.wasm build-wasm made and attested, checked by hash; the
      # package build reads it from APRV_WASM / APRV_COMPONENT and never
      # compiles the module itself (.github/CI-NOTES.md).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm-release
          path: ${{ runner.temp }}/aprv
      - name: the module is build-wasm's
        env:
          WASM_SHA256: ${{ needs.build-wasm.outputs.wasm-sha256 }}
          COMPONENT_SHA256: ${{ needs.build-wasm.outputs.component-sha256 }}
        run: |
          set -euo pipefail
          echo "$WASM_SHA256  $RUNNER_TEMP/aprv/aprv.wasm" | sha256sum -c -
          echo "$COMPONENT_SHA256  $RUNNER_TEMP/aprv/aprv.component.wasm" | sha256sum -c -
          { echo "APRV_WASM=$RUNNER_TEMP/aprv/aprv.wasm"; echo "APRV_COMPONENT=$RUNNER_TEMP/aprv/aprv.component.wasm"; } >> "$GITHUB_ENV"

      # This does NOT decide whether to publish — see the adjudication step
      # below. RubyGems supports a *pending* trusted publisher, so the first
      # publish is meant to go through this job for a gem that does not exist
      # yet, and gating on existence would skip exactly the run the pending
      # publisher was created for. The lookup only supplies the second half of
      # the answer when OIDC fails: no gem AND no credentials means the
      # bootstrap has not happened; a gem that exists means a real auth
      # failure. Anything but 200 or 404 fails the job here, so an outage
      # cannot be read as "never bootstrapped".
      - name: Ask whether the gem exists, to interpret an OIDC failure later
        id: bootstrap
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            https://rubygems.org/api/v1/gems/apple-purchase-receipt-verifier.json)
          case "$code" in
            200) echo "gem apple-purchase-receipt-verifier exists on RubyGems.org"
                 echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "gem apple-purchase-receipt-verifier does not exist yet; a pending trusted publisher can still authorize this run"
                 echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::rubygems.org answered $code for the gem lookup; refusing to guess whether it is bootstrapped"
              exit 1 ;;
          esac

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: false

      # continue-on-error so the next step can tell an unfinished bootstrap
      # from a broken one. It applies to THIS step only: `gem push` below still
      # fails the job, and this step's own post-action still revokes the
      # short-lived token.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        if: ${{ !inputs.dry_run }}
        id: auth
        continue-on-error: true

      # `outcome`, not `conclusion`: continue-on-error rewrites conclusion to
      # success, and outcome is what the step actually did.
      - name: Decide whether an OIDC failure is a missing bootstrap or a real one
        id: adjudicate
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          GEM_EXISTS: ${{ steps.bootstrap.outputs.exists }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: no credentials were requested; building the gem without pushing it"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$AUTH_OUTCOME" = "success" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$GEM_EXISTS" = "false" ]; then
            echo "::notice::RubyGems has no gem named apple-purchase-receipt-verifier and no trusted publisher would authorize this workflow, so the bootstrap has not happened yet. Skipping the Ruby publish; see BOOTSTRAP.md, section \"RubyGems\"."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the gem exists on RubyGems.org but trusted publishing did not authorize this workflow; this is a real authentication failure, not a missing bootstrap"
            exit 1
          fi

      - name: Skip if this version is already on RubyGems.org
        id: gate
        if: steps.adjudicate.outputs.proceed == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(cat version.txt)
          if curl -fsSL "https://rubygems.org/api/v2/rubygems/apple-purchase-receipt-verifier/versions/$VERSION.json" >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "RubyGems already has $VERSION; a dry run builds it anyway."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "RubyGems already has $VERSION — skipping publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # A dry run without a tag: the pin is written here as release-please
      # would write it, in this checkout only (build-wasm's dry-run step
      # says why and reports what changed).
      - name: "dry run: refresh the pins in this checkout, as release-please would"
        if: ${{ inputs.dry_run && !inputs.tag && steps.gate.outputs.publish == 'true' }}
        run: tools/refresh-wasm-pins.sh "$RUNNER_TEMP/aprv/aprv.wasm" "$RUNNER_TEMP/aprv/aprv.component.wasm"

      # The gemspec and the library read no environment variable, so the
      # release module is copied to where the gem packs it, with its pin
      # (release-please.yml already rewrote the tracked one to this hash;
      # in a dry run, the step above did).
      - name: Build the gem around build-wasm's module
        if: steps.gate.outputs.publish == 'true'
        working-directory: ruby
        env:
          WASM_SHA256: ${{ needs.build-wasm.outputs.wasm-sha256 }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/aprv/aprv.wasm" lib/apple_purchase_receipt_verifier/aprv.wasm
          (cd lib/apple_purchase_receipt_verifier && sha256sum -c aprv.wasm.sha256)
          test "$(cut -c1-64 lib/apple_purchase_receipt_verifier/aprv.wasm.sha256)" = "$WASM_SHA256"
          gem build apple-purchase-receipt-verifier.gemspec

      # The Ruby shape of the two empty npm releases is spec.files — a Dir[]
      # glob — losing a file: a gem that installs and requires cleanly, then
      # raises the first time anyone uses it. Apple's roots are inside the
      # module now, so the module, its pin and the licence texts of the code
      # in it are what the list checks beside the entry points.
      - name: Refuse to publish a gem missing its entry point or its module
        if: steps.gate.outputs.publish == 'true'
        working-directory: ruby
        run: |
          set -euo pipefail
          ruby -rrubygems/package -e '
            files = Gem::Package.new(Dir["apple-purchase-receipt-verifier-*.gem"].first).spec.files
            want  = ["lib/apple_purchase_receipt_verifier.rb",
                     "lib/apple-purchase-receipt-verifier.rb",
                     "lib/apple_purchase_receipt_verifier/aprv.wasm",
                     "lib/apple_purchase_receipt_verifier/aprv.wasm.sha256",
                     "licenses/NOTICE"]
            missing = want - files
            abort("refusing to publish: gem is missing #{missing.join(", ")}") unless missing.empty?
            puts "gem carries #{files.size} files, entry points and module included"'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.dry_run && steps.gate.outputs.publish == 'true' }}
        with:
          name: dry-run-rubygems
          path: ruby/apple-purchase-receipt-verifier-*.gem
          if-no-files-found: error
          retention-days: 30

      - name: gem push
        if: ${{ steps.gate.outputs.publish == 'true' && !inputs.dry_run }}
        working-directory: ruby
        run: gem push apple-purchase-receipt-verifier-*.gem

  # Held (OD-03 in docs/rust-core/STATUS.md): the core stays at 0.7 on
  # crates.io until openssl-sys accepts openssl-src 400.x. A registry build
  # of this tree would pull openssl-src 300.x (OpenSSL 3), which
  # aprv-openssl's build script refuses, and aprv-openssl itself is not on
  # crates.io yet. The job runs again once the owner sets the repository
  # variable APRV_PUBLISH_CRATES to true; before that, it must learn to
  # publish rust/openssl first, at the same version, and aprv-openssl needs
  # its one manual bootstrap publish (BOOTSTRAP.md, crates.io). The smoke
  # job below treats the skip like an unbootstrapped registry.
  publish-crates:
    name: publish rust to crates.io
    if: vars.APRV_PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    needs: ci-passed
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      # See publish-rubygems for what this means.
      available: ${{ steps.bootstrap.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # crates.io's trusted publishing is configured on the crate's own
      # settings page, so a crate that does not exist cannot have one, and
      # crates-io-auth-action fails with "No Trusted Publishing config found
      # for repository" (v0.4.0, run 7). Ask first. crates.io rejects a request
      # with no User-Agent with 403, which the case below turns into a loud
      # failure rather than a silent skip.
      - name: Detect whether the crate has been bootstrapped at all
        id: bootstrap
        env:
          UA: apple-purchase-receipt-verifier release workflow (https://github.com/emindeniz99/apple-purchase-receipt-verifier)
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" \
            https://crates.io/api/v1/crates/apple-purchase-receipt-verifier)
          case "$code" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "::notice::crates.io has no crate named apple-purchase-receipt-verifier, so its trusted publisher cannot exist yet. Skipping the Rust publish; see BOOTSTRAP.md, section \"crates.io\"."
              echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io answered $code for the crate lookup; refusing to guess whether it is bootstrapped"
              exit 1 ;;
          esac

      - run: rustup toolchain install stable --profile minimal
        if: steps.bootstrap.outputs.exists == 'true'

      # The sparse index answers 404 for an unpublished crate and a
      # JSON-lines version list for a published one. A crates.io publish is
      # irrevocable — a yank hides a version, it never deletes it — which is
      # what makes this gate load-bearing rather than a convenience.
      - name: Skip if this version is already on crates.io
        id: gate
        if: steps.bootstrap.outputs.exists == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(cat version.txt)
          if curl -fsSL https://index.crates.io/ap/pl/apple-purchase-receipt-verifier \
             | grep -q "\"vers\":\"$VERSION\""; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "crates.io already has $VERSION; a dry run builds it anyway."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "crates.io already has $VERSION — skipping publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Cargo.toml excludes tests/ and fuzz/, so the published file set is not
      # the repository file set. Prove the library and its anchors are in it
      # before the upload, since a crates.io version cannot be withdrawn.
      - name: Prove the crate carries the library and its roots
        if: steps.gate.outputs.publish == 'true'
        working-directory: rust
        run: |
          set -euo pipefail
          cargo package --locked --list > "$RUNNER_TEMP/crate-files.txt"
          for entry in src/lib.rs \
                       certs/AppleIncRootCertificate.cer \
                       certs/AppleRootCA-G2.cer \
                       certs/AppleRootCA-G3.cer; do
            grep -qx "$entry" "$RUNNER_TEMP/crate-files.txt" \
              || { echo "::error::the crate is missing $entry"; exit 1; }
          done
          echo "crate carries $(wc -l < "$RUNNER_TEMP/crate-files.txt") files, library and roots included"

      # Exchanges the GitHub OIDC token for a short-lived crates.io token and
      # revokes it in a post step, so no registry token lives in this repo.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: ${{ steps.gate.outputs.publish == 'true' && !inputs.dry_run }}
        id: auth

      # --locked: publish the dependency graph CI tested, and fail if
      # rust/Cargo.lock is stale rather than resolving something new at the
      # one moment that cannot be undone (a crates.io version is forever).
      - run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --locked --dry-run
          else
            cargo publish --locked
          fi
        if: steps.gate.outputs.publish == 'true'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.dry_run && steps.gate.outputs.publish == 'true' }}
        with:
          name: dry-run-crates
          path: rust/target/package/*.crate
          if-no-files-found: error
          retention-days: 30

  publish-nuget:
    name: publish dotnet to NuGet
    runs-on: ubuntu-latest
    needs: [ci-passed, build-wasm]
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write          # NuGet trusted publishing (OIDC)
    outputs:
      # See publish-rubygems for what this means.
      available: ${{ steps.bootstrap.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one aprv.wasm build-wasm made and attested, checked by hash; the
      # package build reads it from APRV_WASM / APRV_COMPONENT and never
      # compiles the module itself (.github/CI-NOTES.md).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aprv-wasm-release
          path: ${{ runner.temp }}/aprv
      - name: the module is build-wasm's
        env:
          WASM_SHA256: ${{ needs.build-wasm.outputs.wasm-sha256 }}
          COMPONENT_SHA256: ${{ needs.build-wasm.outputs.component-sha256 }}
        run: |
          set -euo pipefail
          echo "$WASM_SHA256  $RUNNER_TEMP/aprv/aprv.wasm" | sha256sum -c -
          echo "$COMPONENT_SHA256  $RUNNER_TEMP/aprv/aprv.component.wasm" | sha256sum -c -
          { echo "APRV_WASM=$RUNNER_TEMP/aprv/aprv.wasm"; echo "APRV_COMPONENT=$RUNNER_TEMP/aprv/aprv.component.wasm"; } >> "$GITHUB_ENV"

      # NuGet's trusted publishing cannot create a package, so a trust policy
      # for one that does not exist cannot be saved either, and NuGet/login
      # fails with "No matching trust policy owned by user" (v0.4.0, run 7).
      # The flat container index lists every version of an id and 404s for an
      # unknown one; the id is lowercased there.
      - name: Detect whether the package has been bootstrapped at all
        id: bootstrap
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            https://api.nuget.org/v3-flatcontainer/applepurchasereceiptverifier/index.json)
          case "$code" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "::notice::nuget.org has no package ApplePurchaseReceiptVerifier, so its trust policy cannot exist yet. Skipping the .NET publish; see BOOTSTRAP.md, section \"NuGet\"."
              echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::nuget.org answered $code for the package lookup; refusing to guess whether it is bootstrapped"
              exit 1 ;;
          esac

      # 10.0.x, the SDK that wrote the packages.lock.json files: an older
      # band asks for another implicit ILLink version and trips locked-mode
      # restore with NU1004 (ci.yml's dotnet-mono explains it).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.bootstrap.outputs.exists == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Skip if this version is already on nuget.org
        id: gate
        if: steps.bootstrap.outputs.exists == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(cat version.txt)
          if curl -fsSL "https://api.nuget.org/v3-flatcontainer/applepurchasereceiptverifier/$VERSION/applepurchasereceiptverifier.$VERSION.nupkg" -o /dev/null; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "nuget.org already has $VERSION; a dry run builds it anyway."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "nuget.org already has $VERSION — skipping publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        if: steps.gate.outputs.publish == 'true'
        working-directory: dotnet
        run: dotnet pack src/ApplePurchaseReceiptVerifier -c Release -o "$RUNNER_TEMP/nupkg"

      # The package is what consumers receive: prove both target-framework
      # assets are in it before it reaches the registry.
      - name: Prove the package carries both assets
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          PKG=$(ls "$RUNNER_TEMP"/nupkg/ApplePurchaseReceiptVerifier.*.nupkg)
          for entry in lib/netstandard2.0/ApplePurchaseReceiptVerifier.dll \
                       lib/net8.0/ApplePurchaseReceiptVerifier.dll \
                       README.md; do
            unzip -l "$PKG" | grep -q "$entry" \
              || { echo "::error::the package is missing $entry"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.dry_run && steps.gate.outputs.publish == 'true' }}
        with:
          name: dry-run-nuget
          path: ${{ runner.temp }}/nupkg/
          if-no-files-found: error
          retention-days: 30
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        if: ${{ steps.gate.outputs.publish == 'true' && !inputs.dry_run }}
        id: nuget-login
        with:
          user: emindeniz99

      - name: Push
        if: ${{ steps.gate.outputs.publish == 'true' && !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "$RUNNER_TEMP"/nupkg/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

  # Go has no registry: proxy.golang.org serves the module from the git
  # repository, and a module in the subdirectory go/ is published by a tag
  # named go/vX.Y.Z. The plain vX.Y.Z tag release-please creates does not
  # publish it. Nothing is uploaded, so this is a tag plus a proxy fetch —
  # and a published Go version is immutable, its hash recorded in
  # sum.golang.org forever, so the tag is never moved or deleted.
  tag-go-module:
    name: tag the go module at this release
    runs-on: ubuntu-latest
    # build-wasm proved the committed go/ copy of aprv.wasm is the module this
    # release built; a go/v* tag cannot be moved afterwards.
    needs: [ci-passed, build-wasm]
    timeout-minutes: 15
    permissions:
      contents: write     # the only job in this workflow that needs it
    steps:
      # No checkout: the ref is created through the API, so no credential is
      # ever written to disk and persist-credentials never applies.
      # //go:embed needs the module in the tree the tag names (R14:
      # go/internal/wasm/aprv.wasm is committed, and build-wasm proved it
      # is this release's). A tag without it would be a module nobody
      # can build, forever, so this refuses before the tag exists.
      - name: the tree carries the committed module and its pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in go/internal/wasm/aprv.wasm go/internal/wasm/aprv.wasm.sha256; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$f?ref=$GITHUB_SHA" --jq .path >/dev/null \
              || { echo "::error::$f is not committed at $GITHUB_SHA; not tagging the Go module"; exit 1; }
          done
      - name: create go/vX.Y.Z and warm the proxy
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.tag || github.ref_name }}          # vX.Y.Z
        run: |
          set -euo pipefail
          TAG="go/${REF}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — skipping (re-runs are safe)."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
            echo "created $TAG at $GITHUB_SHA"
          fi
          # "Publishing" is a proxy fetch. Warm it so pkg.go.dev indexes the
          # version and the checksum-database entry exists before consumers
          # arrive.
          MOD="github.com/$GITHUB_REPOSITORY/go"
          resolved=false
          for attempt in $(seq 1 10); do
            if GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod \
               go list -m "$MOD@${REF}"; then resolved=true; break; fi
            echo "proxy has not picked up ${REF} yet (attempt $attempt of 10); waiting 30s"
            sleep 30
          done
          if [ "$resolved" != true ]; then
            echo "::error::$MOD@${REF} never became resolvable from proxy.golang.org"
            exit 1
          fi
          # The module zip is what consumers receive, and the embedded
          # aprv.wasm is a file an embed pattern cannot reach outside the
          # module for (the roots are compiled into it). Prove the zip
          # carries the library and the module with its pin.
          curl -fsSL "https://proxy.golang.org/${MOD}/@v/${REF}.zip" -o "$RUNNER_TEMP/module.zip"
          for entry in "verifier.go" "internal/wasm/aprv.wasm" "internal/wasm/aprv.wasm.sha256"; do
            unzip -l "$RUNNER_TEMP/module.zip" | grep -q "$entry" \
              || { echo "::error::the module zip is missing $entry"; exit 1; }
          done
          echo "module zip carries the library and aprv.wasm with its pin"

  # php/SHA256SUMS, which bin/aprv-install checks a download against, is
  # committed on the release branch before this tag exists, from the Linux
  # binaries that branch's run built (they reproduce:
  # tools/reproduce-server.sh). Every line must match the asset this run
  # built and published, under this tag, or a Composer user would be told
  # the release's own binary is not the release's. It fails the release
  # before Packagist imports the tag. Every line must be one the installer
  # reads, and the file the two Linux lines. The assets are laid out as
  # <tag>/<asset>, the paths the file names, and sha256sum -c --strict
  # checks them: a line for another tag names a file that is not there.
  # No repository code runs next to the downloaded files.
  php-binaries:
    name: the binaries php/SHA256SUMS pins are the published ones
    needs: [build-server, release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aprv-server-*
          path: ${{ runner.temp }}/in
      # A dry run without a tag has no release branch, and after a core or
      # server change the committed file pins another build. It is written
      # here from this run's binaries the way release-please.yml's
      # refresh-wasm-copies writes it, in this checkout only and never
      # committed, so the step below still proves the file's grammar and
      # the <tag>/<asset> layout (its hash check is then this run's
      # binaries against themselves). A change is a warning, as in
      # build-wasm; a dry run with a tag checks the committed file.
      - name: "dry run: write php/SHA256SUMS in this checkout, as release-please would"
        if: ${{ inputs.dry_run && !inputs.tag }}
        run: |
          set -euo pipefail
          version="$(cat version.txt)"
          mkdir -p "$RUNNER_TEMP/php-sums/v$version"
          cp "$RUNNER_TEMP/in/aprv-server-x86_64-unknown-linux-musl/aprv-x86_64-unknown-linux-musl" \
            "$RUNNER_TEMP/in/aprv-server-aarch64-unknown-linux-musl/aprv-aarch64-unknown-linux-musl" \
            "$RUNNER_TEMP/php-sums/v$version/"
          (cd "$RUNNER_TEMP/php-sums" && sha256sum "v$version"/*) > "$RUNNER_TEMP/SHA256SUMS"
          if cmp -s "$RUNNER_TEMP/SHA256SUMS" php/SHA256SUMS; then
            echo "dry run: php/SHA256SUMS already pins this run's binaries"
          else
            cp "$RUNNER_TEMP/SHA256SUMS" php/SHA256SUMS
            echo "::warning::dry run: php/SHA256SUMS would be refreshed by release-please (written in this checkout only, not committed)"
          fi
          cat php/SHA256SUMS
      - env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # A dry run from a branch has no tag; the pinned lines name the
          # tree's version, so lay the binaries out under it.
          if [ "$DRY_RUN" = "true" ] && [[ "$TAG" != v[0-9]* ]]; then TAG="v$(cat version.txt)"; fi
          sums="$PWD/php/SHA256SUMS"
          if [ ! -s "$sums" ]; then
            echo "::error file=php/SHA256SUMS::php/SHA256SUMS is empty: this release pins no aprv binary"
            exit 1
          fi
          # sha256sum -c also reads lines the installer refuses (a
          # binary-mode *, a CR before the LF), so it alone would pass a
          # file every Composer user is then refused. Each line must be
          # the installer's grammar, and the file the two Linux lines.
          line='^[0-9a-f]{64}  v[0-9A-Za-z.+-]+/aprv-[^/[:space:]]+$'
          if bad="$(LC_ALL=C grep -Evn -- "$line" "$sums")"; then
            printf '%s\n' "$bad" | cat -v
            echo "::error file=php/SHA256SUMS::the lines above are not <sha256>  <tag>/<asset> as sha256sum's text mode writes it and bin/aprv-install reads it"
            exit 1
          fi
          if [ "$(LC_ALL=C grep -c '' "$sums")" != 2 ]; then
            echo "::error file=php/SHA256SUMS::php/SHA256SUMS must pin exactly the two Linux musl binaries"
            exit 1
          fi
          for asset in aprv-x86_64-unknown-linux-musl aprv-aarch64-unknown-linux-musl; do
            if [ "$(LC_ALL=C grep -c -- "/$asset\$" "$sums" || true)" != 1 ]; then
              echo "::error file=php/SHA256SUMS::php/SHA256SUMS must pin $asset exactly once"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/published/$TAG"
          cp "$RUNNER_TEMP"/in/aprv-server-*/aprv-* "$RUNNER_TEMP/published/$TAG/"
          cd "$RUNNER_TEMP/published"
          sha256sum -c --strict "$sums"

  # workflow_run does not fire for a run that was itself dispatched with the
  # workflow token (the same suppression that hid the tag push from this
  # workflow), so the smoke test is dispatched explicitly once every
  # registry that could be published has been.
  #
  # The condition is `!cancelled()` plus one explicit result check per job
  # rather than `always()`: a failed publish must still block the smoke test,
  # and a bootstrap-skipped job concludes success (its steps skipped, not the
  # job), so `success` alone would already cover today's shape — `skipped` is
  # accepted too so that turning any of the three into a job-level `if:` later
  # cannot silently stop dispatching.
  smoke:
    name: dispatch the post-publish smoke test
    needs: [publish-pypi, publish-npm, publish-maven, publish-rubygems,
            publish-crates, publish-nuget, tag-go-module, release-assets,
            publish-image, php-binaries]
    if: >-
      !cancelled()
      && !inputs.dry_run
      && needs.release-assets.result == 'success'
      && needs.php-binaries.result == 'success'
      && needs.publish-image.result == 'success'
      && needs.publish-pypi.result == 'success'
      && needs.publish-npm.result == 'success'
      && needs.publish-maven.result == 'success'
      && needs.tag-go-module.result == 'success'
      && (needs.publish-rubygems.result == 'success' || needs.publish-rubygems.result == 'skipped')
      && (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped')
      && (needs.publish-nuget.result == 'success' || needs.publish-nuget.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # npm, PyPI, Maven Central, SwiftPM and the Go proxy are unconditional:
      # their jobs must have succeeded for this one to run at all. The three
      # bootstrap-gated registries are named only when they actually carry
      # the version, so the smoke workflow skips their legs instead of
      # failing on an install that cannot work. Packagist is the fourth:
      # it has no publish job (php-binaries pins the binaries; Packagist
      # imports the tag itself), so the question is asked here.
      - name: dispatch post-publish-smoke for this version
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.tag || github.ref_name }}
          RUBYGEMS_AVAILABLE: ${{ needs.publish-rubygems.outputs.available }}
          CRATES_AVAILABLE: ${{ needs.publish-crates.outputs.available }}
          NUGET_AVAILABLE: ${{ needs.publish-nuget.outputs.available }}
        run: |
          set -euo pipefail
          REGISTRIES="npm,pypi,maven,swiftpm,go"
          # Packagist has no publish job: the tag is the release, and the
          # php leg waits for Packagist to import it. That wait only makes
          # sense once the owner has submitted the repository (BOOTSTRAP.md,
          # "Packagist (PHP)"): before that the package does not exist and
          # the leg failed after 20 minutes (0.8.1). A 404 is that unfinished
          # bootstrap, so the leg is left out; any other answer keeps it in,
          # so an outage is reported by the leg rather than read as "never
          # submitted".
          # Bounded well inside the job's 5 minutes: a stalled answer must
          # not keep every other leg from being dispatched. A timeout is 000.
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' \
            https://repo.packagist.org/p2/emindeniz99/apple-purchase-receipt-verifier.json || true)
          if [ "$code" = "404" ]; then
            echo "::notice::Packagist has no package emindeniz99/apple-purchase-receipt-verifier. Skipping the php smoke leg; see BOOTSTRAP.md, section \"Packagist (PHP)\"."
          else
            REGISTRIES="$REGISTRIES,php"
          fi
          if [ "${RUBYGEMS_AVAILABLE:-}" = "true" ]; then
            REGISTRIES="$REGISTRIES,rubygems"
          fi
          if [ "${CRATES_AVAILABLE:-}" = "true" ]; then
            REGISTRIES="$REGISTRIES,crates"
          fi
          if [ "${NUGET_AVAILABLE:-}" = "true" ]; then
            REGISTRIES="$REGISTRIES,nuget"
          fi
          echo "smoke-testing: $REGISTRIES"
          gh workflow run post-publish-smoke.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$REF" -f "version=${REF#v}" -f "registries=$REGISTRIES"
