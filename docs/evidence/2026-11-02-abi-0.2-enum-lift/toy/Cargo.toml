[package]
name = "spike-enum"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The variant under test: generated lifts checked (enum discriminant, UTF-8).
[profile.wasmchecked]
inherits = "wasm"

[profile.wasmchecked.package.spike-enum]
debug-assertions = true
