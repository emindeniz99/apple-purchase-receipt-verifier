[package]
name = "aprv-jni"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "aprv_jni"

[dependencies]
aprv = { package = "apple-purchase-receipt-verifier", path = "$REPO/rust" }
jni = { version = "0.22.4", default-features = false }

[profile.release]
panic = "unwind"
strip = true
