[package]
name = "aprv-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aprv = { package = "apple-purchase-receipt-verifier", path = "../../../../rust", default-features = false }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
