[package]
name = "tzspike-tzdb-data"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
tzdb_data = { version = "=0.2.5" }
tz-rs = { version = "0.7", default-features = false }

# Same as rust/Cargo.toml [profile.wasm] (opt-level 3, lto, 1 CGU, abort),
# plus strip, since build.sh strips the name section from aprv.wasm.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
