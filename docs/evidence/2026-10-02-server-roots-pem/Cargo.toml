# Throwaway differential harness: aprv-server's `--roots` file reader before
# and after the `pem` crate took over its PEM blocks. CI builds none of it.
[package]
name = "server-roots-pem-diff"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
pem = { version = "4", default-features = false, features = ["std"] }
