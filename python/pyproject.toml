[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-purchase-receipt-verifier"
version = "0.11.0"
description = "Verify Apple in-app purchases locally (StoreKit 2 JWS + legacy PKCS#7 receipts) with zero Apple server calls"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# wasmtime runs aprv.wasm (docs/rust-core R27): at or above the tested
# major, deliberately with no upper pin to one major. platformdirs names the
# compile cache's default directory. Its floor, 4.12.0, is the oldest
# release that names that directory as every newer one does: an absolute
# XDG_CACHE_HOME honoured on Linux and macOS (since 4.6.0), a relative one
# ignored (since 4.11.8), and no home directory an error rather than a
# relative "~/..." path (since 4.12.0); see
# docs/evidence/2026-10-04-python-platformdirs-floor.md.
dependencies = [
    "wasmtime>=49",
    "platformdirs>=4.12.0",
]

# PyPI renders these as sidebar links; Changelog is the one registries
# don't surface on their own.
[project.urls]
Homepage = "https://github.com/emindeniz99/apple-purchase-receipt-verifier"
Repository = "https://github.com/emindeniz99/apple-purchase-receipt-verifier"
Changelog = "https://github.com/emindeniz99/apple-purchase-receipt-verifier/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["apple_purchase_receipt_verifier"]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
apple_purchase_receipt_verifier = ["py.typed", "aprv.wasm", "aprv.wasm.sha256"]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "mypy>=1.11",
    # The install-failure test builds this source tree (setup.py).
    "setuptools>=70.1",
]

[tool.ruff]
target-version = "py310"
# The existing source already wraps at ~100 (longest line was 102); 88 would
# have reflowed nearly every signature and docstring in the package.
line-length = 100
src = ["apple_purchase_receipt_verifier", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.mypy]
# python_version pinned to the package's floor (requires-python = ">=3.10"),
# the lowest mypy 2.x supports.
python_version = "3.10"
files = ["apple_purchase_receipt_verifier", "tests"]
strict = true

# The test suite is checked under strict too, minus the three flags that
# demand annotations on every def: 33 of its helpers build ASN.1 and CMS
# structures by hand and typing them is a separate piece of work. Every other
# strict check (including check_untyped_defs) still applies to the tests.
[[tool.mypy.overrides]]
module = ["test_conformance"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
